<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© 2026 MOAPANG STUDIO (김은경). All rights reserved. 무단 복제·배포·변경 금지">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샌드박스 · 모아팡</title>
<link rel="icon" href="assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/moa.css">
<script src="js/scene.js" defer></script>
<style>
/* VOICE: 패들렛 샌드박스처럼 — 왼쪽 카드(쪽) 목록, 가운데 큰 카드 한 장, 오른쪽 도구. 선생님이 만들고 교실로 보내면
   학생은 반 화면 📋 모아보드 탭에서 함께 그리고 메모지를 붙임. 모둠 활동을 켜면 학생은 자기 모둠 카드만 봄.
   LAYOUT: 위 띠(이름 · 되돌리기 · 슬라이드쇼 · 모둠 · 교실로 보내기 · 설정) / 왼쪽 카드 / 가운데 판 / 오른쪽 도구 */
html,body{height:100%}
body.sbx{overflow:hidden}
body.sbx.scene::after{display:none}
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:140px minmax(0,1fr) 76px;grid-template-rows:auto minmax(0,1fr);padding-bottom:46px}
body.embed{background:#EEF1F6}
body.embed #app{padding-bottom:26px} /* 바깥 화면의 땅 띠에 가리지 않게 */
/* 위 띠 */
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:62px}
#top .brands{flex:none}
#top .ttl{flex:1;min-width:90px}
#top h1{margin:0;font:800 21px/1.25 'Noto Sans KR',sans-serif;color:#fff;text-shadow:0 2px 0 rgba(27,31,59,.55),0 3px 10px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top h1 button{all:unset;cursor:pointer;border-radius:6px}
#top h1 button:hover{text-decoration:underline;text-underline-offset:4px}
#top h1 button:focus-visible{outline:3px solid rgba(58,111,242,.75)}
#top small{display:block;font:600 13px/1.35 'Noto Sans KR',sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.embed #top{min-height:50px;padding:6px 10px}
body.embed #top h1{color:#1D2030;text-shadow:none;font-size:17px}
body.embed #top small{color:#6B7085;text-shadow:none}
body.embed #top .brands,body.embed #back{display:none}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 13px;border:0;border-radius:10px;background:rgba(255,255,255,.94);color:#1D2030;font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.2);white-space:nowrap;text-decoration:none}
.tb:hover{background:#fff}
.tb.ic{width:38px;padding:0;font-size:19px}
.tb.go{background:#3A6FF2;color:#fff}
.tb.go:hover{background:#2F5FD8}
.tb:disabled{opacity:.45;cursor:default}
.tb[aria-pressed=true]{background:#1D2030;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:#fff;font:800 13px 'Noto Sans KR',sans-serif;color:#1D2030;box-shadow:0 1px 3px rgba(16,24,40,.2);border:0;cursor:pointer;white-space:nowrap}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--g,#ccc);flex:none}
.save{font:600 12px 'Noto Sans KR',sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
body.embed .save{color:#6B7085;text-shadow:none}
.mw{position:relative}
.mn{position:absolute;right:0;top:calc(100% + 6px);z-index:40;display:flex;flex-direction:column;min-width:230px;padding:6px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.25)}
.mn button,.mn a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:none;text-align:left;font:500 14px 'Noto Sans KR',sans-serif;color:#1D2030;cursor:pointer;text-decoration:none;white-space:nowrap}
.mn button:hover,.mn a:hover,.mn button:focus-visible,.mn a:focus-visible{background:#F1F3F7}
.mn button:disabled{color:#A0A5B5;cursor:default;background:none}
.mn .del{color:#D92D20}
.mn hr{width:100%;margin:4px 0;border:0;border-top:1px solid #EEF0F4}
.mn small{padding:2px 12px 4px;font-size:12px;color:#6B7085;white-space:normal;max-width:260px}
/* 왼쪽 카드 목록 */
#rail{grid-row:2;overflow-y:auto;overflow-x:hidden;padding:2px 10px 24px 14px;scrollbar-width:thin}
#addCard{display:block;width:100%;height:44px;margin-bottom:12px;border:0;border-radius:12px;background:#1D2030;color:#fff;font:300 30px/1 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 2px 6px rgba(16,24,40,.25)}
#addCard:hover{background:#2C3048}
.cd{position:relative;margin-bottom:10px;padding:5px;border-radius:12px;background:rgba(29,32,48,.55)}
body.embed .cd{background:#DDE1E9}
.cd.on{background:#fff;box-shadow:0 0 0 3px #3A6FF2}
.cd.drop{box-shadow:0 -4px 0 #FFD23F}
.cd .th{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:7px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.25)}
.cd .th svg{display:block;width:100%;height:100%;pointer-events:none}
.cd .cr{display:flex;align-items:center;gap:4px;padding:4px 2px 0;color:#fff}
body.embed .cd .cr,.cd.on .cr{color:#1D2030}
.cd .cr b{font:800 12px 'Noto Sans KR',sans-serif}
.cd .cr span{flex:1;font:600 11px 'Noto Sans KR',sans-serif;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cd .dots{width:28px;height:22px;border:0;border-radius:6px;background:transparent;color:inherit;font:900 15px/1 'Noto Sans KR',sans-serif;cursor:pointer;letter-spacing:1px}
.cd .dots:hover,.cd .dots[aria-expanded=true]{background:rgba(127,127,127,.25)}
.gb{position:absolute;left:4px;top:4px;max-width:calc(100% - 8px);padding:1px 7px;border-radius:999px;background:var(--g);color:#1D2030;font:800 10px/1.5 'Noto Sans KR',sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rob{position:absolute;right:4px;bottom:4px;padding:0 5px;border-radius:6px;background:rgba(255,255,255,.92);font:700 10px/1.6 'Noto Sans KR',sans-serif}
#cmenuBox{position:fixed;right:auto;top:auto;z-index:45;min-width:250px;max-height:calc(100vh - 16px);overflow:auto}
/* 가운데 판 */
#mid{grid-row:2;position:relative;min-width:0;min-height:0}
#stageW{position:absolute;inset:0;overflow:auto;display:flex;padding:8px 12px 14px}
#stage{position:relative;margin:auto;flex:none;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(16,24,40,.18),0 16px 44px rgba(16,24,40,.25);overflow:hidden;touch-action:none}
#sv{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#stage[data-tool=pen],#stage[data-tool=line],#stage[data-tool=shape]{cursor:crosshair}
#stage[data-tool=text]{cursor:text}
#stage[data-tool=note]{cursor:copy}
#stage[data-tool=eraser]{cursor:cell}
#stage[data-tool=hand]{cursor:grab}
#stage[data-tool=hand].pan{cursor:grabbing}
#stage[data-tool=select] g.o.me{cursor:move}
g.o .ed{outline:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;min-height:1.2em;width:100%}
g.o .ed[contenteditable=true]{cursor:text;caret-color:#3A6FF2}
g.o .ed[contenteditable=true]:empty::before{content:attr(data-ph);color:rgba(29,32,48,.38)}
.tx{width:100%;height:100%;padding:6px 10px;line-height:1.35;box-sizing:border-box;border-radius:8px}
.nt{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:16px 18px;box-sizing:border-box;line-height:1.3;text-align:center;overflow:hidden}
.lk2{display:flex;align-items:center;gap:16px;width:100%;height:100%;padding:12px 18px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;color:#1D2030}
.lk2 i{font-style:normal;font-size:42px;flex:none}
.lk2 b{display:block;font-size:26px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lk2 small{display:block;font-size:18px;color:#3A6FF2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lk2 span{min-width:0;flex:1}
#clab{position:absolute;left:12px;top:10px;z-index:3;display:flex;gap:6px;pointer-events:none}
#clab span{padding:3px 12px;border-radius:999px;background:var(--g,#fff);font:800 14px/1.5 'Noto Sans KR',sans-serif;color:#1D2030;box-shadow:0 1px 4px rgba(0,0,0,.2)}
/* 템플릿 (빈 카드 아래) */
#tpl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 16px 14px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.96) 30%)}
#tpl p{margin:0 0 8px;font:600 14px 'Noto Sans KR',sans-serif;color:#6B7085}
.tgal{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin}
.tt{flex:none;width:clamp(96px,11vw,150px);padding:0;border:0;background:none;cursor:pointer;text-align:left}
.tt svg{display:block;width:100%;aspect-ratio:16/9;border:2px solid #1D2030;border-radius:8px;background:#fff}
.tt:hover svg,.tt:focus-visible svg{border-color:#3A6FF2;box-shadow:0 0 0 3px rgba(58,111,242,.25)}
.tt b{display:block;margin-top:5px;font:600 13px/1.3 'Noto Sans KR',sans-serif;color:#1D2030}
.tt.more svg{display:grid}
/* 고른 물건 위 작은 띠 */
#selbar{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(16,24,40,.28);white-space:nowrap}
.sb{display:grid;place-items:center;min-width:36px;height:36px;padding:0 6px;border:0;border-radius:8px;background:none;font:800 15px 'Noto Sans KR',sans-serif;color:#1D2030;cursor:pointer}
.sb:hover,.sb[aria-expanded=true]{background:#F1F3F7}
.sb[aria-pressed=true]{background:#1D2030;color:#fff}
.sb.del{color:#D92D20}
.sbs{width:1px;height:22px;background:#E4E7EC;margin:0 2px}
.cdot{display:block;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cdot.none{background:linear-gradient(135deg,#fff 45%,#E5484D 45% 55%,#fff 55%)!important}
.pop{position:absolute;z-index:7;display:flex;flex-wrap:wrap;gap:6px;max-width:260px;padding:10px;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(16,24,40,.25)}
.pop button{display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border:1px solid #E4E7EC;border-radius:8px;background:#fff;font:700 13px 'Noto Sans KR',sans-serif;cursor:pointer}
.pop button[aria-pressed=true]{outline:3px solid #3A6FF2;outline-offset:1px}
.pop .sw{width:30px;height:30px;min-width:0;padding:0;border-radius:50%}
/* 오른쪽 도구 */
#tools{grid-row:2;align-self:center;justify-self:center;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;padding:4px 0;scrollbar-width:none}
.tg{display:flex;flex-direction:column;gap:2px;padding:6px;background:#1D2030;border-radius:16px;box-shadow:0 6px 18px rgba(16,24,40,.3)}
.tl{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:11px;background:transparent;color:#fff;cursor:pointer}
.tl:hover{background:rgba(255,255,255,.14)}
.tl[aria-pressed=true]{background:#fff;color:#1D2030}
.tl:disabled{opacity:.35;cursor:default;background:none}
.tl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#opts{position:fixed;z-index:20;display:flex;flex-direction:column;gap:10px;width:220px;padding:12px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(16,24,40,.28)}
#opts b{font:800 13px 'Noto Sans KR',sans-serif;color:#3B3F52}
#opts .og{display:flex;flex-wrap:wrap;gap:6px}
#opts .og button{display:grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border:1px solid #E4E7EC;border-radius:8px;background:#fff;cursor:pointer;font:700 13px 'Noto Sans KR',sans-serif;color:#1D2030}
#opts .og button[aria-pressed=true]{outline:3px solid #3A6FF2;outline-offset:1px;border-color:#fff}
#opts .og .sw{width:28px;height:28px;min-width:0;padding:0;border-radius:50%}
#opts .og svg{width:26px;height:26px}
#opts p{margin:0;font-size:13px;color:#6B7085}
/* 확대 */
#zoom{position:absolute;left:14px;bottom:12px;z-index:5;display:flex;align-items:center;gap:2px;padding:3px;background:rgba(255,255,255,.95);border-radius:10px;box-shadow:0 2px 8px rgba(16,24,40,.2)}
#zoom button{min-width:32px;height:30px;border:0;border-radius:8px;background:none;font:800 14px 'Noto Sans KR',sans-serif;color:#1D2030;cursor:pointer}
#zoom button:hover{background:#F1F3F7}
#lockb{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;max-width:calc(100% - 40px);padding:7px 14px;border-radius:999px;background:rgba(29,32,48,.88);color:#fff;font:700 13px/1.4 'Noto Sans KR',sans-serif;text-align:center;pointer-events:none}
/* 모둠 고르기 · 기다리기 */
#gate{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:rgba(238,241,246,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
.gp{width:min(620px,100%);padding:22px 24px;background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(16,24,40,.25);text-align:center}
.gp h2{margin:0 0 6px;font-size:22px}
.gp p{margin:0 0 14px;color:#4B4F6B}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;text-align:left}
.gpick{display:flex;flex-direction:column;gap:4px;min-height:84px;padding:12px 14px;border:0;border-radius:14px;background:var(--g);cursor:pointer;color:#1D2030;box-shadow:0 2px 6px rgba(16,24,40,.15);text-align:left}
.gpick:hover{filter:brightness(1.05);transform:translateY(-1px)}
.gpick b{font:800 18px 'Noto Sans KR',sans-serif}
.gpick small{font:500 13px/1.4 'Noto Sans KR',sans-serif;color:#2B2F45}
.wait{font-size:46px;animation:sbw 1.6s ease-in-out infinite}
@keyframes sbw{50%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.wait{animation:none}}
/* 오른쪽에서 나오는 모둠 창 */
body.panel #app{right:400px}
#side{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(400px,100vw);display:flex;flex-direction:column;background:#fff;box-shadow:-10px 0 40px rgba(16,24,40,.25)}
.sph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #EEF0F4}
.sph h2{flex:1;margin:0;font-size:19px}
.spb{flex:1;overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}
.spb h3{margin:4px 0 0;font-size:15px}
.spb .note{margin:0;font-size:13px;line-height:1.55;color:#6B7085}
.swr{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;background:#F4F6FA;cursor:pointer}
.swr input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:#3A6FF2}
.swr b{display:block;font:800 15px 'Noto Sans KR',sans-serif}
.swr small{display:block;font-size:13px;line-height:1.5;color:#6B7085}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{min-height:44px;padding:4px 8px;border:1px solid #D5DAE3;border-radius:10px;background:#fff;font:700 13px/1.3 'Noto Sans KR',sans-serif;cursor:pointer;color:#1D2030}
.seg2 button[aria-pressed=true]{background:#1D2030;border-color:#1D2030;color:#fff}
.grow{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--g) 22%,#fff);border:2px solid var(--g)}
.grh{display:flex;align-items:center;gap:6px}
.grh i{width:14px;height:14px;border-radius:50%;background:var(--g);flex:none}
.grh b{flex:1;font:800 15px 'Noto Sans KR',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grh small{font:700 12px 'Noto Sans KR',sans-serif;color:#4B4F6B}
.ib{min-width:30px;height:30px;padding:0 8px;border:0;border-radius:8px;background:rgba(255,255,255,.85);font:700 13px 'Noto Sans KR',sans-serif;cursor:pointer;color:#1D2030}
.ib:hover{background:#fff}
.ib.del{color:#D92D20}
.mems{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 10px;border:1px solid #D5DAE3;border-radius:999px;background:#fff;font:700 13px 'Noto Sans KR',sans-serif;color:#1D2030;cursor:pointer}
.mc:hover{border-color:#E5484D}
.mc em{font-style:normal;color:#9AA0B2;font-weight:500}
.mc[aria-pressed=true]{background:#3A6FF2;border-color:#3A6FF2;color:#fff}
.mc[aria-pressed=true] em{color:#DCE6FF}
.put{margin-top:8px;width:100%;min-height:36px;border:2px dashed var(--g);border-radius:10px;background:#fff;font:800 13px 'Noto Sans KR',sans-serif;cursor:pointer;color:#1D2030}
.put:hover{background:#F7F9FC}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row2 select{min-height:36px;border:1px solid #D5DAE3;border-radius:8px;padding:0 8px;font:600 14px 'Noto Sans KR',sans-serif}
/* 창 */
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:20px}
.dlg .top2{display:flex;align-items:center;gap:8px}
.dlg .top2 h2{flex:1}
.dlg label.lb input,.dlg label.lb select{font-weight:500}
.ckl{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.ckl label{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #E4E7EC;border-radius:10px;cursor:pointer;background:#fff}
.ckl label:hover{background:#F7F9FC}
.ckl input{width:20px;height:20px;accent-color:#3A6FF2}
.ckl i{width:14px;height:14px;border-radius:4px;flex:none}
.ckl b{flex:1;font:700 15px 'Noto Sans KR',sans-serif}
.ckl small{color:#6B7085}
.ckl h4{margin:6px 0 0;font:800 13px 'Noto Sans KR',sans-serif;color:#6B7085}
.opt{display:flex;align-items:center;gap:8px;font:600 14px 'Noto Sans KR',sans-serif}
.opt input{width:20px;height:20px;accent-color:#3A6FF2}
.bgs{display:flex;flex-wrap:wrap;gap:8px}
.bgs button{width:44px;height:44px;border:1px solid #D5DAE3;border-radius:10px;cursor:pointer}
.bgs button[aria-pressed=true]{outline:3px solid #3A6FF2;outline-offset:2px}
.bgp button{width:auto;min-width:64px;padding:0 10px;background:#fff;font:700 13px 'Noto Sans KR',sans-serif}
.tpl2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tpl2 .tt{width:auto}
.done{display:flex;flex-direction:column;gap:8px}
.done div{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#F4F6FA}
.done div b{flex:1}
/* 슬라이드쇼 */
.ss{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#0E1018}
.ssm{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:16px}
.ssm svg{display:block;max-width:100%;max-height:100%;width:auto;height:100%;aspect-ratio:16/9;background:#fff;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ssb{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;color:#fff}
.ssb button{min-width:44px;height:40px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer}
.ssb button:hover{background:rgba(255,255,255,.24)}
.ssb button[aria-pressed=true]{background:#E5484D}

function fitText(el, o) {

function setZoom(z, keep) {

}
new ResizeObserver(() => layout()).observe(WRAP);

/* ---------- 저장 ---------- */
function drawSave() { $('save').textContent = S.saving ? '저장 중…' : S.saveErr ? '⚠ 저장 못 한 것이 있어요' : S.board ? '저장됨 ✓' : ''; }
async function saving(p) { S.saving++; drawSave(); try { const r = await p; S.saveErr = false; return r; } catch (e) { S.saveErr = true; throw e; } finally { S.saving--; drawSave(); } }
const errMsg = (e) => (/permission/i.test((e && e.code) || '') ? (S.teacher ? '권한이 없어요. 다시 로그인해 주세요.' : '여기에는 쓸 수 없어요. (선생님이 잠갔거나 다른 모둠 카드예요)') : errText(e));
function clean(o) { const d = {}; for (const k of KEYS) if (o[k] !== undefined && o[k] !== null) d[k] = typeof o[k] === 'number' ? r1(o[k]) : o[k]; if (typeof o.z === 'number') d.z = o.z; return d; }
const strip = (o) => { const d = Object.assign({}, o); delete d._rev; delete d.at; return d; };
function putLocal(id, data) { const o = Object.assign({}, data, { id, _rev: ++REV }); S.objs.set(id, o); markCard(o.c); return o; }
function stamp(o) {
  const d = Object.assign({}, o, { uid: me(), at: serverTimestamp() });
  if (d.n === undefined) { const nm = S.teacher ? '선생님' : (S.name || (ses && ses.name) || ''); if (nm) d.n = nm.slice(0, 20); }
  delete d.k; delete d.cl;
  if (!S.teacher && ses && ses.cid && ses.key && !ses.preview) { d.cl = ses.cid; d.k = ses.key; }
  return d;
}
async function commitOps(ops) {
  for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(fs); ops.slice(i, i + 400).forEach((f) => f(b)); await b.commit(); }
}
/** 물건 더하기 → 새 번호들 (저장은 뒤에서). raw: 기록에서 되살리기(쓴 사람 그대로) */
async function addObjs(list, { hist = true, raw = false } = {}) {
  if (!list.length) return [];
  const out = list.map((o) => {
    const id = o.id || doc(sbCol()).id;
    const d = raw ? Object.assign({}, clean(o), { at: serverTimestamp() }) : clean(stamp(o));
    putLocal(id, d); return Object.assign({ id }, d);
  });
  render();
  if (hist) pushHist({ k: 'add', list: out.map(strip) });
  saving(commitOps(out.map((o) => (b) => { const d = Object.assign({}, o); delete d.id; b.set(doc(sbCol(), o.id), d); })))
    .catch((e) => { out.forEach((o) => { S.objs.delete(o.id); markCard(o.c); }); render(); toast(errMsg(e), true); });
  return out.map((o) => o.id);
}
/** 고치기: [{ id, patch, before? }] */
async function updObjs(list, { hist = true } = {}) {
  const recs = [];
  for (const { id, patch, before } of list) {
    const o = S.objs.get(id); if (!o) continue;
    const p = clean(patch), bf = {};
    for (const k of Object.keys(p)) bf[k] = before && k in before ? before[k] : o[k];
    for (const k of Object.keys(bf)) if (bf[k] === undefined) { delete bf[k]; }
    putLocal(id, Object.assign(strip(o), { at: o.at }, p));
    recs.push({ id, before: bf, after: p });
  }
  if (!recs.length) return;
  render();
  if (hist) pushHist({ k: 'upd', list: recs });
  try { await saving(commitOps(recs.map((r) => (b) => b.update(doc(sbCol(), r.id), r.after)))); }
  catch (e) { recs.forEach((r) => { const o = S.objs.get(r.id); if (o) putLocal(r.id, Object.assign(strip(o), { at: o.at }, r.before)); }); render(); toast(errMsg(e), true); }
}
async function delObjs(ids, { hist = true } = {}) {
  const gone = ids.map((id) => S.objs.get(id)).filter(Boolean);
  if (!gone.length) return;
  gone.forEach((o) => { S.objs.delete(o.id); markCard(o.c); S.sel.delete(o.id); });
  render();
  if (hist) pushHist({ k: 'del', list: gone.map(strip) });
  try { await saving(commitOps(gone.map((o) => (b) => b.delete(doc(sbCol(), o.id))))); }
  catch (e) { gone.forEach((o) => putLocal(o.id, strip(o))); render(); toast(errMsg(e), true); }
}

/* ---------- 되돌리기 ---------- */
function pushHist(h) { S.hist.push(Object.assign({ card: S.cur }, h)); if (S.hist.length > 80) S.hist.shift(); S.fut = []; drawUndo(); }

async function applyHist(h, back) {
  if (h.card && h.card !== S.cur && visibleCards().some((c) => c.id === h.card)) switchCard(h.card);
  const ids = h.list.map((o) => o.id);
  if (h.k === 'add') { if (back) await delObjs(ids, { hist: false }); else await addObjs(h.list, { hist: false, raw: true }); }
  else if (h.k === 'del') { if (back) await addObjs(h.list, { hist: false, raw: true }); else await delObjs(ids, { hist: false }); }
  else if (h.k === 'upd') await updObjs(h.list.filter((r) => S.objs.has(r.id)).map((r) => ({ id: r.id, patch: back ? r.before : r.after })), { hist: false });
}

  const snap = await getDocs(query(collection(fs, 'classes'), ...ownQ()));
  return keepMine(snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))).filter((c) => !inTrash(c)).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
}

  $('sdGo').addEventListener('click', async () => {

function openPanel(v) { S.panel = v; $('side').hidden = !v; document.body.classList.toggle('panel', v); panelSig = ''; if (v) { if (!S.roster) loadRoster(); drawPanel(); } drawTop(); }
$('grpBtn').addEventListener('click', () => openPanel(!S.panel));
async function loadRoster() {
  S.roster = { loading: true, list: [] }; drawPanel();
  try {
    const b = B(), cids = new Map();
    if (b.cid && b.cid !== 'lib') cids.set(b.cid, null);
    try { (await getDocs(query(collection(fs, 'classes'), where('pads', 'array-contains', bid), ...ownQ()))).docs.forEach((d) => { if (!inTrash(d.data())) cids.set(d.id, d.data()); }); } catch (e) { /* 같이 쓰는 교실은 몰라도 됨 */ }
    const list = [];
    for (const cid of cids.keys()) {
      let c = cids.get(cid); if (!c) { try { const s = await getDoc(doc(fs, 'classes', cid)); c = s.exists() ? s.data() : {}; } catch (e) { c = {}; } }
      const ss = await getDocs(collection(fs, 'classes', cid, 'students'));
      ss.docs.forEach((d) => { const v = d.data(); if (v && v.name) list.push({ id: cid + '_' + d.id, cl: cid, k: d.id, n: v.name, cn: c.name || '' }); });
    }
    S.roster = { list: list.sort((a, b2) => a.n.localeCompare(b2.n, 'ko')), multi: cids.size > 1 };
  } catch (e) { S.roster = { list: [], err: errText(e) }; }
  drawPanel();
}

$('side').addEventListener('click', async (e) => {
  const t = e.target.closest('[data-g]'); if (!t || !S.teacher) return;
  const a = t.dataset.g, id = t.dataset.id;
  if (a === 'close') { openPanel(false); return; }
  else if (a === 'brk') { await saveBoard({ brk: t.checked }); toast(t.checked ? '모둠별로 따로 해요. 학생은 자기 모둠 카드만 봐요.' : '모든 카드를 함께 봐요.'); }
  else if (a === 'join') { await saveBoard({ join: t.dataset.v }); }
  else if (a === 'see') { switchCard(id); render(); }
  else if (a === 'ren') cardNameDlg(id);
  else if (a === 'del') delCardDlg(id);
  else if (a === 'add') addGroups(groupCards().length + 1);
  else if (a === 'many') addGroups(+$('gN').value);
  else if (a === 'pick') { if (S.pick.has(id)) S.pick.delete(id); else S.pick.add(id); drawPanel(); }
  else if (a === 'put') { const list = [...S.pick].map((x) => (S.roster.list || []).find((s) => s.id === x)).filter(Boolean); S.pick.clear(); await assign(list.map((s) => [s, id])); }
  else if (a === 'out') { try { await saving(deleteDoc(doc(memCol(), id))); } catch (err) { toast(errText(err), true); } }
  else if (a === 'shuffle') shuffleIn();
  else if (a === 'clear') confirmDlg('모두 빼기', '모둠에 넣은 학생을 모두 빼요. 학생이 올린 것은 그대로예요.', '모두 빼기', async () => { try { await saving(commitOps(S.mems.map((m) => (b) => b.delete(doc(memCol(), m.id))))); } catch (err) { toast(errText(err), true); } });
  else if (a === 'reload') loadRoster();
  drawPanel();
});
async function addGroups(n) {
  const gs = groupCards(), list = cards(), gc = Object.assign({}, B().gc || {});
  if (n <= gs.length) { toast('이미 모둠이 ' + gs.length + '개 있어요.'); return; }
  if (list.length + (n - gs.length) > MAX_CARDS) { toast('카드는 ' + MAX_CARDS + '장까지예요.', true); return; }
  let first = null;
  for (let i = gs.length; i < n; i++) { const c = { id: newCardId(), n: (i + 1) + '모둠', bg: '#FFFFFF|', col: GCOLORS[i % GCOLORS.length] }; list.push(c); gc[c.id] = true; if (!first) first = c; }
  await saveBoard({ cards: list, gc });
  if (first) { switchCard(first.id); render(); }
  toast('모둠이 ' + n + '개가 됐어요. 모둠마다 카드가 한 장씩 있어요.');
}
async function assign(pairs) {
  if (!pairs.length) return;
  try { await saving(commitOps(pairs.map(([s, c]) => (b) => b.set(doc(memCol(), s.id), { cl: s.cl, k: s.k, c, n: String(s.n).slice(0, 20), by: 't', at: serverTimestamp() })))); }
  catch (e) { toast(errText(e), true); }
}
function shuffleIn() {
  const gs = groupCards(); if (!gs.length) return;
  const assigned = new Set(S.mems.filter((m) => gs.some((g) => g.id === m.c)).map((m) => m.id));
  const free = (S.roster.list || []).filter((s) => !assigned.has(s.id));
  for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
  const cnt = new Map(gs.map((g) => [g.id, memsOf(g.id).length]));
  assign(free.map((s) => { const g = [...cnt.entries()].sort((a, b) => a[1] - b[1] || Math.random() - 0.5)[0][0]; cnt.set(g, cnt.get(g) + 1); return [s, g]; }));
}

/* ---------- 불러오기 (실시간) ---------- */
function fail(m) { S.failed = true; $('title').textContent = '샌드박스를 열 수 없어요'; $('mid').innerHTML = '<div class="empty2"><h2 style="margin:0 0 8px">😢 열 수 없어요</h2><p>' + esc(m) + '</p><div class="row" style="justify-content:center"><a class="btn blue" href="' + (ses ? 'class.html' : './') + '">돌아가기</a></div></div>'; $('tools').innerHTML = ''; $('rail').hidden = true; }
const sameObj = (a, b) => KEYS.every((k) => k === 'at' || a[k] === b[k]);
/** 물건 모음이 바뀜. fresh: 학생이 카드를 새로 열었을 때 그 카드의 옛 기억을 지우고 새로 받음 */
function onObjSnap(snap, fresh) {
  if (fresh) { for (const [id, o] of S.objs) if (o.c === fresh && !o._draft && !snap.docs.some((d) => d.id === id)) S.objs.delete(id); markCard(fresh); }
  snap.docChanges().forEach((ch) => {
    const id = ch.doc.id;
    if (ch.type === 'removed') { const o = S.objs.get(id); if (o && !o._draft) { S.objs.delete(id); markCard(o.c); } return; }
    const d = ch.doc.data({ serverTimestamps: 'estimate' });
    const old = S.objs.get(id);
    if (old && !old._draft && sameObj(old, d)) { old.at = d.at; return; } // 내가 방금 바꾼 것이 돌아옴 — 다시 그리지 않음
    if (old) markCard(old.c);
    S.objs.set(id, Object.assign({}, d, { id, _rev: ++REV })); markCard(d.c);
  });
  S.loaded = true;
  render();
}
function subCard() {
  if (S.subOff) { S.subOff(); S.subOff = null; }
  if (!S.cur) return;
  const card = S.cur; let first = true;
  S.subOff = onSnapshot(query(sbCol(), where('c', '==', card)), (snap) => { onObjSnap(snap, first ? card : ''); first = false; }, (e) => toast(errMsg(e), true));
}
(async () => {
  if (!bid) return fail('주소가 잘못되었어요.');
  try {
    S.user = await ensureUser();
    let t = !PREVIEW && isTeacher(S.user);
    const first = await getDoc(doc(fs, 'boards', bid));
    if (!first.exists()) return fail('지워진 샌드박스예요.');
    S.board = first.data();
    if (!isSandbox(S.board)) { location.replace('board.html' + location.search); return; }
    if (PREVIEW && (!S.board.public || S.board.trash)) return fail('아직 학생에게 보이지 않는 샌드박스예요. (⚙ 설정 → 학생에게 보이기를 켜면 학생에게 보여요)');
    if (t) { const r = await teacherRole(S.user); S.role = r; t = S.board.owner ? S.board.owner === S.user.uid : r === 'admin'; }
    S.teacher = t;
    try { S.name = (!t && ses && ses.name) || localStorage.getItem(NAME_KEY) || ''; } catch (e) { S.name = (ses && ses.name) || ''; }
    if (t && S.board.cid && S.board.cid !== 'lib') { try { const c = await getDoc(doc(fs, 'classes', S.board.cid)); if (c.exists()) S.cls = Object.assign({ id: c.id }, c.data()); } catch (e) { /* 무시 */ } }
    layout();
    S.cur = (visibleCards()[0] || {}).id || '';
    onSnapshot(doc(fs, 'boards', bid), (s) => { if (!s.exists()) { fail('지워진 샌드박스예요.'); return; } S.board = s.data(); railSig = ''; render(); }, () => {});
    onSnapshot(memCol(), (snap) => { S.mems = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.memsReady = true; railSig = ''; render(); }, () => { S.memsReady = true; render(); });
    if (t) onSnapshot(sbCol(), (snap) => onObjSnap(snap), (e) => toast(errMsg(e), true));
    else { S.loaded = true; subCard(); }
    render();
    if (NEW && t) {
      history.replaceState(null, '', location.pathname + '?b=' + encodeURIComponent(bid) + (EMBED ? '&embed=1' : ''));
      setTimeout(() => {
        const r = $('sendBtn').getBoundingClientRect(), c = document.createElement('div');
        c.className = 'coach'; c.textContent = '다 만들면 여기를 눌러 교실로 보내요 🚀 (모둠 활동은 👥 모둠)'; c.setAttribute('role', 'status');
        c.style.top = (r.bottom + 10) + 'px'; c.style.left = Math.max(8, r.right - 250) + 'px';
        c.addEventListener('click', () => c.remove()); document.body.append(c); setTimeout(() => c.remove(), 12000);
      }, 400);
    }
  } catch (err) { fail(/permission/i.test(err.code || '') ? '아직 선생님이 학생에게 보여 주지 않은 샌드박스예요.' : errText(err)); }
})();
</script>
</body>
