<style>
/* VOICE: 밝은 도트 게임 화면 — 선생님 혼자 쓰는 수업 자료 창고
   IDEA: 게임 대화창처럼 굵은 남색 테두리 상자, 제미나이 꽃밭 하늘 배경
   PICTURE: 클래스 카드 벽 → 가로로 늘어선 패들렛 칸과 글 카드
   COLOUR: 하늘 파랑 배경, 남색 #1B1F3B 테두리, 노랑 #FFD23F·파랑 #3A6FF2 버튼
   TYPE: 제목·버튼 Jua, 본문 Noto Sans KR / LAYOUT: 위 띠, 카드 격자, 가로 스크롤 칸 */
/* 공통 모양(색·버튼·입력 칸·상자·배경)은 css/moa.css — 여기는 패들렛 화면에만 쓰는 것 */
html{scroll-padding-top:90px}
.btn{padding:0 14px;position:relative}
.mini{min-height:36px;padding:0 8px;border:1px solid #D5DAE3;border-radius:8px;background:#fff;color:var(--ink);font:700 13px 'Noto Sans KR',sans-serif;cursor:pointer}
.mini:hover{background:#FFF1B8}
.field{min-height:44px;padding:0 12px;border-width:3px;font:16px 'Noto Sans KR',sans-serif}
textarea.field{padding:10px 12px;line-height:1.6;resize:vertical}

header{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(3vw,16px);background:rgba(255,248,231,.96);border-bottom:1px solid #E3E6EC}
.bar{width:4px;height:32px;background:var(--ink)}
.htxt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.htxt h1{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.15;text-wrap:balance}
.htxt small{font-size:13px;color:var(--sub)}
.hbtns{display:flex;flex-wrap:wrap;gap:8px}
.save{font:700 13px 'Noto Sans KR',sans-serif;padding:4px 10px;border:1px solid #D5DAE3;border-radius:12px;background:#1B1F3B;color:#7CFF8A;white-space:nowrap}
.save.busy{color:var(--yel)}.save.bad{background:#FF6B4A;color:#fff}

main{max-width:1240px;margin:0 auto;padding:22px max(3vw,16px) 28px;display:flex;flex-direction:column;gap:18px}
main.wide{max-width:none;padding-inline:0}
.note{align-self:flex-start;margin:0;padding:8px 12px;background:rgba(255,255,255,.94);border:1px solid #D5DAE3;border-radius:12px;font-size:14px;font-weight:700;line-height:1.6;color:var(--ink)}
.toast{align-self:flex-start;margin:0;padding:10px 14px;background:var(--ink);color:var(--grn);font-size:14px;font-weight:700;border:0;box-shadow:none;text-align:left}
.toast.bad{color:#FFB4A6}
.tools{background:var(--paper);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid #D5DAE3;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.08);background:#fff;font-size:16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.find{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.find input{width:210px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;min-height:300px;background:#fff}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.card .open:focus-visible{outline:4px solid #FF8A3D;outline-offset:3px}
.card:hover{transform:translate(-3px,-3px);box-shadow:0 2px 10px rgba(16,24,40,.12)}
.band{height:84px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #E3E6EC;background-image:conic-gradient(rgba(255,255,255,.3) 25%,transparent 0 50%,rgba(255,255,255,.3) 0 75%,transparent 0);background-size:16px 16px}
.kind{font:700 13px 'Noto Sans KR',sans-serif;padding:3px 8px;border:1px solid #D5DAE3;border-radius:12px;background:#fff}
.kind.sp{background:var(--ink);color:#fff}
.cbody{flex:1;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.cname{font:400 23px/1.25 'Jua',sans-serif;overflow-wrap:anywhere}
.cmeta{font-size:13px;color:var(--sub)}
.recent{display:flex;flex-direction:column;gap:6px}
.recent span{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#F4F0E4;border:1px solid #D5DAE3;border-radius:8px;font-size:13px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.recent span::before{content:"";width:8px;height:8px;flex:none;background:var(--c);border:1px solid #D5DAE3;border-radius:8px}
.empty{padding:10px;border:2px dashed var(--ink);font-size:13px;line-height:1.6;color:var(--sub);text-align:left;background:none}
.cfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}
.go{font:400 15px 'Jua',sans-serif;color:#fff;background:var(--blue);border:1px solid #D5DAE3;border-radius:12px;padding:5px 10px;white-space:nowrap}
.card .edit{position:absolute;top:24px;left:80px}
.addcard{min-height:300px;border:2px dashed #B9BFCC;border-radius:12px;background:rgba(255,255,255,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:21px;cursor:pointer}

.welcome{background:var(--paper);padding:24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px;max-width:760px}
.welcome h2{margin:0 0 6px;font-size:26px}

.moa{width:96px;height:127px;flex:none;background:url(assets/moa.png) 0 0/384px 127px no-repeat;image-rendering:pixelated;animation:hop 1.8s steps(1) infinite}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px max(3vw,16px) 0}
.tabs .lbl{font-size:13px;font-weight:700;color:#fff;background:var(--ink);padding:6px 10px}
.tab{min-height:44px;padding:0 14px;border:1px solid #D5DAE3;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.08);background:#fff;font-size:16px;cursor:pointer;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sec{width:290px;flex:none;display:flex;flex-direction:column;gap:12px}
.sech{margin:0;padding:8px 10px 8px 12px;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sech span{overflow-wrap:anywhere}

.post{background:#fff;border:1px solid #D5DAE3;border-radius:12px;box-shadow:0 2px 10px rgba(16,24,40,.12);display:flex;flex-direction:column}
.pin{padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px}

.lnk{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;background:#EAF3FF;border:1px solid #D5DAE3;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;overflow-wrap:anywhere}

.pfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px 0 12px;font-size:12px;color:var(--sub);flex-wrap:wrap}

.acts{display:flex;align-items:center;gap:2px}
.like{min-height:44px;min-width:44px;padding:0 6px;border:0;background:transparent;display:inline-flex;align-items:center;gap:4px;font:400 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.tiny{min-height:44px;padding:0 6px;border:0;background:transparent;font:700 12px 'Noto Sans KR',sans-serif;color:var(--sub);cursor:pointer;text-decoration:underline}
.addpost{min-height:44px;border:2px dashed #B9BFCC;border-radius:12px;background:rgba(255,255,255,.86);font-size:15px;cursor:pointer}
.addsec{width:220px;flex:none;min-height:120px;border:2px dashed #B9BFCC;border-radius:12px;background:rgba(255,255,255,.8);font-size:18px;cursor:pointer}
.bbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px max(3vw,16px) 0}
.bbar .tabs{padding:0;flex:1;min-width:0}
.bset{margin-left:auto;position:relative;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.setbtn{min-height:40px;padding:0 12px;font-size:14px}
.setbtn[aria-expanded=true]{background:var(--ink);color:#fff}
.bmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:8;width:min(92vw,330px);padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
.bminfo{margin:0;font-size:12px;font-weight:700;color:var(--sub);line-height:1.5}
.bmg{display:flex;flex-direction:column;gap:4px}
.bmg>b{font:700 12px 'Noto Sans KR',sans-serif;color:var(--sub)}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border:1px solid #D5DAE3;border-radius:8px;background:#fff;color:var(--ink);font:700 14px 'Noto Sans KR',sans-serif;text-decoration:none;text-align:left;cursor:pointer}
.mi:hover{background:#FFF1B8}
.mi.del{background:#FFE4DE}.mi.del:hover{background:#FFC9BE}
.bframe{display:block;width:100%;height:calc(100vh - 66px);min-height:520px;border:0;background:transparent}
/* 패들렛 판 머리 띠: 패들렛처럼 얇은 한 줄, 버튼은 오른쪽 한곳에 */
header.compact{padding:6px max(2vw,12px);gap:6px 10px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(16,24,40,.12);box-shadow:0 1px 6px rgba(16,24,40,.08)}
header.compact .brands{gap:4px}
header.compact .brand-word,header.compact .brands>span:not(.brand){display:none}
header.compact .brand-icon{width:34px;height:34px}
header.compact .bar{display:none}
header.compact .htxt{min-width:160px;gap:0}
header.compact .htxt .hh1{font:800 19px/1.3 'Noto Sans KR',sans-serif;color:#1D2030}
header.compact .hb:disabled{opacity:.55;cursor:not-allowed}
main:not(.wide){max-width:1320px}
header.compact .htxt small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6B7085}
header.compact .htxt .dot{width:10px;height:10px;border-radius:3px;flex:none}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px;padding:0 12px;text-decoration:none;line-height:1;box-sizing:border-box;border:1px solid #CDD2DC;border-radius:10px;background:#fff;color:#1D2030;font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}
.hb:hover{background:#F2F4F7}
.hb[aria-expanded=true]{background:#1D2030;color:#fff;border-color:#1D2030}
.hb.on{background:#DDF7E3;border-color:#3FB66B;color:#14532D}
.hb.go{background:var(--blue);border-color:var(--blue);color:#fff}
.hb.go:hover{filter:brightness(1.08)}
.hb.back{width:38px;padding:0;font-size:15px}
.hright{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
header.compact .save{border:0;background:none;color:#3FB66B;padding:0 4px;font-size:12px}
header.compact .save.busy{color:#B7791F}header.compact .save.bad{background:#FF6B4A;color:#fff;border-radius:6px;padding:2px 8px}
.bpw{position:relative;min-width:0}
.bpick{display:flex;align-items:center;gap:6px;max-width:100%;padding:0 6px 0 0;border:0;background:none;color:#1D2030;font:800 19px/1.3 'Noto Sans KR',sans-serif;cursor:pointer;text-align:left}
.bpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bpick i{font-style:normal;font-size:13px;color:#6B7085}
.bpick:hover span{text-decoration:underline}
.bpm{position:absolute;left:0;top:calc(100% + 6px);z-index:8;width:min(90vw,300px);padding:8px;display:flex;flex-direction:column;gap:4px;background:#fff}
.bpm .mi[aria-current=true]{background:#FFF3C4}
header.compact .bset{margin-left:0}
.bmsg{padding:8px max(2vw,12px) 0;display:flex;flex-direction:column;gap:6px}
header.compact .bmenu.pf,header.compact .bpm.pf{border:0;border-radius:14px;box-shadow:0 12px 32px rgba(16,24,40,.22);padding:8px;gap:6px;background:#fff}
header.compact .bmenu{top:calc(100% + 6px);max-height:calc(100vh - 120px);overflow-y:auto}
header.compact .bminfo{padding:4px 8px 6px;border-bottom:1px solid #EEF0F4;font-weight:500}
header.compact .bmg{gap:0}
header.compact .bmg>b{padding:6px 8px 2px;font-size:11px;font-weight:700;color:#8A8FA3}
header.compact .mi{min-height:40px;border:0;border-radius:8px;background:none;font:500 14px 'Noto Sans KR',sans-serif;color:#1D2030}
header.compact .mi:hover,header.compact .mi:focus-visible{background:#F1F3F7}
header.compact .mi.del{background:none;color:#C0362C}
header.compact .mi.del:hover{background:#FDECEA}
header.compact .bpm .mi[aria-current=true]{background:#FFF3C4;font-weight:700}
@media (max-width:700px){header.compact .htxt{flex-basis:calc(100% - 140px)}.hright{width:100%}.bframe{height:calc(100vh - 160px)}}
.nob{margin:24px max(3vw,16px);max-width:600px;background:var(--paper);padding:24px;display:flex;flex-direction:column;gap:14px}
.nob h2{margin:0;font-size:24px}.nob p{margin:0;font-size:14px;line-height:1.7;color:#333A55}

.ov{position:fixed;inset:0;z-index:10;background:rgba(27,31,59,.55);display:flex;align-items:flex-start;justify-content:center;padding:clamp(16px,8vh,90px) 16px 16px;overflow-y:auto}
.dlg{width:100%;max-width:520px;background:var(--paper);padding:22px;display:flex;flex-direction:column;gap:10px}
.dlg .top{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:4px;padding:0}
.dlg h2{margin:0;font-size:24px}
.dlg label{font-size:14px;font-weight:700}
.dlg p{margin:0;font-size:14px;line-height:1.7}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:44px;height:44px;border:1px solid #D5DAE3;border-radius:12px;cursor:pointer}
.sw button[aria-pressed=true]{outline:4px solid var(--ink);outline-offset:2px}
.seg{display:flex;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
@media (max-width:600px){header{position:static}.find{margin-left:0;width:100%}.find input{flex:1;width:auto}.htxt{min-width:100%}.sec{width:82vw}}

/* 휴지통 */
.trashlist{margin:16px max(3vw,16px);max-width:900px;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--paper);padding:14px 16px}
.trow .tdot{width:18px;height:18px;border:1px solid #D5DAE3;border-radius:12px;flex:none}

.trow .tleft{font-size:13px;font-weight:700;padding:4px 8px;background:#fff;border:1px solid #D5DAE3;border-radius:8px;white-space:nowrap}

.mini.del{background:#FF8F8F}
.mini.del:hover{background:#FF6B4A;color:#fff}
</style>

<script type="module">
import { fs, rt, ref, set, auth, whenAuth, isTeacher, teacherRole, doc, getDoc, setDoc, deleteDoc, collection, query, where, onSnapshot, getDocs, serverTimestamp, esc, safeUrl } from './js/fb.js';
import { readXlsx, readCSV } from './js/xlsx.js';
import { TRASH_DAYS, inTrash, daysLeft, trashTime, trashBoard, restoreBoard, purgeBoard, purgeExpired } from './js/trash.js';
import { cleanFiles, okColor, copyFiles, purgeBoardSubs, layoutOf, FORMATS } from './js/padkit.js';
{
const COLORS = ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#9DB8FF', '#FFB86B', '#C7B2FF'];
const SEC_COLORS = ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#C7B2FF', '#FFB86B'];
const MAX_CLASSES = 20, PART_BYTES = 200000;
const S = { db: null, mode: 'wait', classes: [], boards: [], parts: [], live: [], cmts: [], view: 'home', cid: null, bid: null, filter: '전체', q: '', msg: '', bad: false, saving: 0, saveErr: '', loaded: { classes: false, boards: false }, slow: false };
const $ = (id) => document.getElementById(id);
const bytes = (o) => new TextEncoder().encode(JSON.stringify(o)).length;
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const md = (iso) => { const m = /^(\d+)-(\d+)-(\d+)/.exec(iso || ''); return m ? (+m[2]) + '월 ' + (+m[3]) + '일' : ''; };
const byCreated = (a, b) => String(a.created || '').localeCompare(String(b.created || '')) || a.id.localeCompare(b.id);

/* ---------- 저장소 ---------- */
const chains = new Map();
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return '저장 공간이 다 찼어요. 안 쓰는 패들렛을 지워 주세요.';
  if (c === 'revoked' || c === 'not_granted') return '저장소를 쓸 수 없게 되었어요. 페이지를 다시 열어 주세요.';
  if (c === 'invalid_argument' || c === 'invalid-argument') return '저장하지 못했어요(글이 너무 커요).';
  if (c === 'permission-denied') return '저장할 권한이 없어요. 선생님 계정으로 다시 로그인해 주세요.';
  return '저장하지 못했어요. 인터넷 연결을 확인해 주세요.';
}
function queued(path, fn) {
  S.saving++; drawStatus();
  const run = () => fn().catch((e) => { if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 600 + Math.random() * 800)).then(fn); throw e; });
  const p = (chains.get(path) || Promise.resolve()).catch(() => {}).then(run)
    .then(() => { if (S.saving <= 1) S.saveErr = ''; }, (e) => { S.saveErr = errText(e); throw e; })
    .finally(() => { S.saving--; drawStatus(); });
  chains.set(path, p);
  return p;
}
function put(path, data) {
  if (S.db) return queued(path, () => S.db.doc(path).set(data));
  return Promise.reject(Object.assign(new Error('not connected'), { code: 'not_granted' }));
}
function del(path) {
  if (S.db) return queued(path, () => S.db.doc(path).delete());

function pick(head, words) {
  const h = head.map((x) => String(x).trim().toLowerCase());
  for (const w of words) { const i = h.indexOf(w); if (i >= 0) return i; }

}

}
function rowsToBoard(rows) {
  const head = rows[0];
  const iT = pick(head, ['subject', 'title', '제목']), iB = pick(head, ['body', 'content', '내용', '본문']);
  const iL = pick(head, ['attachment', 'link', 'url', '첨부', '링크']), iA = pick(head, ['author', 'name', '작성자', '이름']);
  const iS = pick(head, ['section', 'column', '섹션', '칸', '열']), iK = pick(head, ['reactions', 'likes', 'like', '좋아요', '반응']);
  const iC = pick(head, ['comments', 'comment', '댓글']), iD = pick(head, ['created', '작성일', '날짜']);
  const secs = [], posts = [];
  rows.slice(1).forEach((r) => {
    const name = (iS >= 0 && String(r[iS] || '').trim()) || '글 모음';

    const link = g(iL).trim();

    posts.push({ sec: s, title, body, link, author: g(iA).trim(), likes: parseInt(g(iK), 10) || 0, comments: parseInt(g(iC), 10) || 0, at: dm ? dm[0] : todayISO() });

      for (const p of olds) { const q = await oldCopy(p, src.id, meta.id, p.sec || 0); idMap.set(p.id, q.id); posts.push(q); }
      if (posts.length) await writeBoard(meta, posts);
      for (const p of lives) { const nid = uid('q'); idMap.set(p.id, nid); await setDoc(doc(fs, 'boards', meta.id, 'posts', nid), await liveCopy(p, src.id, meta.id, p.sec || 0)); }
      await cloneExtras(src.id, meta.id, idMap);
      n++;
    }
    toast('\'' + src.title + '\'을(를) ' + n + '개 반에 보냈어요.' + (opts.pub ? ' 학생 화면 → 게시판에 보여요.' : ' (학생에게는 아직 안 보여요)'));
  } catch (e) { toast((S.saveErr || errText(e)) + (n ? ' (' + n + '개 반은 보냈어요)' : ''), true); }
}
async function copyBoard(sec, tcid, tbid) {
  const src = curBoard(); if (!src) return;
  const secs = src.sections || ['글 모음'];
  const pick = (p) => sec < 0 || (p.sec || 0) === sec;
  const olds = postsOfBoard().filter(pick), lives = S.live.filter(pick);
  const tc = S.classes.find((x) => x.id === tcid);
  if (!tc) { toast('보낼 클래스를 찾지 못했어요.', true); return; }
  if (!olds.length && !lives.length && tbid !== 'new') { toast('복사할 글이 없어요.', true); return; }
  let target, tsecs, nParts = 0;
  const map = new Map();
  if (tbid === 'new') {
    tsecs = sec < 0 ? secs.slice() : [secs[sec]];
    target = { id: uid('b'), cid: tcid, title: (src.title + (sec < 0 ? '' : ' · ' + secs[sec]) + ' (복사)').slice(0, 60), from: '복사해 옴', date: todayISO(), created: new Date().toISOString(), sections: tsecs, layout: layoutOf(src), groups: src.groups !== false };
    (sec < 0 ? secs : [secs[sec]]).forEach((_, i) => map.set(sec < 0 ? i : sec, i));
  } else {
    target = S.boards.find((x) => x.id === tbid);
    if (!target) { toast('보낼 패들렛을 찾지 못했어요.', true); return; }
    tsecs = (target.sections || ['글 모음']).slice();
  }
  const mapSec = (i) => {
    if (map.has(i)) return map.get(i);
    const name = secs[i] || '글 모음'; let j = tsecs.indexOf(name);
    if (j < 0) { tsecs.push(name); j = tsecs.length - 1; }
    map.set(i, j); return j;
  };
  // 칸 번호를 먼저 모두 정함 (새 칸이 생기면 저장 전에 tsecs에 들어감)
  const oldSecs = olds.map((p) => mapSec(p.sec || 0)), liveSecs = lives.map((p) => mapSec(p.sec || 0));
  toast('복사하는 중…');
  try {
    const idMap = new Map();
    if (tbid === 'new') { S.wantBid = target.id; await writeBoard(target, []); }
    const copied = [];
    for (let i = 0; i < olds.length; i++) { const q = await oldCopy(olds[i], src.id, target.id, oldSecs[i]); idMap.set(olds[i].id, q.id); copied.push(q); }
    if (tbid === 'new') {
      if (copied.length) await writeBoard(target, copied);
    } else if (copied.length) {
      const tp = (await getDocs(query(collection(fs, 'parts'), where('bid', '==', tbid), ...ownQ()))).docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((x, y) => x.n - y.n);
      const last = tp[tp.length - 1], pub = !!target.public;
      let n = last ? last.n : 0, cur = last ? (last.posts || []).slice() : [], size = bytes(cur);
      for (const p of copied) {
        const sz = bytes(p) + 1;
        if (cur.length && size + sz > PART_BYTES) { await put('parts/' + tbid + '-' + n, { bid: tbid, n, posts: cur, pub }); n++; cur = []; size = 2; }
        cur.push(p); size += sz;
      }
      await put('parts/' + tbid + '-' + n, { bid: tbid, n, posts: cur, pub });
      nParts = n + 1;
      await saveBoard(target, { sections: tsecs, parts: Math.max(target.parts || 1, nParts), postCount: (target.postCount || 0) + copied.length });
    } else {
      await saveBoard(target, { sections: tsecs });
    }
    for (let i = 0; i < lives.length; i++) { const nid = uid('q'); idMap.set(lives[i].id, nid); await setDoc(doc(fs, 'boards', target.id, 'posts', nid), await liveCopy(lives[i], src.id, target.id, liveSecs[i])); }
    await cloneExtras(src.id, target.id, idMap);
    const total = copied.length + lives.length;
    if (S.cid !== tcid) { openClass(tcid); }
    S.bid = target.id; draw();
    toast('\'' + tc.name + '\'의 \'' + target.title + '\'(으)로 글 ' + total + '개를 복사했어요.');
  } catch (e) { toast(S.saveErr || errText(e), true); }
}

/* ---------- 고치기 동작 ---------- */
async function saveClass() {
  const name = $('cn').value.trim();
  if (!name) { $('cn').focus(); $('cn').setAttribute('aria-invalid', 'true'); return; }
  const p = pending, old = p.id ? S.classes.find((x) => x.id === p.id) : null;
  if (!old && S.classes.length >= MAX_CLASSES) { closeDlg(); toast('클래스는 20개까지 만들 수 있어요.', true); return; }
  const id = p.id || uid('c');
  const data = { name, kind: p.kind, color: p.color, room: p.room, created: old ? old.created : new Date().toISOString() };
  closeDlg();
  try {
    await put('classes/' + id, Object.assign(data, old ? {} : { map: 'classroom' }));
    if (isMate()) await set(ref(rt, 'owners/' + id), S.uid); // 실시간 교실(진행판)을 이 선생님만 다루게
    await setDoc(doc(fs, 'rooms', p.room), ownIt('rooms/' + p.room, { cid: id, name, color: p.color }));
    if (old && old.room && old.room !== p.room) await deleteDoc(doc(fs, 'rooms', old.room));
    toast(old ? '\'' + name + '\'을 고쳤어요.' : '\'' + name + '\'을 만들었어요. 눌러서 패들렛을 가져와 보세요.');
  } catch (e) { toast(S.saveErr || errText(e), true); }
}
async function newBoard() {
  const c = curClass(); if (!c) return;
  const meta = { id: uid('b'), cid: c.id, title: '새 패들렛 ' + (boardsOf(c.id).length + 1), from: '직접 만듦', date: todayISO(), created: new Date().toISOString(), sections: ['첫 칸'] };
  S.wantBid = meta.id;
  try { await writeBoard(meta, []); S.bid = meta.id; draw(); toast('빈 패들렛을 만들었어요. \'이름 바꾸기\'로 제목을 정해 보세요.'); } catch (e) { toast(S.saveErr, true); }
}

async function setPublic(b, v) {
  try {
    await saveBoard(b, { public: v });
    for (const p of S.parts.filter((x) => x.bid === b.id)) await put('parts/' + p.id, { bid: p.bid, n: p.n, posts: p.posts || [], pub: v });
    toast(v ? '\'' + b.title + '\'을 이 반 학생들이 볼 수 있어요. (반 화면 → 게시판)' : '학생 화면에서 숨겼어요.');
  } catch (e) { toast(S.saveErr || errText(e), true); }
}
async function pinHome(b) {
  // 첫 화면은 선생님마다 따로: 주 선생님 config/home · 함께 쓰는 선생님 config/home_{uid}
  const hRef = doc(fs, 'config', isMate() ? 'home_' + S.uid : 'home');
  try {
    if (!b.public) await setPublic(b, true);
    const s = await getDoc(hRef); const d = s.exists() ? s.data() : {};
    const links = (d.links || []).filter((l) => l.bid !== b.id);
    links.unshift({ bid: b.id, t: b.title, d: (curClass() || {}).name || '', site: '수업 보드', c: '#D7B5FF' });
    await setDoc(hRef, { links }, { merge: true });
    toast('첫 화면 링크 게시판에 올렸어요.');
  } catch (e) { toast(errText(e), true); }
}

/* ---------- 이동 ---------- */
function openClass(id) { S.view = 'board'; S.cid = id; S.bid = null; S.msg = ''; S.menu = false; if (location.hash !== '#class-' + id) history.replaceState(null, '', '#class-' + id); draw(); window.scrollTo(0, 0); }
function openTrash() { S.view = 'trash'; S.cid = null; S.bid = null; S.msg = ''; watchParts(); if (location.hash !== '#trash') history.replaceState(null, '', '#trash'); draw(); window.scrollTo(0, 0); }
function goHome() { S.view = 'home'; S.cid = null; S.bid = null; S.msg = ''; watchParts(); if (location.hash && location.hash !== '#home') history.replaceState(null, '', '#home'); draw(); }
function route() {
  const m = /^#class-([A-Za-z0-9]+)$/.exec(location.hash);
  if (m && (m[1] === 'lib' || S.classes.find((c) => c.id === m[1]))) { if (S.cid !== m[1]) openClass(m[1]); }
  else if (location.hash === '#trash') { if (S.view !== 'trash') openTrash(); else draw(); }
  else if (S.view !== 'home') goHome(); else draw();
}
window.addEventListener('hashchange', route);
// 머리 띠의 '형식'·'글 쓰기'는 안에 넣어 보이는 패들렛 판의 같은 단추를 눌러 줌 (창은 판 안에서 열림)
function frameAct(btnId) {
  const f = document.querySelector('.bframe'), d = f && f.contentDocument, b = d && d.getElementById(btnId);
  if (b && f.contentWindow.document.readyState === 'complete' && d.getElementById('title').textContent !== '불러오는 중…') { b.click(); f.focus(); }
  else { S.msg = '패들렛을 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.'; S.bad = false; draw(); }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, si = +t.dataset.s || 0;
  if (a === 'ovclose') { if (e.target === t) closeDlg(); return; }
  if (a === 'menu') { e.preventDefault(); S.menu = !S.menu; S.pick = false; draw(); return; }
  if (a === 'pick') { e.preventDefault(); S.pick = !S.pick; S.menu = false; draw(); return; }
  if (a === 'bfmt' || a === 'bwrite') { frameAct(a === 'bfmt' ? 'fmtBtn' : 'writeBtn'); return; }
  if (S.pick && t.closest('.bpm')) S.pick = false;
  if (S.menu && t.closest('.bmenu')) { S.menu = false; setTimeout(draw, 0); } // 설정에서 하나 고르면 접힘
  if (t.tagName === 'A' && a !== 'home') return;
  e.preventDefault();
  if (a === 'close') closeDlg();
  else if (a === 'home') goHome();
  else if (a === 'pickfile') $('fileIn').click();
  else if (a === 'filter') { S.filter = t.dataset.v; draw(); }
  else if (a === 'open') openClass(id);
  else if (a === 'newclass') { if (S.classes.length < MAX_CLASSES) classDlg(null); }
  else if (a === 'editclass') classDlg(S.classes.find((c) => c.id === id));
  else if (a === 'kind' || a === 'color') { pending[a] = t.dataset.v; t.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === t))); }
  else if (a === 'delclass') {
    const c = S.classes.find((x) => x.id === id), bs = boardsOf(id);
    confirmDlg('클래스 지우기', '\'' + c.name + '\' 클래스를 지워요.' + (bs.length ? ' 그 안의 패들렛 ' + bs.length + '개는 휴지통으로 옮겨져서 ' + TRASH_DAYS + '일 안에는 다른 클래스로 되살릴 수 있어요.' : '') + ' 클래스는 되돌릴 수 없어요.', '클래스 지우기', async () => {
      try { for (const b of bs) await trashBoard(b, { own: ownQ(), homeRef: homeRefP() }); await del('classes/' + id); if (c.room) await deleteDoc(doc(fs, 'rooms', c.room)); toast('\'' + c.name + '\'을 지웠어요.' + (bs.length ? ' 패들렛은 휴지통에 있어요.' : '')); } catch (err) { toast(S.saveErr || errText(err), true); }
    });
  }
  else if (a === 'tab') { S.bid = id; S.msg = ''; S.menu = false; draw(); }
  else if (a === 'newboard') newBoard();
  else if (a === 'pubboard') { const b = curBoard(); if (b) setPublic(b, !b.public); }
  else if (a === 'pinhome') { const b = curBoard(); if (b) pinHome(b); }
  else if (a === 'lockboard') { const b = curBoard(); if (b) saveBoard(b, { lock: !b.lock }).then(() => toast(b.lock ? '학생 글쓰기를 열었어요.' : '학생 글쓰기를 잠갔어요. 읽기만 할 수 있어요.'), () => toast(S.saveErr, true)); }
  else if (a === 'copyboard') copyDlg();
  else if (a === 'deploy') deployDlg();
  else if (a === 'dpall' || a === 'dpnone') document.querySelectorAll('#dpL input').forEach((x) => { x.checked = a === 'dpall'; });
  else if (a === 'renameboard') { const b = curBoard(); textDlg('패들렛 이름 바꾸기', '패들렛 이름', b.title, 60, (v) => saveBoard(b, { title: v })); }
  else if (a === 'delboard') { const b = curBoard(); if (!b) return; confirmDlg('패들렛 삭제', '\'' + b.title + '\'을 휴지통으로 옮겨요. 학생 화면에서는 바로 사라지고, ' + TRASH_DAYS + '일 안에는 휴지통에서 되살릴 수 있어요. ' + TRASH_DAYS + '일이 지나면 영구 삭제돼요.', '휴지통으로 옮기기', async () => { try { await trashBoard(b, { own: ownQ(), homeRef: homeRefP() }); S.bid = null; toast('\'' + b.title + '\'을 휴지통으로 옮겼어요. (' + TRASH_DAYS + '일 안에 되살릴 수 있어요)'); } catch (err) { toast(errText(err), true); } }); }
  else if (a === 'trash') openTrash();
  else if (a === 'restore') {
    const b = S.boards.find((x) => x.id === id); if (!b) return;
    if (b.cid === 'lib' || S.classes.find((x) => x.id === b.cid)) doRestore(b, null);
    else if (!S.classes.length) toast('반이 하나도 없어요. 먼저 클래스를 만들어 주세요.', true);
    else { pending = b.id; openDlg(dlgTop('어느 클래스로 되살릴까요?') + '<p>\'' + esc(b.title) + '\'이 있던 클래스는 지워졌어요. 되살릴 클래스를 골라 주세요.</p><label for="rc">클래스</label><select id="rc" class="field">' + classes().map((x) => '<option value="' + esc(x.id) + '">' + esc(x.name) + ' · ' + esc(x.kind) + '</option>').join('') + '</select><div class="row"><button type="submit" class="btn blue" data-form="restore">되살리기 ▶</button></div>', '#rc'); }
  }
  else if (a === 'purge') { const b = S.boards.find((x) => x.id === id); if (!b) return; confirmDlg('영구 삭제', '\'' + b.title + '\'과 그 안의 글·사진·댓글을 완전히 지워요. 되돌릴 수 없어요.', '영구 삭제', async () => { try { await purgeBoard(b, { own: ownQ() }); toast('영구 삭제했어요.'); } catch (err) { toast(errText(err), true); } }); }
  else if (a === 'emptytrash') { const list = trashed(); if (!list.length) return; confirmDlg('휴지통 비우기', '휴지통의 패들렛 ' + list.length + '개를 모두 완전히 지워요. 되돌릴 수 없어요.', '모두 영구 삭제', async () => { let n = 0; for (const b of list) { try { await purgeBoard(b, { own: ownQ() }); n++; } catch (err) { /* 다음 것 */ } } toast('패들렛 ' + n + '개를 영구 삭제했어요.', n < list.length); }); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = (e.submitter && e.submitter.dataset.form) ? e.submitter : e.target.querySelector('[data-form]');
  const f = btn && btn.dataset.form;
  if (f === 'class') saveClass();
  else if (f === 'text') { const v = $('tv').value.trim(); if (!v) { $('tv').focus(); return; } const fn = pending; closeDlg(); try { await fn(v); toast('저장했어요.'); } catch (err) { toast(S.saveErr || '저장하지 못했어요.', true); } }
  else if (f === 'confirm') { const fn = pending; closeDlg(); fn(); }
  else if (f === 'restore') { const b = S.boards.find((x) => x.id === pending), cid = $('rc').value; closeDlg(); if (b && cid) doRestore(b, cid); }
  else if (f === 'copy') { const sec = +$('cw').value, tcid = $('cc').value, tbid = $('cb').value; closeDlg(); copyBoard(sec, tcid, tbid); }
  else if (f === 'deploy') { const cids = [...document.querySelectorAll('#dpL input')].filter((x) => x.checked).map((x) => x.value); if (!cids.length) { toast('보낼 반을 하나 이상 골라 주세요.', true); return; } const opts = { pub: $('dpPub').checked, lock: $('dpLock').checked }; closeDlg(); deployBoard(cids, opts); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'cc') { fillTargets(); return; }
  if (e.target.id === 'fileIn') { const file = e.target.files && e.target.files[0]; e.target.value = ''; importFile(file); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const g = $('grid'); if (g) g.innerHTML = gridHTML(classes(), S.classes.length >= MAX_CLASSES); }
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('dlg').innerHTML) closeDlg(); else if (S.menu || S.pick) { S.menu = false; S.pick = false; draw(); } });
// 설정 밖을 누르거나(패들렛 판 안을 누르면 창 초점이 옮겨 감) 다른 곳으로 가면 설정을 접음
document.addEventListener('click', (e) => {
  let ch = false;
  if (S.menu && !e.target.closest('.bset')) { S.menu = false; ch = true; }
  if (S.pick && !e.target.closest('.bpw')) { S.pick = false; ch = true; }
  if (ch) draw();
});
document.addEventListener('click', (e) => { const m = e.target.closest('[data-menu]'); if (m && S.menu) { S.menu = false; setTimeout(draw, 0); } });
window.addEventListener('blur', () => { if (S.menu || S.pick) { S.menu = false; S.pick = false; draw(); } });

draw();
connect();
}
</script>
</body>
