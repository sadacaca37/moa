<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아팡팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--ink:#1B1F3B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font:16px/1.6 'Noto Sans KR',sans-serif;background:#2E9BEA url(assets/bg.webp) center top/cover no-repeat fixed}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
.box{max-width:560px;width:100%;background:#FFF8E7;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #E2D6B8,inset 4px 4px 0 #fff,6px 6px 0 var(--ink);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
h1{margin:0;font:400 clamp(40px,8vw,56px)/1.1 'Jua',sans-serif;color:#FFD23F;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),4px 4px 0 var(--ink)}
p{margin:0;font-size:17px}
.moa{width:120px;height:159px;background:url(assets/moa.png) 0 0/480px 159px no-repeat;image-rendering:pixelated;animation:hop 1.8s steps(1) infinite}
@keyframes hop{0%,50%{background-position:0 0}58%{background-position:-120px 0}72%{background-position:-240px 0}86%{background-position:-360px 0}}
@media (prefers-reduced-motion:reduce){.moa{animation:none}}
footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 12px;padding:10px 20px 16px;font-size:13px;font-weight:700;color:#fff;text-shadow:2px 2px 0 var(--ink)}
footer a{color:#fff}
</style>
</head>
<body>
<main>
  <section class="box">
    <div class="moa" role="img" aria-label="햄스터 모아"></div>
    <h1>모아팡팡</h1>
    <p>우리 반 수업 홈페이지를 열심히 만들고 있어요.<br>곧 문을 열어요!</p>
  </section>
</main>
<footer><span>제작자 김은경</span><a href="mailto:sadacaca@naver.com">sadacaca@naver.com</a></footer>
</body>
</html>
