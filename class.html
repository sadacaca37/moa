<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 · 모아팡</title>
<link rel="icon" href="assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/moa.css">
<style>
/* VOICE: 반에 들어온 아이들의 놀이터 겸 교실 — 친구들이 보이고, 선생님 안내가 바로 뜬다
   LAYOUT: 위 반 정보 띠, 탭 [가상 교실 | 게시판], 가상 교실은 지도 + 오른쪽 채팅·친구 목록 */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:10px clamp(12px,3vw,24px)}
.binfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.binfo h1{font-size:24px;color:#fff;text-shadow:3px 3px 0 var(--ink);margin-right:4px}
.who{background:var(--paper);border:1px solid #D5DAE3;border-radius:12px;padding:4px 10px 4px 4px}
.tabs{display:inline-flex;gap:4px;padding:4px;margin:0 0 14px;background:rgba(255,255,255,.92);border-radius:14px;box-shadow:0 1px 6px rgba(16,24,40,.14)}
.tabs .btn{min-width:120px;min-height:40px;border:0;border-radius:10px;background:none;box-shadow:none;font:700 15px 'Noto Sans KR',sans-serif;color:#3B3F52;transform:none}
.tabs .btn:hover{background:#F1F3F7;filter:none}
.tabs .btn[aria-selected=true]{background:#1D2030;color:#fff}
/* 게시판: 패들렛처럼 흰 둥근 판 + 카드 */
.boardTab{gap:18px}
.padbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.padpick{min-height:38px;padding:0 14px;border:1px solid #D0D5DD;border-radius:999px;background:#fff;font:700 14px 'Noto Sans KR',sans-serif;color:#3B3F52;cursor:pointer}
.padpick[aria-pressed=true]{background:#1D2030;border-color:#1D2030;color:#fff}
.padgh{align-self:center;margin-left:6px;font:800 13px 'Noto Sans KR',sans-serif;color:#6B7085}
.padgh:first-child{margin-left:0}
.padframe{display:block;width:100%;height:calc(100vh - 170px);min-height:520px;border:0;border-radius:18px;background:transparent}
.boardTab .dk-wrap h2{margin:0;font:800 19px/1.3 'Noto Sans KR',sans-serif;color:#15171F}
.boardTab .dk-note{grid-column:1/-1;padding:18px;border-radius:12px;background:#F4F5F8;text-align:center}
.notice{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:14px;background:var(--yel);font:400 20px/1.35 'Jua',sans-serif}
.notice .msc{height:54px}
.strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:14px;background:var(--ink);color:var(--grn);border:1px solid #D5DAE3;border-radius:12px;font:400 18px/1.3 'Jua',sans-serif}
.room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mapbox{padding:0;overflow:hidden}
.maphead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #E3E6EC;background:#fff}
.maphead b{font:400 19px/1.2 'Jua',sans-serif}
.screen{position:relative;background:#1B1F3B}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(27,31,59,.85);color:#fff;font:700 14px/1.3 'Noto Sans KR',sans-serif;padding:6px 12px;border:2px solid #fff;pointer-events:none;white-space:nowrap}
.pad{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid #E3E6EC;background:var(--paper)}
.keys{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px}
.keys .btn{min-height:44px;padding:0;font-size:18px}
.keys [data-k=up]{grid-column:2}.keys [data-k=left]{grid-column:1;grid-row:2}.keys [data-k=down]{grid-column:2;grid-row:2}.keys [data-k=right]{grid-column:3;grid-row:2}
.side{display:flex;flex-direction:column;gap:14px}
.chat{display:flex;flex-direction:column;height:430px}
.chat h2,.people h2{font-size:19px;padding:10px 12px;border-bottom:1px solid #E3E6EC;background:#fff}
#log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
#log p{margin:0;overflow-wrap:anywhere}#log b{margin-right:6px}#log .sys{color:var(--sub);font-size:13px}#log .mine b{color:var(--blue)}
.chatf{display:flex;gap:6px;padding:8px;border-top:1px solid #E3E6EC;background:#fff}
.chatf .field{padding:8px 10px;font-size:15px;border-width:3px}
.chatf .btn{flex:none;white-space:nowrap}
.chatf .emob{padding:0 4px;min-width:44px;display:flex;align-items:center;justify-content:center}
#log .stk{display:block;margin-top:2px}
.people ul{list-style:none;margin:0;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow:auto}
.people li{border:1px solid #D5DAE3;border-radius:8px;background:#fff;padding:2px 8px;font-size:14px}
.people li.me{background:var(--yel)}
.meter{height:12px;margin:0 12px 12px;border:1px solid #D5DAE3;border-radius:12px;background:#fff}
.meter i{display:block;height:100%;background:var(--grn)}
.boardTab h2{font-size:22px}
.quiz{position:fixed;inset:0;z-index:60;background:rgba(27,31,59,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.quiz .pf{width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.quiz h2{font-size:18px;color:var(--sub)}
.quiz .q{font:400 26px/1.4 'Jua',sans-serif;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts .btn{min-height:72px;font-size:22px;white-space:normal;line-height:1.25}
.opts.ox .btn{min-height:110px;font-size:54px}
.opts .btn.right{background:var(--grn);color:var(--ink)}
.opts .btn.wrong{background:#ffb4a8}
.opts .btn.blue:disabled{opacity:1;background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(47,123,246,.25)}
.opts .btn.right:disabled,.opts .btn.wrong:disabled{opacity:1}
.rankbox .rtitle{margin:0;font:400 34px/1.2 'Jua',sans-serif;text-align:center}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.podium li{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;border:1px solid #D5DAE3;border-radius:12px;font:400 22px/1.2 'Jua',sans-serif}
.podium li b{width:52px;text-align:center;font-size:26px;flex:none}
.podium li span{flex:1;overflow-wrap:anywhere}
.podium li small{font:700 15px 'Noto Sans KR',sans-serif;color:var(--sub);white-space:nowrap}
.podium li.r1{background:#FFE58A;font-size:28px}.podium li.r2{background:#EEF1F6}.podium li.r3{background:#FFE1C7}
.podium li.me{outline:4px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.podium li{animation:rankIn .5s steps(4) both}}
@keyframes rankIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.quiz .why{margin:0;padding:10px 12px;background:#FFF1C2;border:1px solid #D5DAE3;border-radius:12px;font:500 16px/1.6 'Noto Sans KR',sans-serif;overflow-wrap:anywhere}
.qclock{display:flex;align-items:center;gap:10px}
.qclock b{flex:none;min-width:84px;padding:4px 12px;border-radius:999px;background:#1D2030;color:#fff;font:400 22px/1.3 'Jua',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.qclock i{flex:1;height:12px;border-radius:999px;background:#E8EBF2;overflow:hidden}
.qclock i::after{content:'';display:block;height:100%;width:var(--w,100%);background:#2F7BF6;transition:width .25s linear}
.qclock.low b{background:#E5484D}.qclock.low i::after{background:#E5484D}
.quiz .nx{margin:0;text-align:center;font:700 15px 'Noto Sans KR',sans-serif;color:var(--sub)}
.res.ok{background:#DDF7E3}.res.no{background:#FFE4DE}
.res{font:400 22px/1.4 'Jua',sans-serif;text-align:center;padding:10px;border:1px solid #D5DAE3;border-radius:12px;background:#fff}
@media (max-width:900px){.room{grid-template-columns:minmax(0,1fr)}.chat{height:340px}}
/* 선생님 진행판에 넣은 교실 화면 (?teach=반&embed=1): 지도만 */
html.embed body{background:#1B1F3B;min-height:0}
html.embed .bar,html.embed .tabs,html.embed .side,html.embed .pad,html.embed .strip,html.embed .notice,html.embed .maphead,html.embed .ground{display:none!important}
html.embed .wrap{max-width:none;padding:0}
html.embed .room{display:block}
html.embed .mapbox{border:0;box-shadow:none}
</style>
</head>
<body>
<div class="moa-strip" role="note"><span class="sp" aria-hidden="true">✨</span><span class="moa-strip-chip">🍀 모아팡 랜드</span><span class="moa-strip-text">• 우리 반 친구들과 함께 모여 배우고 노는 신나는 놀이터! 💚</span><span class="sp" aria-hidden="true">✨</span></div>
<div class="bar">
  <div class="binfo">
    <div class="brands sm"><a class="brand" href="taja/" title="타자팡으로 가기"><img src="assets/brand/tajapang.webp" alt="" aria-hidden="true" class="brand-icon" draggable="false"><img src="assets/brand/tajapang_word.webp" alt="타자팡" class="brand-word" draggable="false"></a><span class="brand-sep" aria-hidden="true">✦</span><a class="brand" href="./" title="모아팡 첫 화면"><img src="assets/brand/moapang.webp" alt="" aria-hidden="true" class="brand-icon" draggable="false"><img src="assets/brand/moapang_word.webp" alt="모아팡" class="brand-word" draggable="false"></a></div>
    <h1 id="clsT">우리 반</h1>
    <span class="tag" id="mapT">맵</span>
    <span class="tag" id="cntT">접속 0명</span>
  </div>
  <div class="row">
    <div class="who"><canvas id="meCv" width="56" height="56" aria-hidden="true"></canvas><div><b id="meT"></b><small id="scoreT"></small></div></div>
    <a class="btn sm" href="dress.html">꾸미기</a>
    <button class="btn sm" type="button" id="out">나가기</button>
  </div>
</div>
<main class="wrap">
  <div class="tabs" role="tablist" aria-label="반 화면">
    <button class="btn" type="button" role="tab" id="tabRoom" aria-selected="true" aria-controls="roomTab">가상 교실</button>
    <button class="btn" type="button" role="tab" id="tabPad" aria-selected="false" aria-controls="padTab">📋 패들렛</button>
    <button class="btn" type="button" role="tab" id="tabBoard" aria-selected="false" aria-controls="boardTab">게시판</button>
  </div>
  <div class="pf notice" id="notice" role="status" hidden><span class="msc moa" aria-hidden="true"></span><span id="noticeT"></span></div>
  <div class="strip" id="gameStrip" hidden><span id="gameT"></span><a class="btn sm yel" id="gameGo" href="#">들어가기 ▶</a></div>
  <div class="strip" id="quizStrip" hidden><span>선생님이 퀴즈를 냈어요!</span><button class="btn sm yel" type="button" id="quizOpen">지금 참여하기 ▶</button></div>

  <section id="roomTab" role="tabpanel" aria-labelledby="tabRoom">
    <div class="room">
      <div class="pf mapbox">
        <div class="maphead"><b id="mapH">대기실</b><span class="note" id="mapSub"></span></div>
        <div class="screen">
          <canvas id="cv" width="1280" height="715" tabindex="0" aria-label="가상 교실 지도. 방향키나 W·A·S·D로 움직이고, 지도를 누르면 그쪽으로 걸어가요."></canvas>

        </div>
        <div class="pad">
          <div class="keys" aria-label="움직이기 버튼">
            <button class="btn" type="button" data-k="up" aria-label="위로">▲</button><button class="btn" type="button" data-k="left" aria-label="왼쪽으로">◀</button><button class="btn" type="button" data-k="down" aria-label="아래로">▼</button><button class="btn" type="button" data-k="right" aria-label="오른쪽으로">▶</button>
          </div>
          <p class="note" style="flex:1;min-width:180px">방향키나 W·A·S·D로 움직여요. 지도를 누르면 그쪽으로 걸어가요. 칠판 앞에서 스페이스를 누르면 게시판이 열려요.</p>
        </div>

      <div class="side">
        <div class="pf chat">
          <h2>채팅</h2>
          <div id="log" aria-live="polite"></div>
          <form class="chatf" id="chatF" autocomplete="off"><button class="btn sm emob" type="button" id="chatE" data-emopen aria-label="이모티콘 보내기" title="이모티콘"></button><input class="field" id="chatI" maxlength="40" placeholder="한 번에 40자까지" aria-label="채팅 글"><button class="btn sm blue" type="submit">보내기</button></form>
        </div>
        <div class="pf people">
          <h2 id="pplH">들어온 친구 0명</h2>
          <div class="meter" aria-hidden="true"><i id="meter" style="width:0"></i></div>
          <ul id="ppl"></ul>

      </div>

  </section>

  <!-- 패들렛: 선생님이 '학생에게 보이기'로 이 반에 공유한 패들렛을 이 화면 안에서 바로 씀 (여러 개면 위에서 고름) -->
  <section id="padTab" class="padTab" role="tabpanel" aria-labelledby="tabPad" hidden>
    <div class="padbar" id="padBar" role="group" aria-label="공유된 패들렛 고르기"></div>
    <div id="padSlot"><p class="dk-note">불러오는 중…</p></div>
  </section>
  <section id="boardTab" class="boardTab stack" role="tabpanel" aria-labelledby="tabBoard" hidden>
    <div class="dk-wrap">
      <h2>🔗 링크</h2>
      <div class="dk-grid" id="clsLinks"><p class="dk-note">불러오는 중…</p></div>
    </div>
    <div class="dk-wrap">
      <h2>🗒️ 수업 보드</h2>
      <div class="dk-grid" id="clsBoards"><p class="dk-note">불러오는 중…</p></div>
    </div>
  </section>
</main>

<div class="quiz" id="rank" hidden>
  <div class="pf rankbox" role="dialog" aria-modal="true" aria-labelledby="rankH">
    <h2 id="rankH">퀴즈 결과</h2>
    <p class="rtitle">🏆 순위 발표</p>
    <ol class="podium" id="rankL"></ol>
    <p class="why" id="rankMe" hidden></p>
    <button class="btn blue" type="button" id="rankX">닫기</button>
  </div>
</div>
<div class="quiz" id="quiz" hidden>
  <div class="pf" role="dialog" aria-modal="true" aria-labelledby="quizH">
    <h2 id="quizH">선생님 퀴즈</h2>
    <div class="qclock" id="quizT" hidden role="timer"><b></b><i></i></div>
    <p class="q" id="quizQ"></p>
    <div class="opts" id="quizO"></div>
    <p class="res" id="quizR" hidden></p>
    <p class="why" id="quizW" hidden></p>
    <p class="nx" id="quizN" hidden></p>
    <button class="btn" type="button" id="quizX">닫기</button>
  </div>
</div>
<div class="ground" aria-hidden="true"></div>

<script type="module">
import {
  fs, rt, ensureUser, whenAuth, isTeacher, teacherRole, doc, getDoc, onSnapshot, setDoc, updateDoc, increment, serverTimestamp, collection, query, where,
  ref, set, update, push, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, rquery, limitToLast, rnow, rget,
  getSession, setSession, clearSession, mapName, WAIT_MAP, esc, safeUrl, hostOf, errText, toast, PREVIEW, onLiveState
} from './js/fb.js';
import { emoHTML, emoRich, emoOnly, emoTok, emoImg, drawEmoBubble, openEmoPicker } from './js/emo.js';
import { groupBy } from './js/groups.js';
const $ = (id) => document.getElementById(id);
const A = window.MoaAvatar;
// 선생님 모드: class.html?teach=반ID (&embed=1 은 진행판 안의 작은 화면) — 선생님도 캐릭터로 교실에 들어감
const PARAMS = new URLSearchParams(location.search), TEACH = PARAMS.get('teach') || '', EMBED = !!TEACH && PARAMS.get('embed') === '1';
if (EMBED) document.documentElement.classList.add('embed');
const T_OUTFIT_KEY = 'moaTeacherOutfit';
const T_OUTFIT = { hair: 'hair_long', top: 'top_shirt_tie', bottom: 'bottom_slacks', shoes: 'shoes_loafers', outer: 'outer_blazer', hand: 'hand_book' };
const teacherOutfit = () => { try { return JSON.parse(localStorage.getItem(T_OUTFIT_KEY)) || T_OUTFIT; } catch (e) { return T_OUTFIT; } };
const ses = TEACH ? { cid: TEACH, className: '우리 반', name: '선생님', key: 'teacher', outfit: teacherOutfit(), teacher: true } : getSession();
if (!ses) { location.replace('./'); await new Promise(() => {}); } // 입장 정보가 없으면 첫 화면으로 (아래는 실행하지 않음)
const keepSes = (x) => { if (!TEACH) setSession(x); };
const PV = !TEACH && !!(ses && ses.preview); // 선생님의 학생 화면 미리보기: 보기만 하고 아무것도 남기지 않음 (친구들에게 내 캐릭터도 안 보임)
const T = 32, CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hyp = Math.hypot, rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
$('clsT').textContent = ses.className; $('meT').textContent = ses.name;
document.title = ses.className + ' · 모아팡';

let user = null, cls = {}, st = {}, M = null, mapId = null, loadingMap = null, first = true;
const MAPC = {}, actors = new Map();
const myOutfit = A.clean(ses.outfit || A.START);
const me = { uid: '', name: ses.name, key: ses.key, o: myOutfit, sheet: null, x: 0, y: 0, dir: 'down', moving: false, step: 0, speed: 175, isMe: true, bubble: '', bubbleT: 0, path: null, seat: null, sitWant: null, slide: null };

/* ---------- 탭 ---------- */
function tab(which) {
  for (const [k, b, p] of [['room', 'tabRoom', 'roomTab'], ['pad', 'tabPad', 'padTab'], ['board', 'tabBoard', 'boardTab']]) { $(b).setAttribute('aria-selected', String(which === k)); $(p).hidden = which !== k; }
  if (which === 'room') $('cv').focus({ preventScroll: true });
  if (which === 'pad') drawPad();
}
$('tabRoom').addEventListener('click', () => tab('room'));
$('tabPad').addEventListener('click', () => tab('pad'));
$('tabBoard').addEventListener('click', () => tab('board'));
// 칠판 앞: 공유된 패들렛이 있으면 패들렛, 없으면 게시판
const boardOrPad = () => tab(PADS.length ? 'pad' : 'board');
/* ---------- 패들렛 탭 ---------- */
let PADS = [], padSel = '', OWN_PADS = [], EXTRA_PADS = [], extraFor = '';
// 📋 패들렛 탭 = 이 반 패들렛 중 '학생에게 보이기'를 켠 것 + 선생님이 진행판에서 더한 다른 교실 패들렛(cls.pads, 여러 개)
function mixPads() {
  const seen = new Set(OWN_PADS.map((b) => b.id));
  PADS = OWN_PADS.concat(EXTRA_PADS.filter((b) => !seen.has(b.id)));
  $('tabPad').textContent = '📋 패들렛' + (PADS.length > 1 ? ' ' + PADS.length : ''); if (!$('padTab').hidden) drawPad();
}
async function loadExtraPads(ids) {
  const key = (ids || []).join(','); if (key === extraFor) return; extraFor = key;
  const got = await Promise.all((ids || []).slice(0, 8).map(async (id) => { try { const s = await getDoc(doc(fs, 'boards', id)); return s.exists() && s.data().public && !s.data().trash ? Object.assign({ id }, s.data()) : null; } catch (e) { return null; } }));
  if (extraFor !== key) return;
  EXTRA_PADS = got.filter(Boolean); mixPads();
}
function drawPad() {
  if (!PADS.find((b) => b.id === padSel)) padSel = PADS.length ? PADS[PADS.length - 1].id : '';
  // 선생님이 패들렛에 묶음(📁)을 정해 두었으면 묶음 이름을 앞에 달아 같이 모아 보여 줌
  const chip = (b) => '<button type="button" class="padpick" data-pad="' + esc(b.id) + '" aria-pressed="' + (b.id === padSel) + '">' + esc(b.title) + '</button>';

  const top = (y0 + y1) / 2 - (lines.length - 1) * size * 1.25 / 2;
  lines.forEach((ln, i) => g.fillText(ln, (x0 + x1) / 2, top + i * size * 1.25));
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!M || !M.img) return;
  if ($('roomTab').hidden && document.visibilityState === 'visible') { /* 게시판 탭: 그리지 않아도 됨 */ }
  let dx = 0, dy = 0;
  if ($('quiz').hidden && $('rank').hidden) { if (keys.has('left')) dx--; if (keys.has('right')) dx++; if (keys.has('up')) dy--; if (keys.has('down')) dy++; }
  if (me.slide) slideStep(dt);
  else {
    if (!dx && !dy && me.path) [dx, dy] = followPath();
    moveMe(dx, dy, dt);
  }
  syncMove(now);
  me.bubbleT -= dt;
  for (const a of actors.values()) {
    a.bubbleT -= dt;
    const sa = a.seat && a.mp === mapId && seatById(a.seat); if (sa) { a.x = sa.x; a.y = sa.y + SIT_DY; a.dir = sa.face; a.moving = false; continue; }
    const ddx = a.tx - a.x, ddy = a.ty - a.y, d = hyp(ddx, ddy);
    if (d > 0.5) { const sp = Math.min(d, Math.max(175, d * 4) * dt); a.x += ddx / d * sp; a.y += ddy / d * sp; a.moving = true; a.step += dt * 8.5; }
    else a.moving = a.remoteMoving && d > 0.1;
  }
  const near = nearBoard(), sl = !near && !me.seat && !me.slide && nearSlide(), ns = !near && !sl && !me.seat && !me.path && !me.slide && nearSeat();
  const hint = near ? '스페이스를 누르거나 칠판을 누르면 게시판이 열려요' : me.slide ? '' : me.seat ? (seatById(me.seat) || {}).ride ? '방향키를 누르면 내려와요' : '방향키를 누르거나 다른 곳을 누르면 일어나요' : sl ? '스페이스를 누르거나 미끄럼틀을 누르면 타요' : ns ? (ns.ride ? '스페이스를 누르면 ' + ({ swing: '그네를', seesaw: '시소를', jungle: '정글짐을' })[ns.ride] + ' 타요' : '스페이스를 누르거나 의자를 누르면 앉아요') : '';
  $('hint').hidden = !hint; if (hint) $('hint').textContent = hint;
  if ($('roomTab').hidden) return;
  ui = clamp(cv.width / Math.max(320, cv.clientWidth), 1, 3);
  g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = true;
  g.drawImage(M.img, 0, 0, M.size[0], M.size[1]);
  screenText();
  const list = [me, ...[...actors.values()].filter((a) => a.mp === mapId)];
  list.sort((p, q) => p.y - q.y).forEach(drawActor);
  list.forEach(drawTag);
}

/* ---------- 시작 ---------- */
(async () => {
  try {
    if (TEACH) {
      user = await whenAuth();
      const r = isTeacher(user) ? await teacherRole(user) : null;
      if (r !== 'admin' && r !== 'teacher') { location.replace('teacher.html'); return; }
      $('meT').textContent = '👑 선생님'; $('scoreT').textContent = '선생님 화면';
      document.querySelector('a[href="dress.html"]').hidden = true; $('out').textContent = '진행판으로';
    } else user = await ensureUser();
  } catch (err) { toast(errText(err), true); return; }
  me.uid = user.uid;
  await A.ensure(me.o); me.sheet = A.sheet(me.o);
  A.drawFrame($('meCv').getContext('2d'), me.sheet, 'front', 0, false, 56);

  // 반 정보 (기본 맵, 링크)
  onSnapshot(doc(fs, 'classes', ses.cid), (s) => {
    if (!s.exists() || s.data().trash) { toast(s.exists() ? '이 반은 선생님이 휴지통으로 옮겼어요. 첫 화면으로 가요.' : '이 반이 없어졌어요. 첫 화면으로 가요.', true); if (!TEACH) clearSession(); setTimeout(() => { location.href = TEACH ? 'teacher.html' : './'; }, 1500); return; }
    cls = s.data(); loadExtraPads(Array.isArray(cls.pads) ? cls.pads : []);
    if (cls.name && cls.name !== ses.className) { ses.className = cls.name; keepSes(ses); $('clsT').textContent = cls.name; document.title = cls.name + ' · 모아팡'; }
    drawLinks();
  }, (err) => toast(errText(err), true));
  // 학생 기록 (점수, 다른 기기에서 바꾼 옷)
  if (PV) { $('scoreT').textContent = '점수 0 · 미리보기'; document.querySelector('a[href="dress.html"]').hidden = true; }
  if (!TEACH && !PV) onSnapshot(doc(fs, 'classes', ses.cid, 'students', ses.key), (s) => {
    if (!s.exists()) return;
    const d = s.data(); $('scoreT').textContent = ''; // 점수(모은 기록)는 선생님만 봄
    if (d.outfit && JSON.stringify(A.clean(d.outfit)) !== JSON.stringify(me.o)) {
      me.o = A.clean(d.outfit); ses.outfit = me.o; setSession(ses);
      A.ensure(me.o).then(() => { me.sheet = A.sheet(me.o); A.drawFrame($('meCv').getContext('2d'), me.sheet, 'front', 0, false, 56); sendAll(); });
    }
  }, () => {});
  // 수업 보드 (학생에게 보이기로 한 것)
  onSnapshot(query(collection(fs, 'boards'), where('cid', '==', ses.cid), where('public', '==', true)), (snap) => {
    const bs = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((b) => !b.trash).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
    $('clsBoards').innerHTML = bs.map((b, i) => card({ bid: b.id, t: b.title, d: (b.postCount || 0) + '개의 글', c: b.color }, i)).join('') || '<p class="dk-note">아직 열린 수업 보드가 없어요.</p>';
    OWN_PADS = bs; mixPads();
  }, () => { $('clsBoards').innerHTML = '<p class="dk-note">수업 보드를 불러오지 못했어요.</p>'; });

  // 실시간
  const base = 'live/' + ses.cid;
  myRef = PV ? null : ref(rt, base + '/players/' + user.uid);
  onValue(ref(rt, '.info/serverTimeOffset'), (s) => { tOff = +s.val() || 0; });
  onValue(ref(rt, '.info/connected'), async (s) => {
    online = !!s.val();
    if (online && myRef) { try { await onDisconnect(myRef).remove(); sendAll(); } catch (e) { /* 무시 */ } }
  });
  let stReady = false;
  onLiveState(base, (v) => { // 미니 게임 화면 자료(gm)는 빼고 받아요
    const prevPhase = st.phase, prevMap = st.map;
    st = v || {}; if (!st.phase) st.phase = 'wait';
    stReady = true; applyState(prevPhase, prevMap);
  }, (err) => { toast(errText(err), true); if (!stReady) { st = { phase: 'wait' }; applyState(); } });
  let joined = false; setTimeout(() => { joined = true; }, 2500);
  onChildAdded(ref(rt, base + '/players'), (s) => { const had = actors.has(s.key); upsert(s.key, s.val()); if (joined && !had && s.key !== user.uid) logLine(esc((s.val() || {}).n || '친구') + ' 님이 들어왔어요', 'sys'); });
  onChildChanged(ref(rt, base + '/players'), (s) => upsert(s.key, s.val()));
  onChildRemoved(ref(rt, base + '/players'), (s) => { actors.delete(s.key); people(); });
  onChildAdded(rquery(ref(rt, base + '/chat'), limitToLast(30)), (s) => {

    logLine(chatHTML(v.n, v.m), mine ? 'mine' : '');
    if (joined || Date.now() - (v.t || 0) < 8000) { const a = mine ? me : actors.get(v.u); if (a) say(a, v.m || ''); }
