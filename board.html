<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© 2026 MOAPANG STUDIO (김은경). All rights reserved. 무단 복제·배포·변경 금지">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모아보드 · 모아팡</title>
<link rel="icon" href="assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/moa.css">
<script src="js/scene.js" defer></script>
<style>
/* VOICE: 선생님이 만든 패들렛에 반 친구들이 함께 글·사진·파일·댓글·이모티콘을 올리는 화면
   형식 6가지: 담벼락(벽돌) · 칸(섹션 세로줄) · 격자 · 스트림(한 줄) · 타임라인(가로 선) · 캔버스(메모를 옮기고 선으로 잇기)
   LAYOUT: 위 제목 띠(형식·잠그기·+ 글 쓰기), 아래 형식마다 다른 글 판, 오른쪽 아래 + 단추 */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px clamp(12px,3vw,24px)}
.head h1{font-size:28px;color:#fff;text-shadow:3px 3px 0 var(--ink);overflow-wrap:anywhere}
.head small{display:block;color:#fff;font:700 15px/1.4 'Noto Sans KR',sans-serif;text-shadow:2px 2px 0 var(--ink)}
.head .ttl{flex:1;min-width:200px}
.head .acts{display:flex;flex-wrap:wrap;gap:8px}
.lockbar{margin:0 clamp(12px,3vw,24px) 8px;padding:8px 12px;background:#fff;border:1px solid #D5DAE3;border-radius:12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.linkbar{background:#FFF3A6}
.cols{padding:8px clamp(12px,3vw,24px) 110px}
/* 칸 */
.cols.L-columns,.cols.L-timeline{overflow-x:auto}
.crow{display:flex;gap:16px;align-items:flex-start;width:max-content}
.sec{width:300px;flex:none;display:flex;flex-direction:column;gap:12px}
.sech,.gh,.tlh{margin:0;padding:10px 14px;font:400 20px/1.3 'Jua',sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sech span,.gh span{overflow-wrap:anywhere}
.sct{display:flex;align-items:center;gap:6px;flex:none}
.sct em,.tlh em{font-style:normal;font-size:14px;background:#fff;border:1px solid #D5DAE3;border-radius:12px;padding:0 8px}
.sbtn{min-width:32px;min-height:32px;border:1px solid #D5DAE3;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;padding:0}
.addsec{width:220px;flex:none;min-height:110px;border:2px dashed #B9BFCC;border-radius:12px;background:rgba(255,255,255,.8);font-size:18px;cursor:pointer}
.addsec.wide{width:100%;min-height:56px}
/* 담벼락 */
.wall{display:flex;gap:16px;align-items:flex-start}
.wcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
/* 격자 */
.gridlw,.streamw{display:flex;flex-direction:column;gap:14px}
.gridl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;align-items:start}
/* 스트림 */
.streamw{max-width:680px;margin:0 auto}
.stream{display:flex;flex-direction:column;gap:14px}
.stream .pic img{max-height:480px;object-fit:contain;background:#F4F0E4}
/* 타임라인 */
.tl{display:flex;gap:34px;align-items:flex-start;width:max-content}
.tlg{display:flex;flex-direction:column;gap:6px}
.tlh{align-self:flex-start}
.tlrow{position:relative;display:flex;gap:18px;align-items:flex-start;padding-top:62px}
.tlrow::before{content:'';position:absolute;left:-16px;right:-16px;top:38px;height:6px;background:var(--ink)}
.tli{position:relative;width:280px;flex:none;display:flex;flex-direction:column}
.tli.add{width:180px}
.tli .dot{position:absolute;top:-34px;left:22px;width:24px;height:24px;background:var(--yel);border:1px solid #D5DAE3;border-radius:12px}
.tld{position:absolute;top:-62px;left:6px;font:700 12px 'Noto Sans KR',sans-serif;background:#fff;border:1px solid #D5DAE3;border-radius:8px;padding:1px 6px;white-space:nowrap}
/* 캔버스 */
.cols.L-canvas{overflow:auto;height:calc(100vh - 150px);padding:0;margin:0 clamp(8px,2vw,20px);border:1px solid #D5DAE3;border-radius:12px;background:#FFFDF4;background-image:radial-gradient(#D9D2BE 1.5px,transparent 1.5px);background-size:24px 24px}
.cv{position:relative}
.cvl{position:absolute;left:0;top:0;pointer-events:none}
.cvl line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.memo{position:absolute;width:240px}
.memo.mv{cursor:grab;touch-action:none}
.memo.mv .post{user-select:none}
.memo.drag{z-index:5;cursor:grabbing}
.memo.drag .post{box-shadow:10px 10px 0 rgba(27,31,59,.45);transform:rotate(-1.5deg)}
.memo.from .post{outline:5px solid #FF8A3D;outline-offset:2px}
.lkx{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border:1px solid #D5DAE3;border-radius:12px;border-radius:50%;background:#fff;font-size:13px;cursor:pointer;z-index:3;padding:0}
.lkx:hover{background:#FFB4A6}
.cvhint{position:absolute;left:40px;top:40px;max-width:420px;padding:16px 18px;font-size:15px;font-weight:700;line-height:1.6}
/* 캔버스 그룹: 메모를 모아 두는 칸 (선생님이 ＋ 그룹으로 만들고, 머리를 끌어 옮기고, 오른쪽 아래를 끌어 크기 바꾸기) */
.zone{position:absolute;border:2px dashed color-mix(in srgb,var(--zc) 75%,#1D2030);border-radius:18px;background:color-mix(in srgb,var(--zc) 15%,transparent)}
.zhd{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 8px 6px 14px;border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--zc) 45%,#fff);box-sizing:border-box}
.zhd.mopen{z-index:9}
.zhd b{font:800 17px/1.3 'Noto Sans KR',sans-serif;color:#1D2030;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zhd small{flex:none;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.8);font:700 12px 'Noto Sans KR',sans-serif;color:#4B4F62}
.zhd .sp{flex:1}
.zhd.zm{cursor:grab;touch-action:none}
.zone.mopen{z-index:7}
.zone.zdrag{z-index:4;box-shadow:0 12px 30px rgba(16,24,40,.25)}
.zadd{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:#fff;font:400 22px/1 'Noto Sans KR',sans-serif;color:#1D2030;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.zadd:hover{background:#F2F4F7}
.zrs{position:absolute;z-index:3;width:26px;height:26px;cursor:nwse-resize;touch-action:none;border-radius:0 0 16px 0;background:linear-gradient(135deg,transparent 55%,color-mix(in srgb,var(--zc) 80%,#1D2030) 55%)}
.mrs{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:6px;cursor:ew-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(29,32,48,.55) 50%);opacity:0;transition:opacity .15s}
.memo:hover .mrs,.memo.rsz .mrs{opacity:1}
@media (hover:none){.mrs{opacity:.8}}
.zbar{position:sticky;left:12px;top:12px;z-index:6;width:max-content;display:flex;gap:8px}
.zbtn{min-height:40px;padding:0 16px;border:0;border-radius:12px;background:#1D2030;color:#fff;font:800 15px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(16,24,40,.25)}
.zbtn:hover{background:#2F3450}
.pmn .zcs{display:flex;gap:6px;padding:6px 8px}
.pmn .zcs button{min-height:0;width:26px;height:26px;padding:0;border:1px solid #C9CED8;border-radius:50%}
/* 글 카드 */
.post{background:#fff;border:1px solid #D5DAE3;border-radius:12px;box-shadow:0 2px 10px rgba(16,24,40,.12);display:flex;flex-direction:column}
.post.mine{box-shadow:4px 4px 0 var(--blue)}
.pic{display:block;width:100%;padding:0;border:0;border-bottom:1px solid #E3E6EC;background:#F4F0E4;cursor:zoom-in}
.pic img{display:block;width:100%;max-height:340px;object-fit:cover}
.pin{padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.pin h3{margin:0;font:700 16px/1.4 'Noto Sans KR',sans-serif;overflow-wrap:anywhere}
.pin p{margin:0;font-size:14px;line-height:1.6;color:#333A55;white-space:pre-line;overflow-wrap:anywhere}
.pin p.big{line-height:1}
.cm li .stk{margin:2px 0}
.limg{display:block;border-radius:12px;overflow:hidden;background:#EEF1F6;line-height:0}
.limg img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#EEF1F6}
.lnk{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;background:#EAF3FF;border:1px solid #D5DAE3;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.by{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;padding:0 4px 4px 12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.by b{color:var(--ink)}
.pa{display:flex;flex-wrap:wrap}
.rx{padding:0 10px 8px;display:flex;flex-direction:column;gap:6px}
.tiny{min-height:36px;padding:0 6px;border:0;background:transparent;font:700 12px 'Noto Sans KR',sans-serif;color:var(--sub);cursor:pointer;text-decoration:underline}
.cm{border-top:3px dashed #D9D2BE;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;background:rgba(255,252,243,.85)}
.cm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cm li{font-size:13px;line-height:1.5;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start}
.cm li b{flex:none;font-weight:700}
.cm li span{flex:1}
.cm li .tiny{min-height:24px;padding:0 2px}
.cm form{display:flex;gap:6px}
.cm input{flex:1;min-height:38px;border:1px solid #D5DAE3;border-radius:12px;padding:4px 8px;font:500 14px 'Noto Sans KR',sans-serif}
.cm button.go{min-height:38px;padding:0 10px;border:1px solid #D5DAE3;border-radius:12px;background:var(--blue);color:#fff;font:400 15px 'Jua',sans-serif;cursor:pointer}
.cm .old{font-size:12px;color:var(--sub)}
.addpost{min-height:48px;border:2px dashed #B9BFCC;border-radius:12px;background:rgba(255,255,255,.86);font-size:16px;cursor:pointer}
.fab{position:fixed;right:clamp(14px,3vw,30px);bottom:54px;z-index:20;width:64px;height:64px;border:1px solid #D5DAE3;border-radius:12px;border-radius:50%;background:var(--yel);font:400 38px/1 'Jua',sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.08);padding:0}
.fab:hover{filter:brightness(1.05)}
.fab:active{transform:translateY(4px);box-shadow:0 1px 2px rgba(16,24,40,.08)}
/* 글 쓰기 창 (패들렛처럼 깔끔하게: 제목·내용 칸 + 아이콘 줄) */
.modal>.pf.cmpbox{max-width:560px;padding:0;overflow:hidden}
.cmp{display:flex;flex-direction:column;gap:6px;padding:12px 14px 12px;transition:background .15s}
.cmp-top{display:flex;align-items:center;gap:8px;min-height:40px}
.cin{min-height:36px;border:2px solid rgba(27,31,59,.3);background:rgba(255,255,255,.75);color:var(--ink);padding:0 10px;font:500 14px 'Noto Sans KR',sans-serif}
.cin:focus{border-color:var(--ink);background:#fff}
.cmp-top .sel{max-width:60%}
.cmp-top .nm{width:110px}
.cmp-x{margin-left:auto;width:40px;height:40px;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.cmp-x:hover{background:rgba(27,31,59,.08)}
.cmp-t{width:100%;border:0;border-bottom:2px solid rgba(27,31,59,.15);background:transparent;color:var(--ink);font:700 22px/1.3 'Noto Sans KR',sans-serif;padding:8px 2px}
.cmp-b{width:100%;border:0;background:transparent;color:var(--ink);font:400 16px/1.6 'Noto Sans KR',sans-serif;padding:6px 2px;min-height:120px;resize:vertical}
.cmp-t::placeholder,.cmp-b::placeholder{color:rgba(27,31,59,.45)}
.cmp-att{display:flex;flex-direction:column;gap:6px}
.cmp-att:empty{display:none}
.cmp-pic{position:relative;align-self:flex-start}
.cmp-pic img{display:block;max-height:170px;max-width:100%;border:1px solid #D5DAE3;border-radius:12px}
.cmp-pic button{position:absolute;top:6px;right:6px;width:32px;height:32px;border:1px solid #D5DAE3;border-radius:8px;border-radius:50%;background:#fff;font-size:14px;cursor:pointer}
.cmp-wait{font-size:13px;font-weight:700;color:var(--sub)}
.cmp-sw{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0}
.cmp-sw button{width:32px;height:32px;border:1px solid #D5DAE3;border-radius:8px;border-radius:50%;cursor:pointer;padding:0}
.cmp-sw button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.cmp-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px solid rgba(27,31,59,.15);padding-top:8px;margin-top:2px}
.cmp-tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tool,.cmp-tools .pk-eb{width:44px;height:44px;min-width:44px;border:0;border-radius:10px;background:transparent;font-size:22px;line-height:1;cursor:pointer;padding:0}
.tool:hover,.cmp-tools .pk-eb:hover,.tool[aria-pressed=true],.cmp-tools .pk-eb[aria-expanded=true]{background:rgba(27,31,59,.1)}
.cmp .msg{font-size:13px}
/* 창 */
.dlg{display:flex;flex-direction:column;gap:10px;padding:20px}
.dlg .tp{display:flex;align-items:center;gap:10px}
.dlg h2{font-size:24px;flex:1}
.dlg div.lb{display:flex;flex-direction:column;gap:6px;font:700 15px/1.3 'Noto Sans KR',sans-serif}
.dlg div.lb .note{font-weight:500}
.lbt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prev{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prev img{max-width:140px;max-height:110px;border:1px solid #D5DAE3;border-radius:12px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border:1px solid #D5DAE3;border-radius:12px;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:4px solid var(--ink);outline-offset:2px}
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border:1px solid #D5DAE3;border-radius:12px;background:#fff;text-align:left;cursor:pointer;min-height:110px}
.fmt .fi{font-size:28px;line-height:1}
.fmt b{font:400 20px 'Jua',sans-serif}
.fmt small{font:500 12px/1.45 'Noto Sans KR',sans-serif;color:var(--sub)}
.fmt[aria-checked=true]{background:var(--yel);box-shadow:inset 0 0 0 3px var(--ink)}
.ck{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.ck input{width:22px;height:22px}
.big{max-width:min(96vw,1100px)!important;background:#fff;padding:10px}
.big img{display:block;width:100%;max-height:82vh;object-fit:contain}
.msg{margin:0;font-size:14px;font-weight:700;color:#B3261E}
.msg:empty{display:none}
.empty{margin:0;max-width:520px}
/* 내 패들렛(선생님 화면) 안에 넣어 보일 때 */
.embed .moa-strip,.embed .head .brands,.embed #back,.embed .head h1,.embed .ground,.embed .bav{display:none}
/* 내 패들렛 안에 넣어 보일 때: 머리 띠(형식·잠그기·글 쓰기)는 바깥 화면 머리 띠 한곳에 있음 */
.embed .head,.embed #lockbar{display:none}
.embed .cols{padding-top:14px}
.embed .head{padding:8px 12px}
.embed .head small{color:var(--sub);text-shadow:none;font-size:14px}
.embed .cols{padding-bottom:90px}
.embed .cols.L-canvas{height:calc(100vh - 80px)}
.embed .fab{bottom:20px}
@media (max-width:600px){.sec{width:82vw}.head h1{font-size:23px}.tli{width:76vw}.memo{width:220px}}
@media (prefers-reduced-motion:reduce){.memo.drag .post{transform:none}}

/* ===== 패들렛처럼: 자리와 모양을 패들렛과 같게 (2026-11-25) =====
   칸: 흰 머리 띠(굵은 제목 + ⋮) → 바로 아래 '+' 줄 → 글 카드. 맨 오른쪽 '칸 추가'.
   카드: 둥근 흰 카드, 옅은 그림자 · 제목(+⋮) → 사진·링크·파일 → 내용 → 쓴 사람 → 반응 → 댓글 */
.head{gap:12px 14px}
.bav{width:64px;height:64px;flex:none;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;overflow:hidden}
.bav .msc{height:52px;margin-top:6px}
.head h1{font:800 23px/1.3 'Noto Sans KR',sans-serif;color:#fff;text-shadow:0 2px 0 var(--ink),0 3px 10px rgba(0,0,0,.35)}
.head small{font:500 14px/1.4 'Noto Sans KR',sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.crow{gap:14px}
.sec{width:280px;gap:10px}
.shd{margin:0;padding:6px 4px 6px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.9);border:0;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.12);font:800 17px/1.3 'Noto Sans KR',sans-serif;color:#1D2030}
.shd>span:first-child{overflow-wrap:anywhere}
.gh.shd,.tlh.shd{align-self:stretch}
.tlh.shd{align-self:flex-start;min-width:240px}
.addpost.top{display:flex;align-items:center;justify-content:center;min-height:38px;border:0;border-radius:14px;background:rgba(255,255,255,.62);color:#3B3F52;font:300 26px/1 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.addpost.top:hover,.addpost.top:focus-visible{background:rgba(255,255,255,.95)}
.addsec{width:auto;min-width:100px;min-height:40px;align-self:flex-start;padding:0 18px;border:0;border-radius:14px;background:rgba(255,255,255,.9);color:#1D2030;font:700 16px 'Noto Sans KR',sans-serif;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.addsec:hover{background:#fff}
.addsec.wide{width:100%;min-height:50px}
.addpost{border:0;border-radius:14px;background:rgba(255,255,255,.75)}
.post{position:relative;border:0;border-radius:16px;box-shadow:0 1px 3px rgba(16,24,40,.14),0 8px 20px rgba(16,24,40,.10)}
.post.mine{box-shadow:0 0 0 3px rgba(58,111,242,.55),0 8px 20px rgba(16,24,40,.10)}
.post.mopen,.memo:has(.mopen),.shd.mopen{z-index:8}
.ptop{display:flex;align-items:flex-start;gap:4px;padding:12px 6px 0 14px}
.ptop h3{flex:1;margin:0;font:800 16px/1.4 'Noto Sans KR',sans-serif;color:#1D2030;overflow-wrap:anywhere}
.ptop .sp{flex:1}
.pin{padding:8px 14px 8px;gap:8px}
.pin:empty{display:none}
.pin p{font-size:14px;color:#3B3F52}
.pic{border:0;border-radius:12px;overflow:hidden;background:#EEF1F6}
.pic img{max-height:380px}
.lnk{position:relative;display:block;height:108px;min-height:0;padding:0;border:0;border-radius:12px;overflow:hidden;background:#E9EDF3 center/cover no-repeat;text-decoration:none;color:#1D2030}
.lnk i{position:absolute;inset:0 0 30px;display:grid;place-items:center;font-style:normal;font-size:40px;opacity:.55}
.lnk.yt i{inset:0;opacity:1;font-size:30px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.lnk b{position:absolute;left:0;bottom:0;max-width:85%;padding:6px 14px 6px 12px;background:#fff;border-radius:0 14px 0 0;font:500 14px/1.3 'Noto Sans KR',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk:hover b{text-decoration:underline}
.by{display:block;padding:0 14px 8px;font-size:13px;color:#6B7085}
.by b{color:#3B3F52}
.rx{padding:10px 14px;border-top:1px solid rgba(16,24,40,.1)}

<script type="module">
import { fs, ensureUser, isTeacher, teacherRole, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, onSnapshot, serverTimestamp, esc, safeUrl, hostOf, errText, getSession, toast, PREVIEW, previewToast } from './js/fb.js';
import { emoHTML, emoRich, emoOnly, emoTok } from './js/emo.js';
import { installPadkit, filesHTML, reactsHTML, emojiBtn, emojiPal, closePals, checkFile, uploadFile, removeFile, cleanFiles, copyFiles, fmtSize, fileKind, MAX_FILES, PCOLORS, pcolor, okColor, FORMATS, layoutOf, formatName, usesSecs } from './js/padkit.js';
const $ = (id) => document.getElementById(id);
const NAME_KEY = 'moa_board_name';
const Q = new URLSearchParams(location.search);
const bid = Q.get('b');
const EMBED = Q.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const CW = 3200, CH = 2400; // 캔버스 크기
$('back').addEventListener('click', () => { if (history.length > 1 && document.referrer) history.back(); else location.href = getSession() ? 'class.html' : './'; });
const S = { user: null, teacher: false, board: null, parts: [], live: [], cmts: [], reacts: [], pos: {}, links: [], liveErr: false, open: new Set(), pic: '', sec: 0, busy: false, edit: null, newFiles: [], keepFiles: [], color: '', at: null, linkFrom: null, drag: null, dirty: false, noClick: 0, fmt: 'columns' };
function fail(m) { $('title').textContent = '모아보드를 열 수 없어요'; $('cols').innerHTML = '<p class="empty pf" style="max-width:520px;padding:18px">' + esc(m) + '</p>'; }

/* ---------- 이름 ---------- */
function myName() {
  if (S.teacher) return '선생님';
  const s = getSession(); if (s && s.name) return s.name;
  try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
}
function keepName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) { /* 무시 */ } }
const cleanTxt = (s, n) => String(s || '').normalize('NFC').replace(/[\u0000-\u0008\u000b-\u001f]/g, '').trim().slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 쓸 수 있는지 ---------- */
const canWrite = () => !!S.board && !S.board.trash && (S.teacher || (S.board.public === true && S.board.lock !== true));
const me = () => (S.user ? S.user.uid : '');
const isMine = (p) => p.kind === 'live' && !!S.user && p.uid === S.user.uid;
const canEdit = (p) => S.teacher || (isMine(p) && canWrite());
const canDel = (p) => S.teacher || isMine(p);
const canMove = (p) => !PREVIEW && (S.teacher || (isMine(p) && canWrite()));
const ms = (t) => (t && typeof t.toMillis === 'function' ? t.toMillis() : typeof t === 'number' ? t : 0);
function when(t) {
  const v = ms(t); if (!v) return '방금';
  const d = new Date(v), now = Date.now();
  if (now - v < 60000) return '방금';
  if (now - v < 3600000) return Math.floor((now - v) / 60000) + '분 전';
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
const tms = (p) => (p.kind === 'live' ? ms(p.at) || Date.now() : Date.parse(p.at || '') || 0);
function dayOf(p) { const v = tms(p); if (!v) return '날짜 없음'; const d = new Date(v); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
const secsOf = () => (S.board && S.board.sections && S.board.sections.length ? S.board.sections : ['글 모음']);
const secOf = (p, secs) => { const s = +p.sec || 0; return s >= 0 && s < secs.length ? s : 0; };
function allPosts() {
  const old = [];
  S.parts.slice().sort((a, c) => a.n - c.n).forEach((pt) => (pt.posts || []).forEach((x) => old.push(Object.assign({ kind: 'old', part: pt.id }, x))));
  const live = S.live.slice().sort((a, c) => ms(a.at) - ms(c.at)).map((x) => Object.assign({ kind: 'live' }, x));
  // 📌 고정한 글은 칸 맨 위로 (나머지 순서는 그대로)
  return old.concat(live).sort((a, c) => (c.pin ? 1 : 0) - (a.pin ? 1 : 0));
}
const postById = (id) => allPosts().find((p) => p.id === id) || null;

/* ---------- 그리기 ---------- */
function draw() {
  const b = S.board; if (!b) return;
  if (S.drag) { S.dirty = true; return; } // 메모를 옮기는 동안은 다시 그리지 않음
  const L = layoutOf(b);
  $('title').textContent = b.title || '모아보드'; document.title = (b.title || '모아보드') + ' · 모아팡';
  const all = allPosts();
  $('sub').textContent = (b.date ? b.date + ' · ' : '') + formatName(b) + ' · 글 ' + all.length + '개 · 댓글 ' + S.cmts.length + '개';
  const w = canWrite();
  $('writeBtn').hidden = !w; $('writeBtn').textContent = L === 'canvas' ? '+ 메모' : '+ 글 쓰기';
  $('fab').hidden = !w || L === 'columns';
  $('fab').setAttribute('aria-label', L === 'canvas' ? '메모 붙이기' : '글 쓰기');
  $('fmtBtn').hidden = !S.teacher;
  const F = FORMATS.find((f) => f[0] === L); $('fmtBtn').textContent = F[2] + ' 형식: ' + F[1];
  $('lockBtn').hidden = !S.teacher;
  $('lockBtn').textContent = b.lock ? '🔒 잠김' : '🔓 잠그기';
  $('lockBtn').setAttribute('aria-label', b.lock ? '학생 글쓰기 잠김, 누르면 열기' : '학생 글쓰기 잠그기');
  $('lockbar').hidden = w && !S.liveErr;
  $('lockbar').textContent = b.trash ? '🗑 휴지통에 있는 모아보드예요' : S.liveErr ? '친구들 글을 아직 불러올 수 없어요' : !b.public ? '👀 학생에게 아직 안 보여요' : '🔒 글쓰기가 잠겨 있어요 (읽기만)';
  if (S.teacher && !b.public) $('lockbar').hidden = false;
  drawLinkBar();
  const byPid = new Map(); S.cmts.slice().sort((a, c) => ms(a.at) - ms(c.at)).forEach((c) => { if (!byPid.has(c.pid)) byPid.set(c.pid, []); byPid.get(c.pid).push(c); });
  const rByPid = new Map(); S.reacts.forEach((r) => { if (!rByPid.has(r.pid)) rByPid.set(r.pid, []); rByPid.get(r.pid).push(r); });
  const ctx = { byPid, rByPid, w };
  const ae = document.activeElement;
  const keepFocus = ae && ae.dataset && ae.dataset.cin;
  const keepSel = keepFocus ? [ae.selectionStart, ae.selectionEnd] : null;
  const keepVals = {}; document.querySelectorAll('[data-cin]').forEach((i) => { if (i.value) keepVals[i.dataset.cin] = i.value; });
  const box = $('cols'), same = box.classList.contains('L-' + L), sx = box.scrollLeft, sy = box.scrollTop;
  const secY = [...box.querySelectorAll('.secb')].map((e) => e.scrollTop);
  box.className = 'cols L-' + L;
  document.body.classList.toggle('colsfit', L === 'columns');
  if (L !== 'columns') box.style.height = '';
  let h;
  if (L === 'canvas') h = canvasHTML(all, ctx);
  else if (L === 'columns') h = columnsHTML(all, ctx);
  else if (L === 'wall') { const n = wallCols(), g = Array.from({ length: n }, () => []); all.forEach((p, i) => g[i % n].push(p)); h = all.length ? wallHTML(g, ctx) : emptyHTML(w); }
  else h = groupedHTML(L, all, ctx);
  box.innerHTML = h;
  if (L === 'wall' && all.length) balanceWall(all, ctx);
  if (same) { box.scrollLeft = sx; box.scrollTop = sy; box.querySelectorAll('.secb').forEach((e, i) => { if (secY[i]) e.scrollTop = secY[i]; }); }
  if (L === 'columns') fitCols();
  if (L === 'canvas') afterCanvas();
  Object.keys(keepVals).forEach((k) => { const i = document.querySelector('[data-cin="' + CSS.escape(k) + '"]'); if (i) i.value = keepVals[k]; });
  if (keepFocus) { const i = document.querySelector('[data-cin="' + CSS.escape(keepFocus) + '"]'); if (i) { i.focus(); try { i.setSelectionRange(keepSel[0], keepSel[1]); } catch (e) { /* 무시 */ } } }
}
// 담벼락: 칸 수를 화면 넓이에 맞추고, 먼저 차례대로 놓은 뒤 높이를 재서 가장 낮은 줄부터 채움 (빈틈 없이)
function wallCols() { const cs = getComputedStyle(box); return clamp(Math.floor((box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + 16) / 306), 1, 8); }
const wallHTML = (g, ctx) => '<div class="wall">' + g.map((c) => '<div class="wcol">' + c.map((p) => postHTML(p, ctx)).join('') + '</div>').join('') + '</div>';
function balanceWall(all, ctx) {
  const cols = box.querySelectorAll('.wcol'); if (cols.length < 2) return;
  const hs = {}; box.querySelectorAll('.wall .post').forEach((el) => { hs[el.dataset.pid] = el.offsetHeight; });
  const H = Array.from(cols, () => 0), g = Array.from(cols, () => []);
  all.forEach((p) => { const k = H.indexOf(Math.min(...H)); g[k].push(p); H[k] += (hs[p.id] || 200) + 16; });
  box.innerHTML = wallHTML(g, ctx);
}
// '🏫 내 교실': 선생님은 이 패들렛 반의 진행판, 학생은 들어와 있는 자기 반 교실(없으면 이 반 방번호로 첫 화면)
async function classLink() {
  const a = $('toClass'); if (!a || EMBED || PREVIEW) return;
  const cid = S.board && S.board.cid && S.board.cid !== 'lib' ? S.board.cid : '';
  if (S.teacher) { a.href = 'teacher.html#' + (cid ? 'live-' + encodeURIComponent(cid) : 'classes'); a.textContent = '🏫 교실'; a.title = '이 반 교실(진행판)로 가기'; a.hidden = false; return; }
  const ses = getSession();
  if (ses && ses.cid) { a.href = 'class.html'; a.title = (ses.className || '내 반') + ' 교실로 가기'; a.hidden = false; return; }
  if (!cid) return;
  try { const c = await getDoc(doc(fs, 'classes', cid)); const room = c.exists() && c.data().room; if (room) { a.href = './?r=' + encodeURIComponent(room); a.title = '이 반 교실에 들어가기 (이름 쓰기)'; a.hidden = false; } } catch (e) { /* 못 읽으면 단추를 숨긴 채로 */ }
}
// 칸 형식: 판 높이를 화면 아래까지 맞추고(땅 띠 위까지), 칸 안에서만 스크롤
function fitCols() {
  const box = $('cols'); if (!box || !box.classList.contains('L-columns')) return;
  const top = box.getBoundingClientRect().top + scrollY, bottom = 0; // 좌우 스크롤바가 화면 맨 아래에 붙게
  box.style.height = Math.max(320, innerHeight - top - bottom) + 'px';
}
addEventListener('resize', fitCols);
let wallT = 0;
window.addEventListener('resize', () => { clearTimeout(wallT); wallT = setTimeout(() => { if (S.board && layoutOf(S.board) === 'wall' && !$('dlg').innerHTML) draw(); }, 200); });
const emptyHTML = (w) => '<p class="empty pf" style="padding:18px">아직 글이 없어요.' + (w ? ' <b>+</b>를 눌러 써 보세요.' : '') + '</p>';
function secHead(name, i, n, cls) {
  const secs = secsOf();
  const menu = S.teacher ? '<span class="pmw"><button type="button" class="dots" data-act="menu" aria-expanded="false" aria-label="' + esc(name) + ' 칸 메뉴" title="칸 메뉴">⋮</button><span class="pmn" hidden>' +
    '<button type="button" data-act="rensec" data-s="' + i + '">칸 이름 바꾸기</button>' + (!n && secs.length > 1 ? '<button type="button" data-act="delsec" data-s="' + i + '">빈 칸 지우기</button>' : '') + '</span></span>' : '';
  return '<h2 class="' + cls + ' shd"><span>' + esc(name) + '</span>' + menu + '</h2>';
}
// 칸 머리 바로 아래 '+' 줄 (패들렛처럼 글 쓰기는 칸 위쪽에)
const addTop = (i, name) => '<button class="addpost top hd" type="button" data-act="write" data-s="' + i + '" aria-label="' + esc(name || '이 칸') + '에 글 쓰기" title="글 쓰기">+</button>';
function columnsHTML(all, ctx) {
  const secs = secsOf();
  return '<div class="crow">' + secs.map((name, i) => {
    const list = all.filter((p) => secOf(p, secs) === i);
    // 칸마다 따로 스크롤 (패들렛처럼 칸 사이에 가는 스크롤 막대)
    return '<section class="sec">' + secHead(name, i, list.length, 'sech') + '<div class="secb" tabindex="-1">' + (ctx.w ? addTop(i, name) : '') + list.map((p) => postHTML(p, ctx)).join('') + '</div></section>';
  }).join('') + (S.teacher ? '<button class="addsec hd" type="button" data-act="addsec">칸 추가</button>' : '') + '</div>';
}
function groupedHTML(L, all, ctx) {
  const b = S.board, secs = secsOf(), on = usesSecs(b);
  const groups = on ? secs.map((name, i) => ({ name, i, list: all.filter((p) => secOf(p, secs) === i) })) : [{ name: '', i: 0, list: all }];
  if (L === 'timeline') {
    return '<div class="tl">' + groups.map((g) => {
      const list = g.list.slice().sort((a, c) => tms(a) - tms(c));
      return '<div class="tlg">' + (on ? secHead(g.name, g.i, list.length, 'tlh') : '') + '<div class="tlrow">' +
        list.map((p) => '<div class="tli"><span class="tld">' + esc(dayOf(p)) + '</span><i class="dot" aria-hidden="true"></i>' + postHTML(p, ctx) + '</div>').join('') +
        (ctx.w ? '<div class="tli add"><i class="dot" aria-hidden="true"></i><button class="addpost hd" type="button" data-act="write" data-s="' + g.i + '">+ 글 쓰기</button></div>' : list.length ? '' : '<div class="tli add"><i class="dot" aria-hidden="true"></i><p class="note">아직 글이 없어요.</p></div>') + '</div></div>';
    }).join('') + (S.teacher && on ? '<button class="addsec hd" type="button" data-act="addsec" style="margin-top:62px">칸 추가</button>' : '') + '</div>';
  }
  const cls = L === 'grid' ? 'gridl' : 'stream';
  return '<div class="' + cls + 'w">' + groups.map((g) => (on ? secHead(g.name, g.i, g.list.length, 'gh') + (ctx.w ? addTop(g.i, g.name) : '') : '') +
    '<div class="' + cls + '">' + g.list.map((p) => postHTML(p, ctx)).join('') + '</div>').join('') +
    (S.teacher && on ? '<button class="addsec wide hd" type="button" data-act="addsec">칸 추가</button>' : '') + (all.length || (ctx.w && on) ? '' : emptyHTML(ctx.w)) + '</div>';
}
// 캔버스 그룹 (보드 문서의 zones: [{id, n 이름, x, y, w, h, c 색}])
const ZC = ['#FFD23F', '#7FD3F7', '#9BE07A', '#FF9AA2', '#C9A7FF', '#FFB870'];
const zonesOf = () => (S.board && Array.isArray(S.board.zones) ? S.board.zones : []).filter((z) => z && z.id);
const inZone = (z, x, y) => x + 120 >= z.x && x + 120 <= z.x + z.w && y + 40 >= z.y && y + 40 <= z.y + z.h; // 메모 윗부분 가운데가 그룹 안에 있으면 그 그룹
// 그룹 칸(바탕)은 메모 아래에, 그룹 머리·크기 손잡이는 메모 위에 그려서 메모가 겹쳐도 머리를 끌 수 있게
function zonesHTML(spots, ctx) {

/* ---------- 사진 줄이기 (긴 쪽 1280px, JPEG, 약 250KB 아래) ---------- */
function loadImg(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); ok(im); };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('img')); };
    im.src = url;
  });
}
async function shrink(file) {
  const im = await loadImg(file);
  let side = 1280, q = 0.82, out = '';
  for (let k = 0; k < 8; k++) {
    const r = Math.min(1, side / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * r)), h = Math.max(1, Math.round(im.naturalHeight * r));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
    out = cv.toDataURL('image/jpeg', q);
    if (out.length <= 340000) return out;
    if (q > 0.6) q -= 0.1; else side = Math.round(side * 0.8);
  }
  return out.length <= 700000 ? out : '';
}

async function patchPost(p, patch) {
  if (p.kind === 'live') return updateDoc(doc(fs, 'boards', bid, 'posts', p.id), patch);
  const part = S.parts.find((x) => x.id === p.part); if (!part) return;
  return savePart(part, (part.posts || []).map((x) => x.id === p.id ? Object.assign({}, x, patch) : x));
}
async function copyPostGo() {
  const c = CP; if (!c) return;
  const tb = c.bs.find((x) => x.id === $('cpB').value); if (!tb) return;
  const move = $('cpMv').checked, p = c.p;
  $('cpGo').disabled = true; $('cpM').textContent = '복사하는 중…';
  try {
    let si = +$('cpS').value;
    if (si < 0) { const secs = (tb.sections && tb.sections.length ? tb.sections : ['글 모음']).concat(c.srcSec); si = secs.length - 1; await updateDoc(doc(fs, 'boards', tb.id), { sections: secs }); }
    const d = { sec: si, title: p.title || '', body: p.body || '', link: p.link || '', img: p.img || '', author: p.author || '선생님', uid: S.user.uid, at: serverTimestamp() };
    const fl = cleanFiles(p.files); if (fl.length) d.files = await copyFiles(bid, tb.id, fl, S.user.uid);
    const col = okColor(p.color); if (col) d.color = col;
    await setDoc(doc(collection(fs, 'boards', tb.id, 'posts')), d);
    CP = null; closeDlg();
    if (move) await delPost(p.id, true);
    toast('\'' + tb.title + '\'(으)로 ' + (move ? '옮겼어요.' : '복사했어요.'));
  } catch (err) { if ($('cpM')) { $('cpM').textContent = errText(err); $('cpGo').disabled = false; } else toast(errText(err), true); }
}
async function delPost(id, quiet) {
  const p = postById(id); if (!p || !canDel(p)) return;
  if (!quiet && !confirm('이 글을 지울까요? 딸린 파일·댓글·이모티콘도 함께 지워져요. 지운 글은 되돌릴 수 없어요.')) return;
  try {
    if (p.kind === 'live') await deleteDoc(doc(fs, 'boards', bid, 'posts', id));
    else {
      const part = S.parts.find((x) => x.id === p.part); if (!part) return;
      await savePart(part, (part.posts || []).filter((x) => x.id !== id));
      await updateDoc(doc(fs, 'boards', bid), { postCount: Math.max(0, (S.board.postCount || 1) - 1) });
    }
    const ok = (x) => S.teacher || x.uid === me();
    const later = [];
    if (S.teacher || isMine(p)) cleanFiles(p.files).forEach((f) => later.push(removeFile(bid, f)));
    S.cmts.filter((x) => x.pid === id && ok(x)).forEach((c) => later.push(deleteDoc(doc(fs, 'boards', bid, 'comments', c.id))));
    S.reacts.filter((x) => x.pid === id && ok(x)).forEach((r) => later.push(deleteDoc(doc(fs, 'boards', bid, 'reacts', r.id))));
    if (S.pos[id] && ok(S.pos[id])) later.push(deleteDoc(doc(fs, 'boards', bid, 'pos', id)));
    S.links.filter((l) => (l.a === id || l.b === id) && ok(l)).forEach((l) => later.push(deleteDoc(doc(fs, 'boards', bid, 'links', l.id))));
    await Promise.allSettled(later);
    toast('글을 지웠어요.');
  } catch (err) { toast(errText(err), true); }
}
async function delComment(id) {
  if (!confirm('이 댓글을 지울까요?')) return;
  try { await deleteDoc(doc(fs, 'boards', bid, 'comments', id)); } catch (err) { toast(errText(err), true); }
}
// 칸 지우기: 빈 칸만. 뒤 칸 글들의 칸 번호를 하나씩 당김
async function delSec(i) {
  const secs = secsOf().slice(), all = allPosts();
  if (secs.length <= 1 || all.some((p) => secOf(p, secs) === i)) return;
  if (!confirm('빈 칸 \'' + secs[i] + '\'을 지울까요?')) return;
  try {
    for (const part of S.parts) if ((part.posts || []).some((x) => (+x.sec || 0) > i)) await savePart(part, part.posts.map((x) => ((+x.sec || 0) > i ? Object.assign({}, x, { sec: x.sec - 1 }) : x)));
    for (const p of S.live) if ((+p.sec || 0) > i) await updateDoc(doc(fs, 'boards', bid, 'posts', p.id), { sec: p.sec - 1 });
    secs.splice(i, 1);
    await updateDoc(doc(fs, 'boards', bid), { sections: secs });
    toast('빈 칸을 지웠어요.');
  } catch (err) { toast(errText(err), true); }
}

/* ---------- 누르기 ---------- */
function closeMenus() {
  document.querySelectorAll('.pmn:not([hidden])').forEach((m) => { m.hidden = true; const b = m.previousElementSibling; if (b) b.setAttribute('aria-expanded', 'false'); });
  document.querySelectorAll('.mopen').forEach((x) => x.classList.remove('mopen'));
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.pmn:not([hidden])')) closeMenus(); });
document.addEventListener('click', async (e) => {
  // 선 잇기: 이을 메모를 누름
  if (S.linkFrom && S.board && layoutOf(S.board) === 'canvas') {
    const m = e.target.closest('.memo');
    if (m && !e.target.closest('button,a,input,textarea,select,form,.pk-pal')) { if (Date.now() - S.noClick > 300) linkTo(m.dataset.pid); return; }
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.dataset.act !== 'menu') closeMenus();
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'menu') {
    const m = t.nextElementSibling, open = m.hidden;
    closeMenus();
    if (open) { m.hidden = false; t.setAttribute('aria-expanded', 'true'); t.closest('.post,.shd,.memo,.zhd')?.classList.add('mopen'); }
    return;
  }
  if (a === 'ovclose') { if (e.target === t) closeDlg(); return; }
  if (a === 'close') closeDlg();
  else if (a === 'write') { if (canWrite()) writeDlg(+t.dataset.s || 0, null, newAt()); }
  else if (a === 'editpost') { const p = postById(id); if (p && canEdit(p)) writeDlg(0, p); }
  else if (a === 'pickpic') $('picIn').click();
  else if (a === 'nopic') { S.pic = ''; drawAtt(); }
  else if (a === 'showlink') { const l = $('wl'); if (l) { l.hidden = !l.hidden; t.setAttribute('aria-pressed', String(!l.hidden)); if (!l.hidden) l.focus(); } }
  else if (a === 'showsw') { const r = $('swrow'); if (r) { r.hidden = !r.hidden; t.setAttribute('aria-pressed', String(!r.hidden)); } }
  else if (a === 'pickfile') { if (S.keepFiles.length + S.newFiles.length >= MAX_FILES) { $('wm').textContent = '파일은 ' + MAX_FILES + '개까지예요.'; return; } $('fileIn').click(); }
  else if (a === 'unnew') { S.newFiles.splice(+t.dataset.i, 1); drawAtt(); }
  else if (a === 'pcolor') { S.color = t.dataset.v; t.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === t))); if ($('wf')) $('wf').style.background = pcolor(S.color); }
  else if (a === 'pickfmt') { S.fmt = t.dataset.v; t.parentNode.querySelectorAll('[role=radio]').forEach((x) => x.setAttribute('aria-checked', String(x === t))); $('grpL').hidden = !/^(grid|stream|timeline)$/.test(S.fmt); }
  else if (a === 'delpost') delPost(id);
  else if (a === 'zone') { if (S.teacher) addZone(); }
  else if (a === 'zadd') { const z = zonesOf().find((x) => x.id === t.dataset.zid); if (z && canWrite()) writeDlg(0, null, zoneSpot(z)); }
  else if (a === 'zren') { const z = zonesOf().find((x) => x.id === t.dataset.zid); closeMenus(); if (z && S.teacher) zoneDlg(z); }
  else if (a === 'zcol') { const z = zonesOf().find((x) => x.id === t.dataset.zid); closeMenus(); if (z && S.teacher) saveZones(zonesOf().map((x) => x.id === z.id ? Object.assign({}, x, { c: t.dataset.v }) : x)).then(draw, (err) => toast(errText(err), true)); }
  else if (a === 'zdel') { const z = zonesOf().find((x) => x.id === t.dataset.zid); closeMenus(); if (z && S.teacher && confirm('\'' + (z.n || '그룹') + '\' 그룹을 지울까요? 그룹 칸만 없어지고 안에 있던 메모는 그 자리에 그대로 남아요.')) saveZones(zonesOf().filter((x) => x.id !== z.id)).then(draw, (err) => toast(errText(err), true)); }
  else if (a === 'copypost' || a === 'movepost') { const p = postById(id); closeMenus(); if (p && S.teacher) copyPostDlg(p, a === 'movepost'); }
  else if (a === 'duppost') { const p = postById(id); closeMenus(); if (p && S.teacher) dupPost(p); }
  else if (a === 'pinpost') { const p = postById(id); closeMenus(); if (p && S.teacher) patchPost(p, { pin: !p.pin }).then(() => toast(p.pin ? '고정을 풀었어요.' : '칸 맨 위에 고정했어요.'), (err) => toast(errText(err), true)); }
  else if (a === 'setcolor') { const p = postById(id); if (p && canEdit(p) && !PREVIEW) { closeMenus(); patchPost(p, { color: okColor(t.dataset.v) }).catch((err) => toast(errText(err), true)); } }
  else if (a === 'delcm') delComment(id);
  else if (a === 'more') { S.open.add(id); draw(); }
  else if (a === 'less') { S.open.delete(id); draw(); }
  else if (a === 'linkfrom') { if (canWrite()) { S.linkFrom = S.linkFrom === id ? null : id; draw(); } }
  else if (a === 'nolink') { S.linkFrom = null; draw(); }
  else if (a === 'dellink') { if (confirm('이 선을 지울까요?')) { try { await deleteDoc(doc(fs, 'boards', bid, 'links', id)); } catch (err) { toast(errText(err), true); } } }
  else if (a === 'rensec') { if (S.teacher) secDlg(+t.dataset.s); }
  else if (a === 'addsec') { if (S.teacher) secDlg(-1); }
  else if (a === 'delsec') { if (S.teacher) delSec(+t.dataset.s); }
  else if (a === 'big') { const p = S.live.find((x) => x.id === id); if (p && p.img) openDlg('<div class="tp" style="display:flex;justify-content:flex-end;margin-bottom:8px"><h2 id="dlgt" class="sr">사진 크게 보기</h2><button type="button" class="btn sm" data-act="close">닫기 ✕</button></div><img src="' + p.img + '" alt="' + esc(p.title || '사진') + '">', 'big', '[data-act=close]'); }
});
$('writeBtn').addEventListener('click', () => { if (canWrite()) writeDlg(0, null, newAt()); });
$('fab').addEventListener('click', () => { if (canWrite()) writeDlg(0, null, newAt()); });
$('fmtBtn').addEventListener('click', () => { if (S.teacher) fmtDlg(); });
$('lockBtn').addEventListener('click', async () => {
  if (!S.teacher || !S.board) return;
  try { await updateDoc(doc(fs, 'boards', bid), { lock: !S.board.lock }); toast(S.board.lock ? '학생 글쓰기를 열었어요.' : '학생 글쓰기를 잠갔어요. 읽기만 할 수 있어요.'); } catch (err) { toast(errText(err), true); }
});
$('picIn').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !$('att')) return;
  if (!/^image\//.test(f.type)) { $('wm').textContent = '사진만 고를 수 있어요. 다른 파일은 📎로 올려요.'; return; }
  $('wm').textContent = ''; drawAtt(true);
  try {
    const d = await shrink(f);
    if (!d) throw new Error('big');
    S.pic = d; drawAtt();
  } catch (err) { S.pic = ''; drawAtt(); $('wm').textContent = '이 사진은 올릴 수 없어요.'; }
});
$('fileIn').addEventListener('change', (e) => {
  const list = [...(e.target.files || [])]; e.target.value = ''; if (!$('att')) return;
  const bad = [];
  for (const f of list) {
    if (S.keepFiles.length + S.newFiles.length >= MAX_FILES) { bad.push('파일은 ' + MAX_FILES + '개까지예요.'); break; }
    const m = checkFile(f);
    if (m) bad.push(m); else S.newFiles.push(f);
  }
  $('wm').textContent = bad.join(' ');
  drawAtt();
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (e.target.id === 'wf') sendPost();
  else if (e.target.id === 'cpf') copyPostGo();
  else if (e.target.id === 'zf') {
    const v = cleanTxt($('zn').value, 30); if (!v) { $('zn').focus(); return; }
    try { await saveZones(zonesOf().map((x) => x.id === S.zEdit ? Object.assign({}, x, { n: v }) : x)); closeDlg(); draw(); } catch (err) { $('zm').textContent = errText(err); }
  }
  else if (e.target.id === 'ff') {
    if (PREVIEW || !S.teacher) return;
    try { await updateDoc(doc(fs, 'boards', bid), { layout: S.fmt, groups: !!($('grp') && $('grp').checked) }); S.linkFrom = null; closeDlg(); toast('형식을 \'' + FORMATS.find((f) => f[0] === S.fmt)[1] + '\'(으)로 바꿨어요.'); }
    catch (err) { $('fm').textContent = errText(err); }
  } else if (e.target.id === 'sf') {
    const v = cleanTxt($('sn').value, 40); if (!v) { $('sn').focus(); return; }
    const secs = secsOf().slice(); if (S.secEdit < 0) secs.push(v); else secs[S.secEdit] = v;
    try { await updateDoc(doc(fs, 'boards', bid), { sections: secs }); closeDlg(); toast('저장했어요.'); } catch (err) { $('sm').textContent = errText(err); }
  } else if (e.target.dataset.cform) sendComment(e.target.dataset.cform, e.target.querySelector('input'));
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('dlg').innerHTML) closeDlg();
  else if (S.linkFrom) { S.linkFrom = null; draw(); }
  else closePals();
});
installPadkit({
  bid: () => bid,
  react,
  toast,
  // 댓글 칸에서 고른 모아팡 이모티콘은 바로 댓글로 보냄 (글쓰기 창에서는 글 안에 넣음)
  sticker: (key, i) => {
    if (!key.startsWith('c:')) return false;
    const pid = key.slice(2), inp = document.querySelector('[data-cin="' + CSS.escape(pid) + '"]');
    if (!inp || inp.disabled || !canWrite()) return false;
    sendComment(pid, inp, i); return true;
  },
  unfile: (fid) => { S.keepFiles = S.keepFiles.filter((f) => f.id !== fid); drawAtt(); }
});

/* ---------- 불러오기 (실시간) ---------- */
(async () => {
  if (!bid) return fail('주소가 잘못되었어요.');
  try {
    S.user = await ensureUser(); S.teacher = !PREVIEW && isTeacher(S.user); // 미리보기: 학생처럼
    const first = await getDoc(doc(fs, 'boards', bid));
    if (!first.exists()) return fail('지워진 모아보드예요.');
    S.board = first.data();
    if (PREVIEW && (!S.board.public || S.board.trash)) return fail('아직 선생님이 학생에게 보여 주지 않은 모아보드예요. (미리보기: 내 모아보드에서 \'학생에게 보이기\'를 켜면 학생에게 보여요)');
    // 선생님 모드는 이 패들렛의 주인 선생님만 (함께 쓰는 선생님 패들렛은 owner, 주 선생님 패들렛은 owner 없음)
    if (S.teacher) { const r = await teacherRole(S.user); S.teacher = S.board.owner ? S.board.owner === S.user.uid : r === 'admin'; }
    draw();
    classLink();
    onSnapshot(doc(fs, 'boards', bid), (s) => { if (s.exists()) { S.board = s.data(); draw(); } else fail('지워진 모아보드예요.'); }, () => {});
    const pq = S.teacher ? query(collection(fs, 'parts'), where('bid', '==', bid), ...(S.board.owner ? [where('owner', '==', S.board.owner)] : [])) : query(collection(fs, 'parts'), where('bid', '==', bid), where('pub', '==', true));
    onSnapshot(pq, (snap) => { S.parts = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); draw(); }, () => {});
    const rows = (snap) => snap.docs.map((d) => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
    onSnapshot(collection(fs, 'boards', bid, 'posts'), (snap) => { S.live = rows(snap); S.liveErr = false; draw(); }, () => { S.liveErr = true; draw(); });
    onSnapshot(collection(fs, 'boards', bid, 'comments'), (snap) => { S.cmts = rows(snap); draw(); }, () => {});
    onSnapshot(collection(fs, 'boards', bid, 'reacts'), (snap) => { S.reacts = rows(snap); draw(); }, () => {});
    onSnapshot(collection(fs, 'boards', bid, 'pos'), (snap) => { const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); }); S.pos = m; draw(); }, () => {});
    onSnapshot(collection(fs, 'boards', bid, 'links'), (snap) => { S.links = rows(snap); draw(); }, () => {});
  } catch (err) { fail(/permission/i.test(err.code || '') ? '아직 선생님이 학생에게 보여 주지 않은 모아보드예요.' : errText(err)); }
})();
</script>
