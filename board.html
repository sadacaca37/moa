<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 보드 · 모아팡</title>
<link rel="icon" href="assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/moa.css">
<style>
/* VOICE: 선생님이 정리한 수업 보드를 학생이 읽는 화면 — 패들렛처럼 칸이 가로로 늘어선다 */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px clamp(12px,3vw,24px)}
.head h1{font-size:28px;color:#fff;text-shadow:3px 3px 0 var(--ink)}
.head small{display:block;color:#fff;font-weight:700;text-shadow:2px 2px 0 var(--ink)}
.cols{overflow-x:auto;padding:8px clamp(12px,3vw,24px) 90px}
.cols>div{display:flex;gap:16px;align-items:flex-start;width:max-content}
.sec{width:300px;flex:none;display:flex;flex-direction:column;gap:12px}
.sech{margin:0;padding:10px 14px;font:400 20px/1.3 'Jua',sans-serif;display:flex;justify-content:space-between;gap:8px}
.post{background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column}
.pin{padding:10px 12px 10px;display:flex;flex-direction:column;gap:6px}
.pin h3{margin:0;font:700 16px/1.4 'Noto Sans KR',sans-serif;overflow-wrap:anywhere}
.pin p{margin:0;font-size:14px;line-height:1.6;color:#333A55;white-space:pre-line;overflow-wrap:anywhere}
.lnk{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;background:#EAF3FF;border:3px solid var(--ink);text-decoration:none;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.by{font-size:12px;color:var(--sub);padding:0 12px 10px;font-weight:700}
@media (max-width:600px){.sec{width:82vw}}
</style>
</head>
<body>
<div class="head">
  <a class="logo" href="./" aria-label="모아팡 첫 화면"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i></a>
  <button class="btn sm" type="button" id="back">◀ 돌아가기</button>
  <div><small id="sub">수업 보드</small><h1 id="title">불러오는 중…</h1></div>
</div>
<div class="cols" id="cols"></div>
<div class="ground" aria-hidden="true"></div>
<script type="module">
import { fs, ensureUser, isTeacher, doc, getDoc, collection, query, where, getDocs, esc, safeUrl, hostOf, errText, getSession } from './js/fb.js';
const $ = (id) => document.getElementById(id);
const SEC = ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#C7B2FF', '#FFB86B'];
$('back').addEventListener('click', () => { if (history.length > 1 && document.referrer) history.back(); else location.href = getSession() ? 'class.html' : './'; });
const bid = new URLSearchParams(location.search).get('b');
function fail(m) { $('title').textContent = '보드를 열 수 없어요'; $('cols').innerHTML = '<p class="empty pf" style="max-width:520px">' + esc(m) + '</p>'; }
(async () => {
  if (!bid) return fail('주소가 잘못되었어요.');
  try {
    const u = await ensureUser();
    const bs = await getDoc(doc(fs, 'boards', bid));
    if (!bs.exists()) return fail('지워진 보드예요.');
    const b = bs.data();
    $('title').textContent = b.title || '수업 보드'; document.title = (b.title || '수업 보드') + ' · 모아팡';
    $('sub').textContent = (b.date || '') + ' · 글 ' + (b.postCount || 0) + '개';
    const q = isTeacher(u) ? query(collection(fs, 'parts'), where('bid', '==', bid)) : query(collection(fs, 'parts'), where('bid', '==', bid), where('pub', '==', true));
    const ps = (await getDocs(q)).docs.map((d) => d.data()).sort((a, c) => a.n - c.n);
    const posts = []; ps.forEach((p) => (p.posts || []).forEach((x) => posts.push(x)));
    $('cols').innerHTML = '<div>' + (b.sections || ['글 모음']).map((name, i) => {
      const list = posts.filter((p) => (p.sec || 0) === i);
      return '<section class="sec"><h2 class="sech pf" style="background:' + SEC[i % SEC.length] + '"><span>' + esc(name) + '</span><span>' + list.length + '</span></h2>' + list.map((p) => {
        const link = safeUrl(p.link), video = /youtube\.com|youtu\.be/i.test(link);
        return '<article class="post"><div class="pin">' + (p.title ? '<h3>' + esc(p.title) + '</h3>' : '') + (p.body ? '<p>' + esc(p.body) + '</p>' : '') +
          (link ? '<a class="lnk" href="' + esc(link) + '" target="_blank" rel="noopener">' + (video ? '▶ 영상 · ' : '🔗 ') + esc(hostOf(link) || link) + '</a>' : '') + '</div>' +
          (p.author ? '<div class="by">' + esc(p.author) + '</div>' : '') + '</article>';
      }).join('') + '</section>';
    }).join('') + '</div>';
  } catch (err) { fail(/permission/i.test(err.code || '') ? '아직 선생님이 학생에게 보여 주지 않은 보드예요.' : errText(err)); }
})();
</script>
</body>
</html>
