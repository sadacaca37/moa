<script type="module">
import {
  auth, fs, rt, whenAuth, isTeacher, teacherLogin, logout, resetPassword, SITE,
  teacherRole, teacherSignup, resendVerify, refreshUser, bankId, emKey,
  doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, onSnapshot, increment, writeBatch,
  ref, set, update, remove, push, onValue, rquery, limitToLast, rnow, rget, MAPS, mapName, esc, safeUrl, hostOf, errText, toast, TEACHER_EM_KEY, endPreview, previewUrl, onLiveState
} from './js/fb.js';
import { emoHTML, emoRich, emoOnly, emoTok, openEmoPicker } from './js/emo.js';
import { DEF_OX, DEF_MC, defWhy } from './js/questions.js';
import { readXlsx, readCSV, makeXlsx, downloadBlob } from './js/xlsx.js';
import { aiQuiz, aiReason, AGES, CATS } from './js/ai.js';
import { trashBoard, inTrash, TRASH_DAYS, trashClass, purgeExpiredClasses } from './js/trash.js';
import { duplicateClass } from './js/padcopy.js';
import { classSections, sectionsHTML, grpField, grpNames, cleanGrp, toggleFold } from './js/groups.js';
const $ = (id) => document.getElementById(id);
const A = window.MoaAvatar;
endPreview(); // 학생 화면 미리보기에서 돌아오면 미리보기를 끔
const COLORS = ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#9DB8FF', '#FFB86B', '#C7B2FF'];
const LCOL = ['#7FE0E8', '#9BE07A', '#FF8F8F', '#9DB8FF', '#FFD23F', '#D7B5FF'];
const GAMES = [['dodge', '똥 피하기', 1], ['tag', '술래잡기', 0], ['treasure', '보물찾기', 1], ['race', '달리기 경주', 0], ['paint', '땅따먹기', 1], ['chat', '채팅 게임', 1], ['bingo', '빙고', 0], ['zombie', '좀비 탈출', 1], ['bomb', '폭탄 돌리기', 1], ['ox', 'OX 퀴즈', 1]];
const LIVE_G = ['dodge', 'tag', 'race', 'paint', 'zombie', 'bomb', 'ox']; // 반 친구들이 한 게임에서 같이 (선생님 게임 화면이 진행)
const gameUrl = (cid, g) => LIVE_G.includes(g.id) ? 'games.html?host=' + encodeURIComponent(cid) + '&g=' + encodeURIComponent(g.id) + '&run=' + encodeURIComponent(g.run) : 'games.html?g=' + encodeURIComponent(g.id) + '&run=' + encodeURIComponent(g.run) + '&teach=' + encodeURIComponent(cid);
const MAX = 20;
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let user = null, classes = [], tclasses = [], purgedCls = false, counts = {}, countOffs = {}, liveOffs = [], home = {}, view = '';
// role: 'admin' = 주 선생님(모든 것), 'teacher' = 함께 쓰는 선생님(자기 반만)
let role = '';
const isAdmin = () => role === 'admin';
// 첫 화면 링크 게시판: 주 선생님은 config/home (moapang.kr), 함께 쓰는 선생님은 config/home_{uid} (moapang.kr/?t=uid)
const homeRef = () => doc(fs, 'config', isAdmin() ? 'home' : 'home_' + user.uid);
const homeUrl = () => isAdmin() ? SITE : SITE + '?t=' + user.uid;

/* ---------- 창 ---------- */
let lastFocus = null;
function openDlg(html, focusSel) {
  lastFocus = document.activeElement;
  $('dlg').innerHTML = '<div class="modal" data-close><div class="pf pad stack" role="dialog" aria-modal="true" aria-labelledby="dlgT">' + html + '</div></div>';
  const f = $('dlg').querySelector(focusSel || 'input,select,textarea,button'); if (f) f.focus();
}
function closeDlg() { $('dlg').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$('dlg').addEventListener('click', (e) => { if (e.target.matches('[data-close]') || e.target.closest('[data-x]')) closeDlg(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('dlg').innerHTML) closeDlg(); });
const dlgTop = (t) => '<div class="row" style="justify-content:space-between"><h2 id="dlgT">' + esc(t) + '</h2><button type="button" class="btn sm" data-x>닫기 ✕</button></div>';
function confirmDlg(title, text, ok, fn) {
  openDlg(dlgTop(title) + '<p class="note" style="color:var(--ink)">' + esc(text) + '</p><div class="row"><button type="button" class="btn red" id="okBtn">' + esc(ok) + '</button><button type="button" class="btn" data-x>그만두기</button></div>', '[data-x]');
  $('okBtn').addEventListener('click', () => { closeDlg(); fn(); });
}

/* ---------- 로그인 ---------- */
// 이메일은 이 컴퓨터에서 한 번 로그인한 뒤에만 미리 채워진다 (다른 컴퓨터·학생 화면에는 안 보임)
function savedEm() { try { return localStorage.getItem(TEACHER_EM_KEY) || ''; } catch (e) { return ''; } }
function drawLogin(msg) {
  $('menu').hidden = true;
  $('view').innerHTML = '<form class="pf pad stack login" id="loginF"><h1 style="font-size:28px">선생님 로그인</h1>' +
    '<label class="lb">이메일<input class="field" id="em" type="email" autocomplete="username" value="' + esc(savedEm()) + '"></label>' +
    '<label class="lb">비밀번호<input class="field" id="pw" type="password" autocomplete="current-password"></label>' +
    '<label class="pwshow"><input type="checkbox" id="pwEye"> 비밀번호 보이기</label>' +
    '<p class="note" id="lmsg" role="alert" style="color:#B3261E;font-weight:700">' + esc(msg || '') + '</p>' +
    '<button class="btn blue big" type="submit">로그인 ▶</button><button class="btn sm" type="button" id="forgot">비밀번호를 잊었어요</button><p class="note">선생님 계정으로 들어오면 반 만들기, 수업 진행판, 첫 화면 링크를 고칠 수 있어요.</p>' +
    '<button class="btn sm" type="button" id="toSignup">처음이에요 · 함께 쓰는 선생님 가입</button></form>';
  $(savedEm() ? 'pw' : 'em').focus();
  $('pwEye').addEventListener('change', (e) => { $('pw').type = e.target.checked ? 'text' : 'password'; $('pw').focus(); });
  $('toSignup').addEventListener('click', drawSignup);
  $('forgot').addEventListener('click', async () => {
    const em = $('em').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $('lmsg').textContent = '선생님 이메일을 먼저 써 주세요.'; return; }
    $('forgot').disabled = true;
    try { await resetPassword(em); $('lmsg').style.color = 'var(--ink)'; $('lmsg').textContent = em + ' 메일함에 \'비밀번호 다시 만들기\' 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정한 뒤 여기서 로그인해 주세요. (안 보이면 스팸함도 봐 주세요)'; }
    catch (err) { $('lmsg').textContent = errText(err); $('forgot').disabled = false; }
  });
  $('loginF').addEventListener('submit', async (e) => {
    e.preventDefault(); $('lmsg').textContent = '';

// 주소 글자가 주소창 한 줄에 다 들어가게 크기 맞추기
function fitBar() {
  const bar = document.querySelector('.bi-bar'); if (!bar) return;
  const sp = bar.querySelector('span'), ic = bar.querySelector('i');
  bar.style.fontSize = '';
  const cs = getComputedStyle(bar), size = parseFloat(cs.fontSize);
  const room = bar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (ic ? ic.offsetWidth + size * 0.35 : 0) - 4;
  if (sp.scrollWidth > room) bar.style.fontSize = Math.max(16, Math.floor(size * room / sp.scrollWidth)) + 'px';
}
addEventListener('resize', fitBar);
document.addEventListener('fullscreenchange', () => setTimeout(fitBar, 100));
if (document.fonts) document.fonts.ready.then(fitBar);

/* ---------- 링크 고치기 (반 링크 · 첫 화면 링크 같이 씀) ---------- */
function linksHTML(list, id) { return listHTML(list, id) + formHTML(id); }
function listHTML(list, id) {
  return '<ul class="list links" id="' + id + '">' + (list.length ? list.map((l, i) => '<li style="' + (l.hide ? 'opacity:.55' : '') + '"><span class="tag" style="background:' + esc(l.c || LCOL[i % LCOL.length]) + '">' + esc(l.bid ? '수업 보드' : (l.site || hostOf(l.u) || '링크')) + '</span><span class="tx"><b>' + esc(l.t || '') + '</b><small>' + esc(l.bid ? '보드 · ' + (l.d || '') : (l.u || '')) + '</small></span>' +
    '<button class="btn sm" type="button" data-up="' + i + '" aria-label="위로">↑</button><button class="btn sm" type="button" data-down="' + i + '" aria-label="아래로">↓</button><button class="btn sm" type="button" data-hide="' + i + '">' + (l.hide ? '보이기' : '숨기기') + '</button><button class="btn sm red" type="button" data-del="' + i + '">지우기</button></li>').join('') : '<li>아직 링크가 없어요.</li>') + '</ul>';
}
function formHTML(id) {
  return '<form class="lform" data-addfor="' + id + '"><label class="lb">제목<input class="field" name="t" maxlength="40" placeholder="예: 책 소개 카드 만들기"></label><label class="lb">사이트 이름 (없어도 돼요)<input class="field" name="site" maxlength="14" placeholder="예: Canva"></label>' +
    '<label class="lb wide">주소<input class="field" name="u" type="url" placeholder="https://"></label><label class="lb wide">짧은 설명 (없어도 돼요)<input class="field" name="d" maxlength="60"></label><div class="wide"><button class="btn blue" type="submit">링크 올리기 ▶</button></div></form>';
}
function bindLinks(id, getList, saveList) { bindList(id, getList, saveList); bindForm(id, getList, saveList); }
function refreshList(id, list, getList, saveList) { const ul = $(id); if (!ul) return; const t = document.createElement('div'); t.innerHTML = listHTML(list, id); ul.replaceWith(t.firstChild); bindList(id, getList, saveList); }
function bindList(id, getList, saveList) {
  const box = $(id); if (!box) return;
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const list = getList().slice(); let i;
    if ((i = b.dataset.up) !== undefined) { i = +i; if (i < 1) return; [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
    else if ((i = b.dataset.down) !== undefined) { i = +i; if (i >= list.length - 1) return; [list[i + 1], list[i]] = [list[i], list[i + 1]]; }
    else if ((i = b.dataset.hide) !== undefined) { list[+i] = Object.assign({}, list[+i], { hide: !list[+i].hide }); }
    else if ((i = b.dataset.del) !== undefined) { list.splice(+i, 1); }
    else return;
    try { await saveList(list); } catch (err) { toast(errText(err), true); }
  });
}
function bindForm(id, getList, saveList) {
  document.querySelector('[data-addfor="' + id + '"]').addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target, u = safeUrl(f.u.value), t = f.t.value.trim();
    if (!u) { f.u.focus(); toast('주소는 https:// 로 시작해야 해요.', true); return; }
    const list = getList().concat([{ t: t || hostOf(u), u, d: f.d.value.trim(), site: f.site.value.trim(), c: LCOL[getList().length % LCOL.length] }]);
    try { await saveList(list); f.reset(); toast('링크를 올렸어요.'); } catch (err) { toast(errText(err), true); }
  });
}

async function announceRank() {
  const run = L.st.qrun; if (!run) return;
  const base = 'live/' + L.cid;
  try {
    const qs = (await rget(ref(rt, base + '/qruns/' + run.id))).val() || {};
    const sc = {};
    for (const [qid, qt] of Object.entries(qs)) {
      const [ks, as] = await Promise.all([rget(ref(rt, base + '/key/' + qid)), rget(ref(rt, base + '/answers/' + qid))]);
      const key = ks.val(); if (!key) continue;
      for (const [u, v] of Object.entries(as.val() || {})) {
        if (!v) continue;
        if (key.end && (+v.t || 0) > key.end + 1500) continue; // 시간이 끝난 뒤 낸 답은 세지 않음
        const o = sc[u] || (sc[u] = { n: String(v.n || '?').slice(0, 10), k: v.k || '', s: 0, tm: 0 });
        if (String(v.a) === String(key.a)) { o.s++; o.tm += Math.max(0, (+v.t || 0) - (+qt || 0)); }
      }
    }
    const list = Object.values(sc).sort((a, b) => b.s - a.s || a.tm - b.tm || a.n.localeCompare(b.n));
    // t는 서버 시각 기준 (학생 컴퓨터 시계가 틀려도 순위 창이 뜨게)
    // 학생 화면에는 이번 퀴즈 1~3등만 (퀴즈마다 새로 매김). 모두의 맞힌 수는 선생님 진행판에서만 봄
    const rk = { id: run.id, name: run.name || '', total: Object.keys(qs).length, top: list.slice(0, 3).map((o) => ({ n: o.n, k: o.k, s: o.s })), n: list.length, t: rnow() };
    L.rankFull = { id: run.id, list: list.map((o) => ({ n: o.n, s: o.s })) };
    await setSt({ quiz: null, qrun: null, qrank: rk });
    remove(ref(rt, base + '/qruns/' + run.id)).catch(() => {});
    // 퀴즈가 끝나면 그걸로 끝: 이 판의 답·정답 기록을 지우고, 발표 창은 20초 뒤 저절로 내림
    for (const qid of Object.keys(qs)) { remove(ref(rt, base + '/answers/' + qid)).catch(() => {}); remove(ref(rt, base + '/key/' + qid)).catch(() => {}); }
    const cidNow = L.cid; setTimeout(() => { if (L && L.cid === cidNow && L.st.qrank && L.st.qrank.id === rk.id) setSt({ qrank: null }); }, 20000);
    toast('🏆 순위를 발표했어요! 학생 화면에 1~3등이 20초 동안 떠요. 모두의 기록은 여기 진행판에서만 보여요.');
  } catch (err) { toast(errText(err), true); }
}

// 정답·해설 공개 (학생 화면·교실 스크린에 보임)
function quizReveal() {
  const q = L && L.st.quiz; if (!q) return Promise.resolve();

  if (key && (q.ans === undefined || q.ans === null)) return setSt({ 'quiz/ans': key.a, 'quiz/why': key.why || '' });
  if (!key) return rget(ref(rt, 'live/' + L.cid + '/key/' + q.qid)).then((s) => { L.key[q.qid] = s.val(); if (s.val() && L.st.quiz && L.st.quiz.qid === q.qid) return quizReveal(); }).catch(() => {});
  return Promise.resolve();
}
// 0.25초마다: 남은 시간 보이기 → 시간이 끝나면 정답 공개 → (자동이면) 몇 초 뒤 다음 문제·순위 발표
function quizTick() {
  const q = L && L.st && L.st.quiz, el = $('qzClock');
  if (!q || !q.qid) return;
  const rev = q.ans !== undefined && q.ans !== null;
  if (!rev) {
    if (q.end) {
      const left = Math.max(0, Math.ceil((q.end - (Date.now() + tOff)) / 1000));
      if (el) { el.textContent = left > 0 ? '⏱ ' + left + '초' : '⏰ 시간 끝!'; el.className = 'qclock' + (left <= 5 ? ' low' : ''); }
      if (left <= 0 && L.timeRev !== q.qid) { L.timeRev = q.qid; quizReveal(); }
    } else if (el) el.textContent = '';
    return;
  }
  if (!q.auto) { if (el) { el.textContent = '✅ 정답 공개'; el.className = 'qclock go'; } return; }
  const set = classSets(L.cid).find((x) => x.k === q.k && (!q.sid || x.sid === q.sid)), hasNext = set && q.total && q.n + 1 < set.list.length;
  if (!L.adv || L.adv.qid !== q.qid) L.adv = { qid: q.qid, at: Date.now() + REV_MS(q) };
  const left = Math.max(0, Math.ceil((L.adv.at - Date.now()) / 1000));
  if (el) { el.textContent = '✅ ' + left + '초 뒤 ' + (hasNext ? '다음 문제' : '순위 발표'); el.className = 'qclock go'; }
  if (Date.now() >= L.adv.at && !L.adv.done) {
    L.adv.done = true;
    if (hasNext) sendSetQ(set, q.n + 1); else if (L.st.qrun) announceRank(); else setSt({ quiz: null });
  }
}

function drawTeam() {
  if (!teamOff) teamOff = onSnapshot(collection(fs, 'teachers'), (s) => { team = s.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.at || 0) - (b.at || 0)); if (view === 'team') drawTeam(); }, (err) => toast(errText(err), true));
  $('view').innerHTML = '<div class="stack"><h1 class="ttl">선생님 관리</h1>' +
    '<div class="pf card"><h2>함께 쓰는 선생님 · ' + team.length + '명</h2>' +
    '<p class="note">여기에 이메일을 올리면, 그 선생님이 선생님 로그인 화면의 \'처음이에요 · 함께 쓰는 선생님 가입\'으로 직접 가입하고 메일 인증을 해요. 그 뒤로는 <b>자기가 만든 반과 그 반 학생·모아보드·문제만</b> 보여요. 서로의 반은 보이지 않아요.</p>' +
    '<ul class="list" id="tmL">' + (team.length ? team.map((t) => '<li><b class="sp">' + esc(t.name || '') + '</b><span>' + esc(t.email || t.id) + '</span><button class="btn sm red" type="button" data-tdel="' + esc(t.id) + '">빼기</button></li>').join('') : '<li>아직 없어요.</li>') + '</ul>' +
    '<form class="lform" id="tmF"><label class="lb">선생님 이름<input class="field" name="n" maxlength="20" placeholder="예: 박선생님"></label><label class="lb">이메일<input class="field" name="e" type="email" placeholder="가입할 때 쓸 이메일"></label><div class="wide"><button class="btn blue" type="submit">올리기 ▶</button></div></form></div>' +
    '<div class="pf card" id="useC"><h2>📊 선생님별 사용 현황</h2><p class="note">선생님마다 교실·모아보드·학생·퀴즈 세트 수와 지금 접속한 학생 수, 마지막 접속을 보여요. 주 선생님만 볼 수 있어요.</p><div class="row"><button class="btn blue" type="button" id="useGo">📊 사용 현황 보기</button></div><div id="useT"></div></div>' +
    '<p class="note pf pad" style="color:var(--ink)">무료 요금제라서 실시간 교실(가상 교실·진행판) 동시 접속 100명을 모든 선생님이 함께 써요. 두 선생님이 같은 시간에 수업하면 합쳐서 100명까지예요. 첫 화면은 선생님마다 따로예요. 함께 쓰는 선생님은 자기 첫 화면 주소(moapang.kr/?t=…)를 학생에게 알려 주면 되고, 그 선생님 반 QR로 들어온 학생도 그 선생님 첫 화면을 봐요.</p></div>';
  $('useGo').addEventListener('click', loadUsage);
  if (usageHTML) $('useT').innerHTML = usageHTML;
  $('tmF').addEventListener('submit', async (e) => {
    e.preventDefault();
    const em = e.target.e.value.trim().toLowerCase(), n = e.target.n.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { e.target.e.focus(); toast('이메일을 바르게 써 주세요.', true); return; }
    if (em === String(user.email || '').toLowerCase()) { toast('내 계정은 올리지 않아도 돼요.', true); return; }
    try { await setDoc(doc(fs, 'teachers', em), { email: em, name: n, at: Date.now() }); await set(ref(rt, 'teachers/' + emKey(em)), true); toast(em + ' 선생님을 올렸어요. 이제 가입할 수 있어요.'); }
    catch (err) { toast(errText(err), true); }
  });
  $('tmL').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tdel]'); if (!b) return;
    const em = b.dataset.tdel;
    confirmDlg('선생님 빼기', em + ' 선생님이 더는 선생님 화면에 들어오지 못해요. 그 선생님이 만든 반과 기록은 지우지 않고 남겨 둬요.', '빼기', async () => {
      try { await deleteDoc(doc(fs, 'teachers', em)); await remove(ref(rt, 'teachers/' + emKey(em))); toast('뺐어요.'); } catch (err) { toast(errText(err), true); }
    });
  });
}
addEventListener('hashchange', route);
document.addEventListener('click', (e) => {
  const q = e.target.closest('[data-qr]'); if (q) { const c = classes.find((x) => x.id === q.dataset.qr); if (c) qrDlg(c); return; }
  const ed = e.target.closest('[data-edit]'); if (ed) { const c = classes.find((x) => x.id === ed.dataset.edit); if (c) classDlg(c); return; }
  const gp = e.target.closest('[data-grp]'); if (gp) { const c = classes.find((x) => x.id === gp.dataset.grp); if (c) grpDlg(c); return; }
  // ⋮ 메뉴 → 🗑 이 교실 버리기 (한 번 더 묻고 지움)
  const cd = e.target.closest('[data-cdel]'); if (cd) { const c = classes.find((x) => x.id === cd.dataset.cdel); if (c) confirmDlg('교실 버리기', TRASH_NOTE(c), '🗑 휴지통으로', () => deleteClass(c)); return; }
  const cu = e.target.closest('[data-cdup]'); if (cu) { const c = classes.find((x) => x.id === cu.dataset.cdup); if (c) dupDlg(c); return; }
  if (e.target.closest('#newC,#newC2')) { if (classes.length < MAX) classDlg(null).catch((err) => toast(errText(err), true)); }
});

let started = false;
function start(u) {
  if (started) return; started = true; user = u;
  const next = new URLSearchParams(location.search).get('next');
  if (next && /^[a-z]+\.html$/.test(next)) { location.href = next; return; }
  $('menu').hidden = false;
  $('navTeam').hidden = !isAdmin();
  $('navSms').hidden = !isAdmin(); // 타자팡 회원·부모님 번호는 주 선생님만
  // 사용 현황(주 선생님만 봄)에 이름을 붙일 수 있게: 함께 쓰는 선생님은 자기 자리표에 이메일·마지막 접속을 적음
  if (!isAdmin()) setDoc(doc(fs, 'config', 'sess_' + u.uid), { em: String(u.email || '').toLowerCase(), seen: Date.now() }, { merge: true }).catch(() => {});
  // 주 선생님: owner 없는 반(예전 반들) · 함께 쓰는 선생님: 자기 반만
  const cq = isAdmin() ? collection(fs, 'classes') : query(collection(fs, 'classes'), where('owner', '==', u.uid));
  onSnapshot(cq, (s) => {
    const all = s.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((c) => isAdmin() ? !c.owner : c.owner === u.uid).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
    classes = all.filter((c) => !inTrash(c)); tclasses = all.filter(inTrash); // 휴지통에 있는 교실은 목록에서 뺌
    if (!purgedCls && tclasses.length) { purgedCls = true; purgeExpiredClasses(tclasses, { own: isAdmin() ? [] : [where('owner', '==', u.uid)] }).catch(() => {}); }
    watchCounts();
    if (view === 'classes') drawClasses();
    else if (view === 'quiz') drawQuizLib();
    else if (view === 'live' && L) { const c = classes.find((x) => x.id === L.cid); if (!c) route(); else refreshList('clsL', c.links || [], () => (classes.find((x) => x.id === c.id) || {}).links || [], (list) => setDoc(doc(fs, 'classes', c.id), { links: list }, { merge: true }));  paintQuiz(); paintPads(); }
    else if (!view) route();
  }, (err) => { $('view').innerHTML = '<p class="pf pad">' + esc(errText(err)) + '</p>'; });
  onSnapshot(doc(fs, 'banks', bankId(myOwner(), 'lib')), (s) => { LIB.sets = s.exists() ? s.data().sets || [] : []; LIB.ok = true; if (view === 'quiz') drawQuizLib(); }, () => { LIB.ok = true; });
  onSnapshot(homeRef(), (s) => {
    home = s.exists() ? s.data() : {};
    if (view === 'home') { if ($('homeL')) refreshList('homeL', home.links || [], () => home.links || [], (list) => setDoc(homeRef(), { links: list }, { merge: true })); else drawHome(); }
  }, () => {});
}
(async () => {
  const u = await whenAuth();
  const kicked = new URLSearchParams(location.search).get('out') === 'other';
  if (kicked) history.replaceState(null, '', location.pathname);
  if (isTeacher(u)) afterLogin(u); else drawLogin(kicked ? '다른 컴퓨터에서 이 계정으로 로그인해서, 이 컴퓨터는 로그아웃했어요. 여기서 쓰려면 다시 로그인해 주세요.' : u && !u.isAnonymous ? '선생님 계정이 아니에요.' : '');
})();
</script>
