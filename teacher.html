<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선생님 화면 · 모아팡팡</title>
<link rel="icon" href="assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/moa.css">
<style>
/* VOICE: 선생님 혼자 보는 조종석 — 수업 중에 한 번에 누를 수 있게 큰 버튼, 지금 상태가 한눈에
   LAYOUT: 위 메뉴, [우리 반 | 진행판 | 첫 화면] */
.menu{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.ccard{display:flex;flex-direction:column;background:#fff}
.ccard .band{height:54px;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.ccard .band b{font:400 16px/1 'Jua',sans-serif;background:#fff;border:3px solid var(--ink);padding:4px 8px}
.ccard .bd{padding:12px;display:flex;flex-direction:column;gap:8px}
.ccard h3{font-size:22px;overflow-wrap:anywhere}
.ccard .meta{font-size:14px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px}
.ccard .meta b{color:var(--ink)}
.on{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.on i{width:10px;height:10px;background:#2fbf5b;border:2px solid var(--ink)}
.add{min-height:200px;border:4px dashed var(--ink);background:rgba(255,255,255,.8);font:400 20px 'Jua',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.add:disabled{opacity:.6;cursor:not-allowed}
.live{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.card{padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:700 13px/1 'Noto Sans KR',sans-serif;border:3px solid var(--ink);padding:5px 8px;background:#fff}
.badge.go{background:var(--grn)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.list li{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:2px solid var(--ink);font-size:15px;flex-wrap:wrap}
.list li .sp{flex:1}
.list li canvas{width:40px;height:40px;image-rendering:pixelated;background:var(--paper2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:2px solid var(--ink);background:#fff;padding:2px 8px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:15px}
.bars i{display:block;height:20px;background:var(--blue);border:2px solid var(--ink);min-width:2px}
.bars .ok i{background:#2fbf5b}
#chatLog{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px;background:#fff;border:2px solid var(--ink);padding:8px}
#chatLog p{margin:0;overflow-wrap:anywhere}
.links li{align-items:flex-start}
.links .tx{flex:1;min-width:160px;display:flex;flex-direction:column}
.links .tx small{color:var(--sub);overflow-wrap:anywhere}
.lform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lform .wide{grid-column:1/-1}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr svg{width:min(320px,70vw);height:auto;background:#fff;border:4px solid var(--ink)}
.qr .code{font:700 44px/1 'Noto Sans KR',monospace;letter-spacing:.3em;background:var(--ink);color:var(--grn);padding:10px 14px 10px calc(14px + .3em)}
.qr a{overflow-wrap:anywhere;font-weight:700}
.login{max-width:440px;margin:30px auto}
.mapsel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mapsel select{flex:1;min-width:160px}
details summary{cursor:pointer;font:400 17px 'Jua',sans-serif}
@media (max-width:980px){.live{grid-template-columns:minmax(0,1fr)}}
@media print{body{background:#fff}.top,.ground,#view,#toasts{display:none!important}.modal{position:static;background:none;padding:0}.modal .pf{box-shadow:none;border:0}.modal .row{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./" aria-label="모아팡팡 첫 화면"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i><span>모아팡팡</span></a>
  <nav class="menu" id="menu" hidden>
    <a class="btn sm" href="#classes" data-nav="classes">우리 반</a>
    <a class="btn sm" href="#home" data-nav="home">첫 화면 꾸미기</a>
    <a class="btn sm" href="padlet.html">내 패들렛</a>
    <a class="btn sm" href="games.html">미니 게임·문제 만들기</a>
    <a class="btn sm" href="./">첫 화면 보기</a>
    <button class="btn sm" type="button" id="logout">로그아웃</button>
  </nav>
</header>
<main class="wrap" id="view"><p class="pf pad">불러오는 중…</p></main>
<div id="dlg"></div>
<div class="ground" aria-hidden="true"></div>

<script src="js/avatar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import {
  auth, fs, rt, whenAuth, isTeacher, teacherLogin, logout, resetPassword, SITE,
  doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, onSnapshot, increment, writeBatch,
  ref, set, update, remove, push, onValue, rquery, limitToLast, rnow, rget, MAPS, mapName, esc, safeUrl, hostOf, errText, toast
} from './js/fb.js';
import { DEF_OX, DEF_MC } from './js/questions.js';
const $ = (id) => document.getElementById(id);
const A = window.MoaAvatar;
const COLORS = ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#9DB8FF', '#FFB86B', '#C7B2FF'];
const LCOL = ['#7FE0E8', '#9BE07A', '#FF8F8F', '#9DB8FF', '#FFD23F', '#D7B5FF'];
const GAMES = [['dodge', '똥 피하기', 1], ['tag', '술래잡기', 0], ['treasure', '보물찾기', 1], ['race', '달리기 경주', 0], ['paint', '땅따먹기', 1], ['chat', '채팅 게임', 1], ['bingo', '빙고', 0], ['zombie', '좀비 탈출', 1], ['bomb', '폭탄 돌리기', 1], ['ox', 'OX 퀴즈', 1]];
const MAX = 20;
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let user = null, classes = [], counts = {}, countOffs = {}, liveOffs = [], home = {}, view = '';

/* ---------- 창 ---------- */
let lastFocus = null;
function openDlg(html, focusSel) {
  lastFocus = document.activeElement;
  $('dlg').innerHTML = '<div class="modal" data-close><div class="pf pad stack" role="dialog" aria-modal="true" aria-labelledby="dlgT">' + html + '</div></div>';
  const f = $('dlg').querySelector(focusSel || 'input,select,textarea,button'); if (f) f.focus();
}
function closeDlg() { $('dlg').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$('dlg').addEventListener('click', (e) => { if (e.target.matches('[data-close]') || e.target.closest('[data-x]')) closeDlg(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('dlg').innerHTML) closeDlg(); });
const dlgTop = (t) => '<div class="row" style="justify-content:space-between"><h2 id="dlgT">' + esc(t) + '</h2><button type="button" class="btn sm" data-x>닫기 ✕</button></div>';
function confirmDlg(title, text, ok, fn) {
  openDlg(dlgTop(title) + '<p class="note" style="color:var(--ink)">' + esc(text) + '</p><div class="row"><button type="button" class="btn red" id="okBtn">' + esc(ok) + '</button><button type="button" class="btn" data-x>그만두기</button></div>', '[data-x]');
  $('okBtn').addEventListener('click', () => { closeDlg(); fn(); });
}

/* ---------- 로그인 ---------- */
// 이메일은 이 컴퓨터에서 한 번 로그인한 뒤에만 미리 채워진다 (다른 컴퓨터·학생 화면에는 안 보임)
const TEACHER_EM_KEY = 'moaTeacherEmail';
function savedEm() { try { return localStorage.getItem(TEACHER_EM_KEY) || ''; } catch (e) { return ''; } }
function drawLogin(msg) {
  $('menu').hidden = true;
  $('view').innerHTML = '<form class="pf pad stack login" id="loginF"><h1 style="font-size:28px">선생님 로그인</h1>' +
    '<label class="lb">이메일<input class="field" id="em" type="email" autocomplete="username" value="' + esc(savedEm()) + '"></label>' +
    '<label class="lb">비밀번호<input class="field" id="pw" type="password" autocomplete="current-password"></label>' +
    '<p class="note" id="lmsg" role="alert" style="color:#B3261E;font-weight:700">' + esc(msg || '') + '</p>' +
    '<button class="btn blue big" type="submit">로그인 ▶</button><button class="btn sm" type="button" id="forgot">비밀번호를 잊었어요</button><p class="note">선생님 계정으로 들어오면 반 만들기, 수업 진행판, 첫 화면 링크를 고칠 수 있어요.</p></form>';
  $(savedEm() ? 'pw' : 'em').focus();
  $('forgot').addEventListener('click', async () => {
    const em = $('em').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $('lmsg').textContent = '선생님 이메일을 먼저 써 주세요.'; return; }
    $('forgot').disabled = true;
    try { await resetPassword(em); $('lmsg').style.color = 'var(--ink)'; $('lmsg').textContent = em + ' 메일함에 \'비밀번호 다시 만들기\' 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정한 뒤 여기서 로그인해 주세요. (안 보이면 스팸함도 봐 주세요)'; }
    catch (err) { $('lmsg').textContent = errText(err); $('forgot').disabled = false; }
  });
  $('loginF').addEventListener('submit', async (e) => {
    e.preventDefault(); $('lmsg').textContent = '';
    try { const u = await teacherLogin($('em').value.trim(), $('pw').value); if (!isTeacher(u)) { await logout(); drawLogin('선생님 계정이 아니에요.'); return; } try { localStorage.setItem(TEACHER_EM_KEY, u.email || ''); } catch (e2) { /* 기억 못 해도 로그인은 됨 */ } start(u); }
    catch (err) { $('lmsg').textContent = errText(err); }
  });
}
$('logout').addEventListener('click', async () => { await logout(); location.href = './'; });

/* ---------- 반 목록 ---------- */
function watchCounts() {
  for (const c of classes) if (!countOffs[c.id]) countOffs[c.id] = onValue(ref(rt, 'live/' + c.id + '/players'), (s) => { counts[c.id] = s.size || 0; if (view === 'classes') drawClasses(); }, () => {});
}
function drawClasses() {
  const cs = classes;
  $('view').innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><h1 style="color:#fff;text-shadow:3px 3px 0 var(--ink);font-size:30px">우리 반 · ' + cs.length + ' / ' + MAX + '</h1></div>' +
    '<div class="grid">' + cs.map((c) => '<article class="pf ccard"><div class="band" style="background:' + esc(c.color || '#FFD23F') + '"><b>' + esc(c.kind || '정규반') + '</b><span class="on"><i aria-hidden="true"></i>접속 ' + (counts[c.id] || 0) + '명</span></div>' +
      '<div class="bd"><h3>' + esc(c.name) + '</h3><div class="meta"><span>방번호 <b>' + esc(c.room || '-') + '</b></span><span>맵 · ' + esc(mapName(c.map || 'classroom')) + '</span></div>' +
      '<div class="row"><a class="btn blue sm" href="#live-' + esc(c.id) + '">진행판 ▶</a><button class="btn sm" type="button" data-qr="' + esc(c.id) + '">QR·링크</button><button class="btn sm" type="button" data-edit="' + esc(c.id) + '">고치기</button></div></div></article>').join('') +
    '<button class="add" type="button" id="newC"' + (cs.length >= MAX ? ' disabled' : '') + '>＋ 새 클래스 만들기<small style="font:500 14px Noto Sans KR,sans-serif">' + (cs.length >= MAX ? '20개가 다 찼어요' : cs.length + ' / ' + MAX + '개') + '</small></button></div>' +
    '<p class="note pf pad" style="color:var(--ink)">학생은 첫 화면에서 방번호 5자리를 누르거나, QR·링크로 바로 들어와요. 클래스는 내 패들렛과 같은 목록이에요.</p></div>';
}
async function freeRoom() {
  const used = new Set(classes.map((c) => c.room));
  for (let i = 0; i < 40; i++) { const r = String(Math.floor(10000 + Math.random() * 90000)); if (used.has(r)) continue; const s = await getDoc(doc(fs, 'rooms', r)); if (!s.exists()) return r; }
  throw new Error('no room');
}
async function classDlg(c) {
  const isNew = !c;
  const d = c ? Object.assign({}, c) : { name: '', kind: '정규반', color: COLORS[classes.length % COLORS.length], map: 'classroom', room: await freeRoom() };
  openDlg(dlgTop(isNew ? '새 클래스' : '클래스 고치기') +
    '<label class="lb">반 이름<input class="field" id="cn" maxlength="24" value="' + esc(d.name) + '" placeholder="예: 4학년 캔바반"></label>' +
    '<div class="lb">반 종류<div class="seg" id="ck">' + ['정규반', '특강반'].map((k) => '<button type="button" class="btn sm" data-v="' + k + '" aria-pressed="' + (d.kind === k) + '">' + k + '</button>').join('') + '</div></div>' +
    '<div class="lb">색<div class="seg" id="cc">' + COLORS.map((x) => '<button type="button" class="btn sm" data-v="' + x + '" aria-pressed="' + (d.color === x) + '" style="background:' + x + ';width:44px" aria-label="색 ' + x + '"></button>').join('') + '</div></div>' +
    '<label class="lb">처음 들어갈 맵<select class="field" id="cm">' + MAPS.map(([id, n]) => '<option value="' + id + '"' + (d.map === id ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
    '<p class="note" style="color:var(--ink)">방번호 <b id="crT">' + esc(d.room) + '</b> <button type="button" class="btn sm" id="newRoom">새 번호로 바꾸기</button></p>' +
    '<div class="row"><button type="button" class="btn blue" id="cSave">' + (isNew ? '만들기 ▶' : '저장하기 ▶') + '</button>' + (isNew ? '' : '<button type="button" class="btn red" id="cDel">이 클래스 지우기</button>') + '</div>', '#cn');
  const pick = (box, key) => $(box).addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; d[key] = b.dataset.v; $(box).querySelectorAll('[data-v]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
  pick('ck', 'kind'); pick('cc', 'color');
  $('newRoom').addEventListener('click', async () => { d.room = await freeRoom(); $('crT').textContent = d.room; });
  $('cSave').addEventListener('click', async () => {
    const name = $('cn').value.trim(); if (!name) { $('cn').focus(); return; }
    if (isNew && classes.length >= MAX) { toast('클래스는 20개까지 만들 수 있어요.', true); return; }
    const id = c ? c.id : uid('c'), map = $('cm').value;
    try {
      await setDoc(doc(fs, 'classes', id), { name, kind: d.kind, color: d.color, room: d.room, map, created: c ? (c.created || new Date().toISOString()) : new Date().toISOString() }, { merge: true });
      await setDoc(doc(fs, 'rooms', d.room), { cid: id, name, color: d.color });
      if (c && c.room && c.room !== d.room) await deleteDoc(doc(fs, 'rooms', c.room));
      closeDlg(); toast(isNew ? '\'' + name + '\' 반을 만들었어요. 방번호 ' + d.room : '저장했어요.');
    } catch (err) { toast(errText(err), true); }
  });
  if (!isNew) $('cDel').addEventListener('click', () => confirmDlg('클래스 지우기', '\'' + c.name + '\' 반과 그 반의 학생 기록·패들렛·실시간 기록을 모두 지워요. 되돌릴 수 없어요.', '모두 지우기', () => deleteClass(c)));
}
async function deleteClass(c) {
  try {
    toast('지우는 중…');
    const bs = await getDocs(query(collection(fs, 'boards'), where('cid', '==', c.id)));
    for (const b of bs.docs) { const ps = await getDocs(query(collection(fs, 'parts'), where('bid', '==', b.id))); for (const p of ps.docs) await deleteDoc(p.ref); await deleteDoc(b.ref); }
    const ss = await getDocs(collection(fs, 'classes', c.id, 'students'));
    for (const s of ss.docs) await deleteDoc(s.ref);
    if (c.room) await deleteDoc(doc(fs, 'rooms', c.room));
    await deleteDoc(doc(fs, 'classes', c.id));
    await remove(ref(rt, 'live/' + c.id));
    const h = home.links || []; if (h.some((l) => l.bid && bs.docs.some((b) => b.id === l.bid))) await setDoc(doc(fs, 'config', 'home'), { links: h.filter((l) => !(l.bid && bs.docs.some((b) => b.id === l.bid))) }, { merge: true });
    toast('\'' + c.name + '\'을 지웠어요.'); location.hash = '#classes';
  } catch (err) { toast(errText(err), true); }
}
function qrDlg(c) {
  const url = SITE + '?r=' + c.room;
  let svg = '';
  try { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); svg = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) { svg = '<p class="note">QR을 만들지 못했어요. 링크를 써 주세요.</p>'; }
  openDlg(dlgTop(c.name + ' 들어오기') + '<div class="qr">' + svg + '<div class="code" aria-label="방번호">' + esc(c.room) + '</div><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a><p class="note">QR을 찍거나 링크를 누르면 방번호 없이 이름 쓰기부터 시작해요.</p></div>' +
    '<div class="row" style="justify-content:center"><button class="btn blue" type="button" id="copyL">링크 복사</button><button class="btn" type="button" id="printQ">인쇄하기</button></div>', '#copyL');
  $('copyL').addEventListener('click', async () => { try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요.'); } catch (e) { toast('복사하지 못했어요. 링크를 길게 눌러 복사해 주세요.', true); } });
  $('printQ').addEventListener('click', () => print());
}

/* ---------- 링크 고치기 (반 링크 · 첫 화면 링크 같이 씀) ---------- */
function linksHTML(list, id) { return listHTML(list, id) + formHTML(id); }
function listHTML(list, id) {
  return '<ul class="list links" id="' + id + '">' + (list.length ? list.map((l, i) => '<li style="' + (l.hide ? 'opacity:.55' : '') + '"><span class="tag" style="background:' + esc(l.c || LCOL[i % LCOL.length]) + '">' + esc(l.bid ? '수업 보드' : (l.site || hostOf(l.u) || '링크')) + '</span><span class="tx"><b>' + esc(l.t || '') + '</b><small>' + esc(l.bid ? '보드 · ' + (l.d || '') : (l.u || '')) + '</small></span>' +
    '<button class="btn sm" type="button" data-up="' + i + '" aria-label="위로">↑</button><button class="btn sm" type="button" data-down="' + i + '" aria-label="아래로">↓</button><button class="btn sm" type="button" data-hide="' + i + '">' + (l.hide ? '보이기' : '숨기기') + '</button><button class="btn sm red" type="button" data-del="' + i + '">지우기</button></li>').join('') : '<li>아직 링크가 없어요.</li>') + '</ul>';
}
function formHTML(id) {
  return '<form class="lform" data-addfor="' + id + '"><label class="lb">제목<input class="field" name="t" maxlength="40" placeholder="예: 책 소개 카드 만들기"></label><label class="lb">사이트 이름 (없어도 돼요)<input class="field" name="site" maxlength="14" placeholder="예: Canva"></label>' +
    '<label class="lb wide">주소<input class="field" name="u" type="url" placeholder="https://"></label><label class="lb wide">짧은 설명 (없어도 돼요)<input class="field" name="d" maxlength="60"></label><div class="wide"><button class="btn blue" type="submit">링크 올리기 ▶</button></div></form>';
}
function bindLinks(id, getList, saveList) { bindList(id, getList, saveList); bindForm(id, getList, saveList); }
function refreshList(id, list, getList, saveList) { const ul = $(id); if (!ul) return; const t = document.createElement('div'); t.innerHTML = listHTML(list, id); ul.replaceWith(t.firstChild); bindList(id, getList, saveList); }
function bindList(id, getList, saveList) {

    '<div class="bars">' + opts.map((o, i) => { const v = q.k === 'ox' ? o : i, n = ans.filter((x) => String(x.a) === String(v)).length, ok = key && String(key.a) === String(v); return '<div class="' + (ok ? 'ok' : '') + '"><span>' + (q.k === 'ox' ? '' : (i + 1) + '. ') + esc(o) + (ok ? ' ✓' : '') + '</span><i style="width:' + (ans.length ? n / ans.length * 100 : 0) + '%"></i><b>' + n + '</b></div>'; }).join('') + '</div>' +
    '<div class="row"><button class="btn yel" type="button" id="qzRev"' + (rev || !key ? ' disabled' : '') + '>정답 공개</button><button class="btn" type="button" id="qzEnd">퀴즈 닫기</button></div>' +
    (rev ? '<p class="note">맞힌 학생: ' + esc(ans.filter((x) => String(x.a) === String(q.ans)).map((x) => x.n).join(', ') || '없음') + '</p>' : '');
  $('qzRev').addEventListener('click', () => { if (key) setSt({ 'quiz/ans': key.a, 'quiz/why': key.why || '' }); });
  $('qzEnd').addEventListener('click', () => setSt({ quiz: null }));
}

/* 게임 결과 */
function watchResults(run) {
  L.resFor = run; L.results = {};
  if (L.resOff) L.resOff();
  L.resOff = onValue(ref(rt, 'live/' + L.cid + '/results/' + run), (s) => { L.results = s.val() || {}; paintResults(); });
  liveOffs.push(L.resOff);
}
function paintResults() {
  if (!L || !$('gmR')) return;
  const rs = Object.entries(L.results || {}).map(([u, v]) => Object.assign({ u }, v));
  if (!L.resFor || !rs.length) { $('gmR').innerHTML = L.st.game ? '<p class="note">학생들이 게임 중이에요. 끝나면 기록이 여기에 떠요.</p>' : ''; return; }
  const gid = rs[0].g, hi = (GAMES.find((x) => x[0] === gid) || [0, 0, 1])[2];
  rs.sort((a, b) => (a.v === null) - (b.v === null) || (hi ? b.v - a.v : a.v - b.v));
  $('gmR').innerHTML = '<h3 style="font-size:18px">' + esc((GAMES.find((x) => x[0] === gid) || [0, '게임'])[1]) + ' 기록 · ' + rs.length + '명</h3><ol class="list">' + rs.map((r, i) => '<li><b>' + (i + 1) + '</b><span class="sp">' + esc(r.n) + '</span><span>' + esc(r.s || '') + '</span></li>').join('') + '</ol>' +
    '<div class="row"><button class="btn sm yel" type="button" id="give">1~3등에게 점수 주기 (3·2·1점)</button></div>';
  $('give').addEventListener('click', async () => {
    const top = rs.filter((r) => r.v !== null && r.k).slice(0, 3);
    try { for (let i = 0; i < top.length; i++) await updateDoc(doc(fs, 'classes', L.cid, 'students', top[i].k), { score: increment(3 - i) }); toast('점수를 줬어요: ' + top.map((r) => r.n).join(', ')); $('give').disabled = true; }
    catch (err) { toast(errText(err), true); }
  });
}

/* ---------- 길 찾기 ---------- */
function route() {
  const h = location.hash.slice(1) || 'classes';
  document.querySelectorAll('[data-nav]').forEach((a) => a.setAttribute('aria-pressed', String(h.startsWith(a.dataset.nav))));
  if (h.startsWith('live-')) { view = 'live'; drawLive(h.slice(5)); }
  else { stopLive(); if (h === 'home') { view = 'home'; drawHome(); } else { view = 'classes'; drawClasses(); } }
}
addEventListener('hashchange', route);
document.addEventListener('click', (e) => {
  const q = e.target.closest('[data-qr]'); if (q) { const c = classes.find((x) => x.id === q.dataset.qr); if (c) qrDlg(c); return; }
  const ed = e.target.closest('[data-edit]'); if (ed) { const c = classes.find((x) => x.id === ed.dataset.edit); if (c) classDlg(c); return; }
  if (e.target.closest('#newC')) { if (classes.length < MAX) classDlg(null).catch((err) => toast(errText(err), true)); }
});

let started = false;
function start(u) {
  if (started) return; started = true; user = u;
  const next = new URLSearchParams(location.search).get('next');
  if (next && /^[a-z]+\.html$/.test(next)) { location.href = next; return; }
  $('menu').hidden = false;
  onSnapshot(collection(fs, 'classes'), (s) => {
    classes = s.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
    watchCounts();
    if (view === 'classes') drawClasses();
    else if (view === 'live' && L) { const c = classes.find((x) => x.id === L.cid); if (!c) route(); else refreshList('clsL', c.links || [], () => (classes.find((x) => x.id === c.id) || {}).links || [], (list) => setDoc(doc(fs, 'classes', c.id), { links: list }, { merge: true })); }
    else if (!view) route();
  }, (err) => { $('view').innerHTML = '<p class="pf pad">' + esc(errText(err)) + '</p>'; });
  onSnapshot(doc(fs, 'config', 'home'), (s) => {
    home = s.exists() ? s.data() : {};
    if (view === 'home') { if ($('homeL')) refreshList('homeL', home.links || [], () => home.links || [], (list) => setDoc(doc(fs, 'config', 'home'), { links: list }, { merge: true })); else drawHome(); }
  }, () => {});
}
(async () => {
  const u = await whenAuth();
  if (isTeacher(u)) start(u); else drawLogin(u && !u.isAnonymous ? '선생님 계정이 아니에요.' : '');
})();
</script>
