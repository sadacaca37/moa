<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© 2026 MOAPANG STUDIO (김은경). All rights reserved. 무단 복제·배포·변경 금지">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>안내장 · 모아팡</title>
<link rel="icon" href="../assets/moa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 부모님이 문자 속 주소를 눌러 보는 안내장 한 장 — 휴대폰에서 크게, 읽기 쉽게 */
:root{color-scheme:light;--ink:#1D2030;--sub:#5B6078;--line:#E3E6EC}
*{box-sizing:border-box}
body{margin:0;background:#FFF8E7;color:var(--ink);font:400 17px/1.75 'Noto Sans KR',sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink)}
.top b{font:400 22px/1 'Jua',sans-serif}
article{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(16,24,40,.12);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:400 clamp(24px,6vw,32px)/1.3 'Jua',sans-serif;overflow-wrap:anywhere}
.date{margin:0;color:var(--sub);font-size:14px}
.pic{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.txt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg{text-align:center;padding:40px 16px;color:var(--sub)}
footer{max-width:720px;margin:0 auto;padding:0 16px 30px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--sub)}
@media print{body{background:#fff}article{box-shadow:none}}
</style>
</head>
<body>
<main>
  <div class="top"><img src="../assets/brand/moapang.webp" alt="" aria-hidden="true"><b>모아팡 안내장</b></div>
  <div id="box"><p class="msg">안내장을 불러오는 중…</p></div>
</main>
<footer><span>© 2026 MOAPANG STUDIO · All rights reserved</span><span>Created by Eunkyung Kim</span></footer>
<script type="module">
import { fs, doc, getDoc, esc } from '../js/fb.js';
const box = document.getElementById('box');
const nid = decodeURIComponent(location.search.slice(1)).replace(/[^A-Za-z0-9]/g, '').slice(0, 20);
const fail = (t) => { box.innerHTML = '<p class="msg">' + esc(t) + '</p>'; };
if (!nid) fail('안내장 주소가 바르지 않아요. 문자 속 주소를 다시 눌러 주세요.');
else {
  try {
    const s = await getDoc(doc(fs, 'notices', nid));
    if (!s.exists()) fail('이 안내장은 지워졌거나 주소가 바르지 않아요.');
    else {
      const v = s.data() || {};
      const at = v.at && v.at.toMillis ? new Date(v.at.toMillis()).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Seoul' }) : '';
      const img = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(v.img || '')) ? v.img : '';
      document.title = (v.title || '안내장') + ' · 모아팡';
      box.innerHTML = '<article><h1>' + esc(v.title || '안내장') + '</h1>' + (at ? '<p class="date">' + esc(at) + '</p>' : '') +
        (img ? '<img class="pic" alt="안내장 사진" src="' + img + '">' : '') +
        '<p class="txt">' + esc(v.text || '') + '</p></article>';
    }
  } catch (e) { fail('안내장을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'); }
}
</script>
</body>
</html>
