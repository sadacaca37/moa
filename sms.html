<script type="module">
import {
  auth, fs, whenAuth, isTeacher, teacherLogin, logout, resetPassword, teacherRole, SITE,
  doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, onSnapshot, serverTimestamp, limit,
  esc, errText, toast, TEACHER_EM_KEY
} from './js/fb.js';
import { runTransaction, deleteField, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $ = (id) => document.getElementById(id);

/* ================= 기본 값 ================= */
const MEMBER_CID = 'tajapang'; // 타자팡 회원 (이름 + 전화번호로 로그인)
const DEF_TPL = '[모아팡] {이름} 학생이 {시각}에 출석했어요.';
const ITER = 300000; // 끝에서 끝 암호(휴대폰 앱과 같은 방식): PBKDF2-SHA1 반복 횟수
const TAB = Math.random().toString(36).slice(2, 10); // 이 창 이름표 (여러 창이 같은 출석에 두 번 보내지 않게)
const OPENED = Date.now();
const CONF = () => doc(fs, 'sms_private', 'conf'); // 주 선생님만 읽고 쓰는 곳 (보안 규칙 기본값)
let conf = { relay: '', user: '', pass: '', phrase: '', auto: true, tpl: DEF_TPL, sign: '', testTo: '', off: {} };
let roster = new Map(); // 학생 id → { id, name, grade, phone, approved }
let today = new Map(); // 오늘 출석 (실시간)
let view = 'attend', viewDn = 0, otherDay = null; // 다른 날 보기
let gwState = { ok: null, msg: '', at: 0 }; // 문자 서버 연결 상태
let paused = ''; // 연결 문제로 자동 보내기를 잠깐 멈춘 이유

/* ================= 작은 도구 ================= */
const kstDn = (t = Date.now()) => Math.floor((t + 9 * 3600e3) / 86400e3);
const kstHour = (t = Date.now()) => new Date(t + 9 * 3600e3).getUTCHours();
const dayLabel = (dn) => { const d = new Date(dn * 86400e3); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + '일월화수목금토'[d.getUTCDay()] + ')'; };
const timeText = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul' });
const dateTime = (t) => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul' });
const ms = (v) => (v && typeof v.toMillis === 'function' ? v.toMillis() : typeof v === 'number' ? v : 0);
const digits = (s) => { let d = String(s || '').replace(/[^0-9]/g, ''); if (/^1[0-9]{9}$/.test(d)) d = '0' + d; if (/^821[0-9]{8,9}$/.test(d)) d = '0' + d.slice(2); return d; };
const okPhone = (s) => /^01[016789][0-9]{7,8}$/.test(digits(s));
const e164 = (s) => '+82' + digits(s).slice(1);
const pretty = (s) => { const d = digits(s); return d.length === 11 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d; };
const masked = (s) => { const d = digits(s); return d.length >= 10 ? d.slice(0, 3) + '-****-' + d.slice(-4) : '-'; };
// 한국 문자 크기 (한글 2바이트): 90바이트까지 단문, 넘으면 장문
const bytes = (s) => { let n = 0; for (const ch of String(s || '')) n += ch.codePointAt(0) > 0x7f ? 2 : 1; return n; };
const fill = (tpl, d) => String(tpl || DEF_TPL).replace(/\{이름\}/g, d.name || '').replace(/\{시각\}/g, timeText(ms(d.at) || Date.now())).replace(/\{날짜\}/g, dayLabel(d.dn || kstDn())).replace(/\{학년\}/g, d.grade ? d.grade + '학년' : '');
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64txt = (t) => b64(new TextEncoder().encode(t));
const rid = (n) => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(n)); return Array.from(r, (x) => a[x % a.length]).join(''); };
const ready = () => !!(conf.relay && conf.user && conf.pass);
const phoneOf = (userId) => { const r = roster.get(userId); return r && okPhone(r.phone) ? digits(r.phone) : ''; };

/* ================= 창 ================= */
let lastFocus = null, dlgLock = false;
function openDlg(html, focusSel) {
  lastFocus = document.activeElement;
  $('dlg').innerHTML = '<div class="modal" data-close><div class="pf pad stack" role="dialog" aria-modal="true" aria-labelledby="dlgT">' + html + '</div></div>';
  const f = $('dlg').querySelector(focusSel || 'input,select,textarea,button'); if (f) f.focus();
}
function closeDlg() { if (dlgLock) return; $('dlg').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$('dlg').addEventListener('click', (e) => { if (e.target.matches('[data-close]') || e.target.closest('[data-x]')) closeDlg(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('dlg').innerHTML) closeDlg(); });
const dlgTop = (t, noX) => '<div class="row" style="justify-content:space-between"><h2 id="dlgT">' + esc(t) + '</h2>' + (noX ? '' : '<button type="button" class="btn sm" data-x>닫기 ✕</button>') + '</div>';
function confirmDlg(title, html, ok, fn) {
  openDlg(dlgTop(title) + '<div class="note" style="color:var(--ink);font-size:15px">' + html + '</div><div class="row"><button type="button" class="btn blue" id="okBtn">' + esc(ok) + '</button><button type="button" class="btn" data-x>그만두기</button></div>', '#okBtn');
  $('okBtn').addEventListener('click', () => { closeDlg(); fn(); });
}

/* ================= 문자 서버 (휴대폰 앱 SMS Gate) ================= */
// 브라우저는 문자 서버에 바로 못 닿아서(CORS) 선생님 구글 계정의 '중계 주소'(Apps Script)를 거쳐 보냄
function cfgErr(m) { const e = new Error(m); e.cfg = true; return e; }
async function gw(method, path, body) {
  if (!ready()) throw cfgErr('휴대폰 연결 설정이 아직 없어요. [⚙️ 휴대폰 연결]에서 넣어 주세요.');
  let r;
  try { r = await fetch(conf.relay, { method: 'POST', body: JSON.stringify({ method, path, auth: b64txt(conf.user + ':' + conf.pass), body: body || null }) }); }
  catch (e) { throw cfgErr('중계 주소에 닿지 않았어요. 인터넷 연결과 중계 주소(…/exec)를 확인해 주세요.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw cfgErr('중계 주소가 맞지 않아요. 배포할 때 \'액세스: 모든 사용자\'로 했는지, 주소가 …/exec 로 끝나는지 확인해 주세요.'); }
  const st = Number(j.status) || 0;
  let data = null; try { data = JSON.parse(j.body); } catch (e) { /* 글자 그대로 */ }
  if (st >= 200 && st < 300) return data;
  if (st === 401 || st === 403) throw cfgErr('휴대폰 앱의 사용자 이름(Username)이나 비밀번호(Password)가 맞지 않아요.');
  if (st === 0) throw cfgErr('문자 서버에 닿지 않았어요: ' + String(j.body || '').slice(0, 80));
  if (st === 429) throw cfgErr('문자를 너무 빨리 보냈어요. 잠시 뒤에 다시 해 주세요.');
  const m = (data && (data.message || data.error)) || String(j.body || '').slice(0, 120) || '오류 ' + st;
  const e = new Error(m); e.status = st; throw e;
}
// 끝에서 끝 암호: 부모님 번호·문자 내용을 휴대폰 앱만 풀 수 있게 (문자 서버·중계 주소는 못 읽음)
let keyBox = null;
async function encKey() {
  if (keyBox && keyBox.phrase === conf.phrase) return keyBox;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(conf.phrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-1' }, base, { name: 'AES-CBC', length: 256 }, false, ['encrypt']);
  return (keyBox = { phrase: conf.phrase, salt, key });
}
async function enc(text) {
  const k = await encKey(), iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = await crypto.subtle.encrypt({ name: 'AES-CBC', iv }, k.key, new TextEncoder().encode(String(text)));
  return '$aes-256-cbc/pbkdf2-sha1/v2$i=' + ITER + '$' + b64(iv) + '$' + b64(k.salt) + '$' + b64(new Uint8Array(ct));
}
const secret = () => !!conf.phrase;
// 보낼 내용 만들기 (여러 명에게 같은 내용이면 한 번만 만들어 씀)
async function makeContent(c) {
  const E = secret() ? enc : async (x) => x;
  if (!c.mms) return { textMessage: { text: await E(c.text) } };
  const m = {};
  if (c.subject) m.subject = await E(c.subject);
  if (c.text) m.text = await E(c.text);
  if (c.img) m.attachments = [{ contentType: 'image/jpeg', name: await E('notice.jpg'), data: await E(c.img) }];
  return { mmsMessage: m };
}
async function sendTo(phone, content, ttl) {
  const msg = Object.assign({ phoneNumbers: [secret() ? await enc(e164(phone)) : e164(phone)], withDeliveryReport: true, ttl: ttl || 86400 }, content);
  if (secret()) msg.isEncrypted = true;
  const r = await gw('POST', 'messages', msg);
  return r && r.id ? r : Object.assign({ id: '' }, r || {});
}

/* ================= 출석부 ================= */
let todayOff = null, todayDn = 0, firstSnap = true;
function watchToday() {
  if (todayOff) todayOff();
  todayDn = kstDn(); firstSnap = true;
  todayOff = onSnapshot(query(collection(fs, 'attend'), where('dn', '==', todayDn)), (snap) => {
    const m = new Map();

    firstSnap = false;

}
function tick() {
  if (kstDn() !== todayDn) { const was = todayDn; watchToday(); if (view === 'attend' && viewDn === was) { viewDn = kstDn(); drawAttend(); } }
  // 연결 문제로 멈췄으면 2분마다 다시 확인해서, 되면 저절로 다시 보냄
  if (paused && ready() && Date.now() - gwState.at > 120000) { checkGateway(true); return; }
  trackStates();
  pump();
}
const nameOf = (d) => d.name || (roster.get(d.userId) || {}).name || '학생';
// 자동으로 보낼 출석: 아직 안 보냄 · 창을 연 뒤(또는 연 때부터 30분 안)에 출석 · 3시간 안 · 아침 7시~밤 9시
function autoOk(d) {
  const at = ms(d.at);
  return !d.sms && at > 0 && at >= OPENED - 30 * 60e3 && Date.now() - at < 3 * 3600e3 && kstHour() >= 7 && kstHour() < 21;
}
const waiting = () => [...today.values()].filter((d) => !d.sms && ms(d.at) > 0 && (!conf.auto || !autoOk(d)));
let pumpBusy = false;
async function pump() {
  if (pumpBusy || !conf.auto || paused || !ready()) return;
  pumpBusy = true;
  try {
    for (let guard = 0; guard < 200; guard++) {
      const next = [...today.values()].filter(autoOk).sort((a, b) => ms(a.at) - ms(b.at))[0];
      if (!next) break;
      const r = await sendAttend(next, false);
      if (r === 'cfg') break;
    }
  } finally { pumpBusy = false; }
}
// 출석 한 명에게 문자 (force: 실패·확인 필요를 다시 보낼 때)
async function sendAttend(d, force) {
  const ref = doc(fs, 'attend', d._id);
  if (conf.off[d.userId] && !force) { try { await updateDoc(ref, { sms: { st: 'off', t: Date.now() } }); } catch (e) { /* 다음에 */ } return 'off'; }
  const phone = phoneOf(d.userId);
  if (!phone) { try { await updateDoc(ref, { sms: { st: 'nophone', t: Date.now() } }); } catch (e) { /* 다음에 */ } return 'nophone'; }
  let mine = false;
  try {
    mine = await runTransaction(fs, async (tx) => {
      const s = await tx.get(ref); const cur = s.exists() ? s.data().sms : null;
      if (cur && !force) return false;
      if (cur && cur.st === 'sending' && Date.now() - ms(cur.t) < 120000) return false;
      tx.update(ref, { sms: { st: 'sending', t: Date.now(), by: TAB } });
      return true;
    });
  } catch (err) { toast('출석 문자를 준비하지 못했어요: ' + errText(err), true); return 'err'; }
  if (!mine) return 'taken';
  try {
    const r = await sendTo(phone, await makeContent({ text: fill(conf.tpl, Object.assign({}, d, { name: nameOf(d) })) }), 3600);
    await updateDoc(ref, { sms: { st: 'queued', mid: r.id || '', t: Date.now() } });
    if (paused) { paused = ''; drawStateBar(); }
    return 'ok';
  } catch (err) {
    if (err.cfg) {
      // 연결 문제면 이 출석은 '아직'으로 되돌리고 자동 보내기를 잠깐 멈춤 (고친 뒤 다시 보냄)
      try { await updateDoc(ref, { sms: deleteField() }); } catch (e) { /* 무시 */ }
      paused = err.message; gwState = { ok: false, msg: err.message, at: Date.now() }; drawStateBar();
      return 'cfg';
    }
    try { await updateDoc(ref, { sms: { st: 'fail', err: String(err.message || '').slice(0, 120), t: Date.now() } }); } catch (e) { /* 무시 */ }
    return 'fail';
  }
}
// 보낸 문자가 휴대폰에서 나갔는지 확인: 한 통에 4번만 (40초·2분·5분·15분 뒤) — 중계 주소를 너무 자주 부르지 않게
const CHECK_AT = [40e3, 120e3, 300e3, 900e3];
const checked = {}; // 문자 번호 → 확인한 횟수 (이 창에서)
let tracking = false;
async function trackStates() {
  if (tracking || !ready() || paused) return;
  tracking = true;
  try {
    for (const d of today.values()) {
      const s = d.sms; if (!s || !s.mid || !['queued', 'processed', 'sent'].includes(s.st)) continue;
      const n0 = checked[s.mid] || 0, age = Date.now() - ms(s.t);
      if (n0 >= CHECK_AT.length || age < CHECK_AT[n0]) continue;
      checked[s.mid] = n0 + 1;
      try {
        const n = await msgState(s.mid);
        if (n.st !== s.st) await updateDoc(doc(fs, 'attend', d._id), { sms: Object.assign({}, s, { st: n.st, err: String(n.err || '').slice(0, 120) }) });
      } catch (e) { if (e.cfg) break; }
    }
  } finally { tracking = false; }
}
async function checkGateway(quiet) {

    if (devs.length && paused) { paused = ''; pump(); }
  } catch (err) {

}

async function reshrink() {

async function shrink(file, maxBytes, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let side = maxSide, blob = null;
    for (let k = 0; k < 7; k++) {
      const s = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      for (const q of [0.86, 0.76, 0.66, 0.56]) { blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q)); if (blob && blob.size <= maxBytes) return blob; }
      side = Math.round(side * 0.8);
    }
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

      await setDoc(doc(fs, 'notices', nid), { title, text: txt, img: S.imgUrl || '', at: serverTimestamp(), test: !!test });
    }
    const content = S.mode === 'link'
      ? await makeContent({ text: linkMsg(title, nid) })
      : (!S.img && bytes(txt) + bytes(title ? '[' + title + '] ' : '') <= 90
        ? await makeContent({ text: (title ? '[' + title + '] ' : '') + txt })
        : await makeContent({ mms: true, subject: title, text: txt, img: S.img }));
    if (!test) {
      logRef = doc(collection(fs, 'sms_log'));
      await setDoc(logRef, { kind: 'notice', title, mode: S.mode, text: txt.slice(0, 500), img: !!S.img, nid, at: serverTimestamp(), total: to.length, done: false, to: to.map((x) => ({ u: x.u, n: x.n, mid: '', st: 'wait' })) });
    }
    for (let i = 0; i < to.length; i++) {
      if (stop) break;
      const x = to[i], li = document.createElement('li');
      li.innerHTML = '<span>' + esc(x.n || '-') + ' <span class="ph">' + esc(masked(x.p)) + '</span></span><span class="st go">보내는 중</span>';
      $('pList').prepend(li);
      $('pTxt').textContent = (i + 1) + ' / ' + to.length + ' 보내는 중…';
      try {
        const r = await sendTo(x.p, content, 86400);
        res.push({ u: x.u, n: x.n, mid: r.id || '', st: 'queued' });
        li.lastChild.className = 'st ok'; li.lastChild.textContent = '휴대폰으로 보냄';
      } catch (err) {
        res.push({ u: x.u, n: x.n, mid: '', st: 'fail', err: String(err.message || '').slice(0, 120) });
        li.lastChild.className = 'st bad'; li.lastChild.textContent = '못 보냄';
        li.title = err.message;
        if (err.cfg) { $('pTxt').textContent = err.message; stop = true; }
      }
      $('pBar').style.width = Math.round(((i + 1) / to.length) * 100) + '%';
    }
    if (logRef) {
      const left = to.slice(res.length).map((x) => ({ u: x.u, n: x.n, mid: '', st: 'stop' }));
      await updateDoc(logRef, { to: res.concat(left), done: true, ok: res.filter((x) => x.st !== 'fail').length, fail: res.filter((x) => x.st === 'fail').length });
    }
  } catch (err) {
    toast((err && err.message) || errText(err), true);
  } finally {
    sendingBatch = false; dlgLock = false;
  }
  const ok = res.filter((x) => x.st !== 'fail').length;
  $('pTxt').innerHTML = '<b>' + (test ? '시험 문자를 휴대폰으로 보냈어요. 받은 문자를 확인해 보세요.' : to.length + '명 중 ' + ok + '명에게 휴대폰으로 보냈어요.') + '</b>' + (res.length - ok ? ' 못 보낸 ' + (res.length - ok) + '명은 [🗂 보낸 기록]에서 볼 수 있어요.' : '') + (test ? '' : ' 휴대폰 앱이 몇 초씩 쉬면서 차례로 보내요.');
  $('pStop').outerHTML = '<button class="btn blue" type="button" data-x>닫기</button>' + (test ? '' : '<button class="btn" type="button" id="toLog">🗂 보낸 기록 보기</button>');
  if ($('toLog')) $('toLog').onclick = () => { closeDlg(); go('log'); };
}

  catch (err) { toast(errText(err), true); }
  if (view !== 'log') return;
  $('view').innerHTML = '<section class="pf pad card"><h2>🗂 보낸 안내장</h2><p class="note">출석 문자는 [📋 출석부]에서 날짜별로 봐요. 여기는 골라서 보낸 안내장이에요.</p>' +
    (items.length ? '<div class="log" id="logL">' + items.map((it) => {
      const to = it.to || [], ok = to.filter((x) => goodSt(x.st)).length, bad = to.filter((x) => x.st === 'fail').length, wait = to.length - ok - bad;
      return '<article data-id="' + esc(it._id) + '"><div class="hd"><b>' + esc(it.title || '(제목 없음)') + '</b><span class="meta">' + esc(dateTime(ms(it.at))) + ' · ' + (it.mode === 'link' ? '링크' : it.img ? '글+사진' : '글') + '</span></div>' +
        '<div class="nums"><span>받는 분 <b>' + to.length + '</b></span><span style="background:#DDF7E3;color:#146C2E">보냄 <b>' + ok + '</b></span>' + (wait ? '<span>확인 중 <b>' + wait + '</b></span>' : '') + (bad ? '<span style="background:#FFE4E1;color:#B42318">못 보냄 <b>' + bad + '</b></span>' : '') + '</div>' +
        '<details><summary>받는 분 보기</summary><ul class="plist">' + to.map((x) => '<li><span>' + esc(x.n || '-') + '</span><span>' + stChip(x.st === 'wait' || x.st === 'stop' ? '' : x.st) + (x.err ? ' <small class="note">' + esc(x.err) + '</small>' : '') + '</span></li>').join('') + '</ul></details>' +
        '<div class="row"><button class="btn sm" type="button" data-chk>상태 새로 보기</button>' + (it.nid ? '<a class="btn sm" href="' + esc(linkUrl(it.nid)) + '" target="_blank" rel="noopener">안내장 열기</a><button class="btn sm" type="button" data-delnote>안내장 링크 지우기</button>' : '') + '<button class="btn sm" type="button" data-again>이 내용으로 다시 쓰기</button></div></article>';
    }).join('') + '</div>' : '<p class="empty">아직 보낸 안내장이 없어요.</p>') + '</section>';
  if (!$('logL')) return;
  $('logL').onclick = async (e) => {
    const art = e.target.closest('article[data-id]'); if (!art) return;
    const it = items.find((x) => x._id === art.dataset.id); if (!it) return;
    if (e.target.closest('[data-chk]')) {
      const b = e.target.closest('[data-chk]'); b.disabled = true;
      const to = (it.to || []).map((x) => Object.assign({}, x));
      for (let i = 0; i < to.length; i++) {
        b.textContent = '확인 중 ' + (i + 1) + '/' + to.length;
        if (!to[i].mid || ['delivered', 'fail'].includes(to[i].st)) continue;
        try { const n = await msgState(to[i].mid); to[i].st = n.st; if (n.err) to[i].err = String(n.err).slice(0, 120); } catch (err) { if (err.cfg) { toast(err.message, true); break; } }
      }
      try { await updateDoc(doc(fs, 'sms_log', it._id), { to }); } catch (err) { toast(errText(err), true); }
      drawLog();
    } else if (e.target.closest('[data-delnote]')) {
      confirmDlg('안내장 링크 지우기', '링크를 지우면 부모님이 문자 속 주소를 눌러도 안내장이 안 보여요.', '지우기', async () => { try { await deleteDoc(doc(fs, 'notices', it.nid)); await updateDoc(doc(fs, 'sms_log', it._id), { nid: '' }); toast('지웠어요'); drawLog(); } catch (err) { toast(errText(err), true); } });
    } else if (e.target.closest('[data-again]')) {
      Object.assign(noticeState, { title: it.title || '', text: String(it.text || '').replace(conf.sign ? '\n\n' + conf.sign : '\u0000', ''), mode: it.mode || 'direct', sel: new Set((it.to || []).map((x) => x.u).filter(Boolean)), file: null, img: null, imgUrl: '' });
      go('notice');
    }
  };
}

/* ================= 휴대폰 연결 ================= */
const RELAY_CODE = `/**
 * 모아팡 문자 중계 (Google Apps Script)
 * 모아팡 '출석·문자' 화면이 보낸 요청을 휴대폰 문자 앱(SMS Gate) 서버로 전해 줍니다.
 * - 앱의 사용자 이름·비밀번호는 여기에 적거나 저장하지 않아요. (요청마다 모아팡이 함께 보내요)
 * - api.sms-gate.app 말고 다른 곳으로는 보내지 않아요.
 */
var API = 'https://api.sms-gate.app/3rdparty/v1/';

function doPost(e) {
  var q;
  try { q = JSON.parse(e.postData.contents); } catch (err) { return out_(400, 'bad json'); }
  var path = String(q.path || '');
  var method = String(q.method || 'GET').toUpperCase();
  if (!/^(messages(\\/[A-Za-z0-9_-]{1,36})?|devices|settings|health)$/.test(path)) return out_(400, 'bad path');
  if (['GET', 'POST', 'PATCH'].indexOf(method) < 0) return out_(400, 'bad method');
  if (!/^[A-Za-z0-9+\\/=]{4,400}$/.test(String(q.auth || ''))) return out_(400, 'bad auth');
  var opt = { method: method.toLowerCase(), headers: { Authorization: 'Basic ' + q.auth }, muteHttpExceptions: true, followRedirects: false };
  if (method !== 'GET') { opt.contentType = 'application/json'; opt.payload = JSON.stringify(q.body || {}); }
  try {
    var r = UrlFetchApp.fetch(API + path, opt);
    return out_(r.getResponseCode(), r.getContentText());
  } catch (err) {
    return out_(0, String(err));
  }
}

function doGet() {
  return out_(200, JSON.stringify({ ok: true, app: 'moapang-sms-relay', v: 1 }));
}

function out_(status, body) {
  return ContentService.createTextOutput(JSON.stringify({ status: status, body: body }))
    .setMimeType(ContentService.MimeType.JSON);
}
`;

    const v = collect(); if (!v) return;
    $('sSave').disabled = true;
    try { await saveConf(v); keyBox = null; toast('저장했어요'); paused = ''; if (ready()) { await checkGateway(); pump(); } } catch (err) { toast(errText(err), true); }
    drawSetup();
  };
  $('sTestBtn').onclick = async () => {
    const v = collect(); if (!v) return;
    if (!v.testTo) { toast('⑤ 시험 받을 번호를 먼저 써 주세요.', true); return; }
    Object.assign(conf, v); keyBox = null;
    $('sTestBtn').disabled = true;
    try { await saveConf(v); const r = await sendTo(v.testTo, await makeContent({ text: '[모아팡] 시험 문자예요. 이 문자가 오면 연결 성공!' }), 3600); toast('휴대폰으로 보냈어요. 잠시 뒤 문자가 오는지 봐 주세요'); watchOne(r.id, '시험 문자'); }
    catch (err) { toast(err.message || errText(err), true); }
    $('sTestBtn').disabled = false;
  };
  $('sPhoto').onclick = async () => {
    const v = collect(); if (!v) return;
    if (!v.testTo) { toast('⑤ 시험 받을 번호를 먼저 써 주세요.', true); return; }
    Object.assign(conf, v); keyBox = null;
    $('sPhoto').disabled = true;
    try {
      await saveConf(v);
      const img = await testImage();
      const r = await sendTo(v.testTo, await makeContent({ mms: true, subject: '모아팡 사진 시험', text: '[모아팡] 사진과 긴 글 시험 문자예요.\n이 문자에 그림이 보이면 안내장을 \'문자에 바로 넣기\'로 보낼 수 있어요.', img }), 3600);
      toast('사진 시험 문자를 휴대폰으로 보냈어요'); watchOne(r.id, '사진 시험 문자');
    } catch (err) { toast(err.message || errText(err), true); }
    $('sPhoto').disabled = false;
  };
  $('sSafe').onclick = async () => {
    const v = collect(); if (!v) return;
    Object.assign(conf, v);
    try { await saveConf(v); await gw('PATCH', 'settings', { messages: { send_interval_min: 3, send_interval_max: 8, limit_period: 'PerDay', limit_value: 450, processing_order: 'FIFO' } }); toast('넣었어요: 문자 사이 3~8초 쉬기, 하루 450통까지, 먼저 온 순서대로'); }
    catch (err) { toast(err.message || errText(err), true); }
  };
}
// 시험용 그림: 색 띠 + 글자 (사진 파일 없이 만들어서 보냄)
async function testImage() {
  const c = document.createElement('canvas'); c.width = 640; c.height = 360;
  const g = c.getContext('2d');
  g.fillStyle = '#FFF8E7'; g.fillRect(0, 0, 640, 360);
  ['#FFD23F', '#7FE0E8', '#9BE07A', '#FF9FB0', '#9DB8FF'].forEach((col, i) => { g.fillStyle = col; g.fillRect(0, i * 24, 640, 24); });
  g.fillStyle = '#1B1F3B'; g.font = 'bold 44px sans-serif'; g.textAlign = 'center'; g.fillText('모아팡 사진 시험', 320, 220); g.font = '26px sans-serif'; g.fillText(dateTime(Date.now()), 320, 270);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  return b64(new Uint8Array(await blob.arrayBuffer()));
}
// 시험 문자 하나가 나갔는지 몇 번 확인해서 알려 줌
async function watchOne(id, label) {
  if (!id) return;
  for (const wait of [8000, 15000, 30000, 60000]) {
    await new Promise((r) => setTimeout(r, wait));
    try {
      const n = await msgState(id);
      if (n.st === 'delivered') { toast('✅ ' + label + ' 도착했어요'); return; }
      if (n.st === 'sent') toast('📤 ' + label + ': 휴대폰에서 보냈어요');
      if (n.st === 'fail') { toast('❌ ' + label + ' 못 보냈어요: ' + (n.err || '휴대폰 앱의 기록을 봐 주세요'), true); return; }
    } catch (e) { return; }
  }
}
